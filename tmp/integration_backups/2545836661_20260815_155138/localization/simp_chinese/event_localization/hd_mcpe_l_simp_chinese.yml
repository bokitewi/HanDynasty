l_simp_chinese:
 mcpe.13.t:0 "恶毒的嘲讽"
 mcpe.13.d.no_bully_fallback:0 "另一个孩子在一群其他孩子面前嘲笑我。他们似乎不知道该如何回应，似乎在等待我做什么……"
 mcpe.13.d.bully:0 "[bully.GetTitledFirstName|U] 在一群其他孩子面前嘲笑我。他们似乎不知道该如何回应，似乎在等待我做什么……"
 mcpe.13.a:0 "我用拳头打那个大嘴的脸！"
 mcpe.13.b:0 "我会记住这一点。总有一天你会付出代价的！"
 mcpe.13.c:0 "这只是言语。没什么可难过的。"
 mcpegr.13.d_bully:0 "[child.GetTitledFirstName|U] 告诉我 [bully.GetTitledFirstName] 在一群其他孩子面前嘲笑 [child.GetHerHim]。\n\n"
 mcpegr.13.d_no_bully_fallback:0 "[child.GetTitledFirstName|U] 告诉我，另一个孩子在一群其他孩子面前嘲笑 [child.GetHerHim]。\n\n"
 mcpegr.13.d_wrathful:0 "[child.GetSheHe|U]立即一拳打在大嘴的脸上！"
 mcpegr.13.d_vengeful:0 "[child.GetSheHe|U] 发誓要记住这一点并有一天报仇！"
 mcpegr.13.d_calm:0 "[child.GetSheHe|U] 表示这只是说说而已，没有什么可难过的。"
 mcpegr.13.confirm_wrathful:0 "对不尊重的适当回应。"
 mcpegr.13.confirm_vengeful:0 "很好。侮辱是不应该被忘记或被原谅的。"
 mcpegr.13.confirm_calm:0 "一个明智的决定。言语无法伤害[child.GetHerHim]”。"
 mcpegr.13.wrathful_change:0 "[child.GetFirstNameNoTooltip|U]不应该忍住[child.GetHerHis]的愤怒！"
 mcpegr.13.vengeful_change:0 "[child.GetFirstNameNoTooltip|U] 应该记住这一点，并让他们有一天付出代价。"
 mcpegr.13.calm_change:0 "[child.GetFirstNameNoTooltip|U] 不应该因为言语而如此沮丧。"
 mcpe.14.t:0 "无爱的婚姻"
 mcpe.14.d:0 "我注意到我们的仆人中有一对已婚夫妇正在打架。两人似乎都已经忘记了事情的起因，但​​肯定是因为一些小事。现在，他们公开地互相尖叫，说对方有多可怕，而且他们似乎都同意，彼此结婚是他们一生中最大的错误。"
 mcpe.14.a:0 "如果爱情就是这样，我不想要。"
 mcpe.14.b:0 "这只能说明人们只关心自己。"
 mcpe.14.c:0 "他们只需要花一些时间互相倾听！"
 mcpegr.14.d:0 "[child.GetTitledFirstName|U]似乎目睹了我们仆人中的一对已婚夫妇正在打架。他们因任何琐事公开互相尖叫，并公开宣称结婚是他们一生中最大的错误而闻名。\n\n"
 mcpegr.14.d_chaste:0 "[child.GetFirstNameNoTooltip|U] 说如果这就是 lave 的样子，[child.GetSheHe] 不想要它。"
 mcpegr.14.d_cynical:0 "[child.GetFirstNameNoTooltip|U] 说这只是表明人们只关心自己。"
 mcpegr.14.d_patient:0 "[child.GetFirstNameNoTooltip|U] 表示，只要他们花一些时间互相倾听，他们所有的问题都可以解决。"
 mcpegr.14.confirm_chaste:0 "这是可以理解的反应。"
 mcpegr.14.confirm_cynical:0 "值得吸取的宝贵教训。"
 mcpegr.14.confirm_patient:0 "如果他们有这么聪明就好了……"
 mcpegr.14.chaste_change:0 "如果这就是爱情，你真的想要爱情吗？"
 mcpegr.14.cynical_change:0 "这只能说明人们只关心自己。"
 mcpegr.14.patient_change:0 "他们只需要花一些时间互相倾听！"
 mcpe.15.t:0 "无聊的讲座"
 mcpe.15.d:0 "我必须坐下来听一堂“极其”无聊的讲座。我的导师说得非常慢，而且语气非常复杂，以至于到了句末我什至不记得它是如何开始的。我为什么还要坐在这里？我应该说些什么吗..？"
 mcpe.15.a:0 "进入正题吧，这太无聊了！"
 mcpe.15.b:0 "我必须尝试集中注意力，即使这很困难。"
 mcpe.15.c:0 "编一个借口离开，然后又编一个不回来的借口。"
 mcpegr.15.d:0 "[child.GetTitledFirstName|U] 不得不听一位臭名昭著的无聊导师的讲座。参加这样的讲座就像是一种成人仪式，所以我很好奇 [child.GetFirstNameNoTooltip] 会如何处理它。\n\n"
 mcpegr.15.d_impatient:0 "事实证明，[child.GetSheHe] 打断了导师的讲课，并抱怨这很无聊。"
 mcpegr.15.d_diligent:0 "令人惊讶的是，[child.GetSheHe] 在整个过程中居然能够集中注意力！"
 mcpegr.15.d_deceitful:0 "[child.GetSheHe|U]只是编了个借口离开，然后又编了一个不回来的借口。"
 mcpegr.15.confirm_impatient:0 "是的，[child.GetSheHe] 不应该让任何人浪费 [child.GetHerHis] 时间！"
 mcpegr.15.confirm_diligent:0 "非常令人印象深刻，[child.GetFirstNameNoTooltip]。"
 mcpegr.15.confirm_deceitful:0 "哈！多么有创意啊，[child.GetFirstNameNoTooltip]！"
 mcpegr.15.impatient_change:0 "[child.GetFirstNameNoTooltip|U] 不应该让任何人浪费 [child.GetHerHis] 时间！"
 mcpegr.15.diligent_change:0 "[child.GetFirstNameNoTooltip|U] 应该更加努力学习！"
 mcpegr.15.deceitful_change:0 "[child.GetFirstNameNoTooltip|U]应该只是找个借口离开！"
 mcpe.16.t:0 "迷恋在城里"
 mcpe.16.d.no_crush:0 "我爱上了一个普通的[child.Custom('servant_for_romance')]。他们的家人很快就要离开，所以我们可能不会再见面了。我应该怎么办？"
 mcpe.16.d.crush:0 "我爱上了[crush.GetTitledFirstName]，[crush.GetSheHe]住在我们的小镇。这可能是我的机会，但我也有点害怕。我应该怎么办？"
 mcpe.16.a:0 "试着找个机会表白我的感受。"
 mcpe.16.b:0 "是时候在不露面的情况下进行一些间谍活动了......"
 mcpe.16.c:0 "把自己锁在房间里，希望没有人注意到我。"
 mcpegr.16.d:0 "[child.GetTitledFirstName|U]似乎爱上了[crush.GetTitledFirstName]，而[crush.GetSheHe]住在我们的小镇。\n\n"
 mcpegr.16.d.no_crush:0 "[child.GetTitledFirstName|U]似乎爱上了一个普通的[child.Custom('servant_for_romance')].\n\n"
 mcpegr.16.d_brave:0 "[child.GetFirstNameNoTooltip|U]实际上坦白了[child.GetHerHis]的感情。"
 mcpegr.16.d_lustful:0 "[child.GetFirstNameNoTooltip|U]花了很多时间试图在不透露[child.GetHerHim]本人的情况下监视[child.GetHerHis]暗恋对象。"
 mcpegr.16.d_shy:0 "[child.GetFirstNameNoTooltip|U]刚刚将[child.GetHerHim]自己锁在[child.GetHerHis]房间里，希望没有人会注意到[child.GetHerHim]。"
 mcpegr.16.confirm_brave:0 "到底应该怎样做。"
 mcpegr.16.confirm_lustful:0 "哈！这是一个成人仪式。"
 mcpegr.16.confirm_shy:0 "这是可以理解的反应。"
 mcpegr.16.brave_change:0 "[child.GetFirstNameNoTooltip|U]应该坦白[child.GetHerHis]的感受！"
 mcpegr.16.lustful_change:0 "[child.GetFirstNameNoTooltip|U]刚刚传递了一个绝佳的间谍机会。"
 mcpegr.16.shy_change:0 "[child.GetFirstNameNoTooltip|U] 应该住在 [child.GetHerHis] 房间！"
 mcpe.17.t:0 "强盗的苏醒"
 mcpe.17.d:0 "我发现我们一位仆人的孩子在角落里哭泣。当我走近时，他们抬头看着我，结结巴巴地说一些在外面市场上买食物时被抢劫的事情，然后继续哭泣。"
 mcpe.17.a:0 "没想到外面这么危险"
 mcpe.17.b:0 "嗯，这听起来不像是“我的”问题。"
 mcpe.17.c:0 "加油，我会和你分享一些我自己做的食物。"
 mcpegr.17.d:0 "[child.GetTitledFirstName|U] 发现我们一名仆人的孩子在市场上购买食物时被抢劫后哭泣。当我问 [child.GetFirstNameNoTooltip] [child.GetSheHe] 对此有何看法时，[child.GetSheHe] 说：\n\n"
 mcpegr.17.d_craven:0 "“我不知道外面这么危险。我们应该更加小心。”"
 mcpegr.17.d_callous:0 "“这不是我的问题。这个仆人为什么要拿这个来烦我？”"
 mcpegr.17.d_generous:0 "“我们应该和仆人们分享一些自己的食物。这是我们至少可以做的，让他们高兴起来！”"
 mcpegr.17.confirm_craven:0 "是的，那里确实很危险。"
 mcpegr.17.confirm_callous:0 "绝对的。这根本不是我们的问题。"
 mcpegr.17.confirm_generous:0 "与他们分享是正确的事情。"
 mcpegr.17.craven_change:0 "难道你不知道外面有多危险吗？"
 mcpegr.17.callous_change:0 "但这为什么是我们的问题呢？"
 mcpegr.17.generous_change:0 "我们应该与仆人分享我们的食物。"
 mcpe.18.t:0 "外国美食"
 mcpe.18.d:0 "在当地的一次宴会上，我被邀请品尝一种昂贵的外国美食。我急切地尝试了一些，但立即意识到：味道太糟糕了。不过，我*很*饿，如果我告诉人们我不喜欢他们昂贵的食物，他们可能会受到侮辱......"
 mcpe.18.a:0 "我可能吃得更好，但食物仍然是食物。"
 mcpe.18.b:0 "这“美味”，实在是太垃圾了！"
 mcpe.18.c:0 "我想我不太喜欢这种美味的食物......"
 mcpegr.18.d:0 "[child.GetTitledFirstName|U]参加了当地的一场盛宴，[child.GetSheHe]受邀品尝了昂贵的外国美食。从[child.GetHerHis]的表情来看，[child.GetSheHe]似乎不太喜欢。\n\n"
 mcpegr.18.d_gluttonous:0 "[child.GetSheHe|U]还是继续吃。"
 mcpegr.18.d_honest:0 "[child.GetSheHe|U]告诉大家，这种所谓的“美味”其实味道很垃圾。"
 mcpegr.18.d_temperate:0 "[child.GetSheHe|U] 似乎得出结论，高档食物并不适合 [child.GetHerHim]。"
 mcpegr.18.confirm_gluttonous:0 "好吧，糟糕的食物仍然是食物。"
 mcpegr.18.confirm_honest:0 "没错！你告诉他们，[child.GetFirstNameNoTooltip]！"
 mcpegr.18.confirm_temperate:0 "一个人应该只吃必需的东西。"
 mcpegr.18.gluttonous_change:0 "糟糕的食物仍然是食物！"
 mcpegr.18.honest_change:0 "[child.GetFirstNameNoTooltip|U] 应该只是说食物很糟糕！"
 mcpegr.18.temperate_change:0 "也许精致的食物不适合 [child.GetFirstNameNoTooltip]。"
 mcpe.19.t:0 "判断"
 mcpe.19.d:0 "一个卑鄙的小偷闯入了我的房间，毁掉了我的很多财物，同时贪婪地挖掘着贵重物品。闯入者很快就被守卫抓住了，但现在我不知道应该受到什么惩罚。我当然生气，但是这个小偷到底该受到什么命运呢？"
 mcpe.19.a:0 "您必须努力修复您造成的损害。"
 mcpe.19.b:0 "我会很高兴让你受苦！"
 mcpe.19.c:0 "你只需要保证不再这样做。"
 mcpegr.19.d:0 "一名卑鄙小偷闯入了[child.GetFirstNamePossessiveNoTooltip]的房间，在贪婪地挖掘贵重物品的同时，毁坏了[child.GetHerHis]的大量财物。入侵者很快被警卫抓住，[child.GetFirstNameNoTooltip]向[child.GetHerHis]提出了应该受到何种惩罚的意见。\n\n"
 mcpegr.19.d_just:0 "[child.GetSheHe|U] 认为小偷应该努力修复他们造成的损坏。"
 mcpegr.19.d_sadistic:0 "[child.GetSheHe|U]想让小偷尽可能多地受苦。"
 mcpegr.19.d_forgiving:0 "[child.GetSheHe|U] 只要他们保证不再这样做，就会放走小偷。"
 mcpegr.19.confirm_just:0 "对犯罪行为给予合理的处罚。"
 mcpegr.19.confirm_sadistic:0 "是的。让他们真的后悔不已。"
 mcpegr.19.confirm_forgiving:0 "多么仁慈啊。"
 mcpegr.19.just_change:0 "不，罪应刑罚相适应！"
 mcpegr.19.sadistic_change:0 "不行，让他们受苦吧！"
 mcpegr.19.forgiving_change:0 "不，要仁慈、宽恕！"
 mcpe.20.t:0 "新玩具"
 mcpe.20.d:0 "[guardian.GetTitledFirstName|U] 带我去市场寻找新玩具。这里有很多商家，我知道我可以挑选我想要的玩具。我应该选择什么？"
 mcpe.20.a:0 "这些玩具对我来说都不够好！"
 mcpe.20.b:0 "我正在寻找最昂贵的！"
 mcpe.20.c:0 "我想要那个！等等，不对，是这个！等等，我其实想要这个！"
 mcpegr.20.d:0 "我已将 [child.GetTitledFirstName] 带到市场寻找新玩具。\n\n"
 mcpegr.20.d_arrogant:0 "[child.GetSheHe|U]表示，整个市场上没有一个玩具对[child.GetHerHim]来说足够好。"
 mcpegr.20.d_greedy:0 "[child.GetSheHe|U] 故意挑选最贵的一个，因为我知道我将是支付它的人。"
 mcpegr.20.d_fickle:0 "[child.GetSheHe|U] 似乎无法决定，而是每次 [child.GetSheHe] 看到新的意见时都会改变 [child.GetHerHis] 的意见。"
 mcpegr.20.confirm_arrogant:0 "也罢。"
 mcpegr.20.confirm_greedy:0 "[child.GetFirstNameNoTooltip|U] 懂得珍惜财富。"
 mcpegr.20.confirm_fickle:0 "保持开放的心态是件好事。"
 mcpegr.20.arrogant_change:0 "[child.GetFirstNameNoTooltip|U]应该有更高的标准！"
 mcpegr.20.greedy_change:0 "[child.GetFirstNameNoTooltip|U]应该学会珍惜财富！"
 mcpegr.20.fickle_change:0 "[child.GetFirstNameNoTooltip|U]应该学会保持开放的心态！"
 mcpe.21.t:0 "土地之旅"
 mcpe.21.d:0 "我正在和[guardian.GetTitledFirstName]一起游览我家的土地，以帮助我熟悉地理和人民。当我们快要完成时，[guardian.GetSheHe] 问我是否还有什么想做的。"
 mcpe.21.a:0 "我想和一些当地人交谈！"
 mcpe.21.b:0 "人们用奇怪的眼神看着我们。我们回家吧。"
 mcpe.21.c:0 "没什么，今天的事情我已经累了。"
 mcpegr.21.d:0 "我带着[child.GetTitledFirstName]参观[child.GetHerHis]家族的土地，以帮助[child.GetHerHim]熟悉地理和人民。当我们快要完成时，我问 [child.GetSheHe] 是否还有什么想做的事情。\n\n"
 mcpegr.21.d_gregarious:0 "[child.GetFirstNameNoTooltip|U] 表示，[child.GetSheHe] 想与一些当地人交谈，以便更好地了解他们。"
 mcpegr.21.d_paranoid:0 "[child.GetFirstNameNoTooltip|U] 看起来很担心，并说人们用奇怪的眼神看着我们，所以我们应该回家了。"
 mcpegr.21.d_lazy:0 "[child.GetFirstNameNoTooltip|U]什么也不想做，因为[child.GetSheHe]已经因为一天的活动而感到疲倦。"
 mcpegr.21.confirm_gregarious:0 "好主意！"
 mcpegr.21.confirm_paranoid:0 "你永远不能太谨慎。"
 mcpegr.21.confirm_lazy:0 "是的，我们休息吧。"
 mcpegr.21.gregarious_change:0 "[child.GetSheHe|U] 应该与一些当地人交谈！"
 mcpegr.21.paranoid_change:0 "[child.GetSheHe|U]应该更担心[child.GetHerHis]的安全！"
 mcpegr.21.lazy_change:0 "[child.GetSheHe|U] 应该享受应有的休息。"
 mcpe.22.t:0 "罪的工价"
 mcpe.22.d:0 "一直有传言称，该地区有一个隐居的人秘密地过着罪恶的生活，不尊重神圣的秩序。这些指控从来没有任何确凿的证据，但最近，他们的家发生了火灾。我心里想："
 mcpe.22.a:0 "明确警告不要亵渎神圣！"
 mcpe.22.b:0 "光是谣言并不能成为看不起别人的理由！"
 mcpe.22.c:0 "无论人们怎么说，我们都应该帮助他们重建！"
 mcpegr.22.d:0 "一直有传言称，该地区有一个隐居的人秘密地过着罪恶的生活，不尊重神圣的秩序。这些指控从来没有任何确凿的证据，但最近，他们的家发生了火灾。 [child.GetTitledFirstName|U] 告诉我：\n\n"
 mcpegr.22.d_zealous:0 "“这是对不敬神的明确警告！这个罪人得到了他们应得的报应！”"
 mcpegr.22.d_humble:0 "“光是谣言并不能成为看不起别人的理由！我们不应该假装了解他们的真实性格！”"
 mcpegr.22.d_compassionate:0 "“我们应该帮助这个可怜的灵魂重建他们的家园！不管人们说什么！”"
 mcpegr.22.confirm_zealous:0 "是的，罪人将会得到他们应得的报应！"
 mcpegr.22.confirm_humble:0 "是的，我们不应该看不起别人。"
 mcpegr.22.confirm_compassionate:0 "是的，我们应该永远帮助那些有需要的人。"
 mcpegr.22.zealous_change:0 "[child.GetFirstNameNoTooltip|U]不应该质疑神的意志！"
 mcpegr.22.humble_change:0 "[child.GetFirstNameNoTooltip|U]不知道他们的真实性格！"
 mcpegr.22.compassionate_change:0 "[child.GetFirstNameNoTooltip|U] 应该帮助有需要的可怜的灵魂！"
 mcpe.23.t:0 "短课"
 mcpe.23.d:0 "我正在和导师一起学习，当我注意到其他孩子在外面玩耍时，他们似乎玩得很开心。导师注意到我注意力不集中，并提出让我今天早点结束。 “我保证，如果有人问起你，我会说因为我，课程提前结束了。”他们说。"
 mcpe.23.a:0 "谢谢！"
 mcpe.23.b:0 "不，我答应过要学完课的，我一定会学完的。"
 mcpe.23.c:0 "不管你怎么说，我还是要去。"
 mcpegr.23.d:0 "我注意到一些孩子在外面玩耍，看起来玩得很开心。 [child.GetTitledFirstName|U]不在其中，因为[child.GetSheHe]现在应该正在学习。\n\n"
 mcpegr.23.d_trusting:0 "然而，我很快就看到 [child.GetHerHim] 加入了其他孩子的行列。导师后来告诉我，那天课程刚好结束得很早。"
 mcpegr.23.d_stubborn:0 "事实上，[child.GetHerHim] 没有加入其他孩子并继续学习。导师后来告诉我，[child.GetFirstNameNoTooltip]坚持要完成课程，因为这就是[child.GetSheHe]说的[child.GetSheHe]会做的事情。"
 mcpegr.23.d_arbitrary:0 "然而，我很快就看到 [child.GetHerHim] 加入了其他孩子的行列。导师后来告诉我，[child.GetFirstNameNoTooltip] 未经许可就离开了。"
 mcpegr.23.confirm_trusting:0 "有时课程提前结束。"
 mcpegr.23.confirm_stubborn:0 "是的。始终坚持计划，[child.GetFirstNameNoTooltip]！"
 mcpegr.23.confirm_arbitrary:0 "为什么 [child.GetFirstNameNoTooltip] 需要许可？"
 mcpegr.23.trusting_change:0 "[child.GetFirstNameNoTooltip|U] 应该直接要求离开！"
 mcpegr.23.stubborn_change:0 "[child.GetFirstNameNoTooltip|U] 应该坚持上课！"
 mcpegr.23.arbitrary_change:0 "[child.GetFirstNameNoTooltip|U] 应该直接走开！"
 mcpe.24.t:0 "梦想"
 mcpe.24.d:0 "我从最梦幻的梦中醒来。在我忘记之前想一想，我记得在梦中我扮演了像亚历山大大帝这样强大的征服者的角色。回想是什么让这个梦想如此伟大，我记得……"
 mcpe.24.a:0 "......我拥有的权力和尊重。"
 mcpe.24.b:0 "......我拥有的数不尽的财富。"
 mcpe.24.c:0 "...我的人民的笑容，过着幸福而充实的生活。"
 mcpegr.24.d:0 "[child.GetTitledFirstName|U] 告诉我 [child.GetSheHe] 昨晚做了一个梦。 [child.GetSheHe|U] 扮演了一个强大的统治者的角色，统治着广阔的领域。\n\n"
 mcpegr.24.d_ambitious:0 "[child.GetSheHe|U] 表示，这个梦想最好的部分是 [child.GetSheHe] 所拥有的力量和尊重，并希望在现实世界中实现同样的目标。"
 mcpegr.24.d_greedy:0 "[child.GetSheHe|U] 表示，这个梦想最棒的部分是 [child.GetSheHe] 拥有的数不清的财富，并希望在现实世界中实现同样的目标。"
 mcpegr.24.d_compassionate:0 "[child.GetSheHe|U] 表示，这个梦想最好的部分是 [child.GetHerHis] 人们过着幸福而充实的生活的笑容。 [child.GetSheHe|U]现在希望让人们在清醒的世界里也能像这样幸福。"
 mcpegr.24.confirm_ambitious:0 "权力是一件值得努力的好东西。"
 mcpegr.24.confirm_greedy:0 "财富是一件值得努力去争取的好东西。"
 mcpegr.24.confirm_compassionate:0 "幸福是一件值得努力去争取的好事情。"
 mcpegr.24.ambitious_change:0 "你应该寻求权力！"
 mcpegr.24.greedy_change:0 "你应该寻求财富！"
 mcpegr.24.compassionate_change:0 "你应该去寻求幸福！"
 mcpe.25.t:0 "跟踪者"
 mcpe.25.d:0 "最近，我注意到一个常见的 [child.Custom('servant_for_romance')] 偷偷地跟着我，远远地盯着我，当我似乎注意到时，它很快就躲到了某个地方。难道我有一个秘密的爱慕者吗？"
 mcpe.25.a:0 "我绝对喜欢这种关注！"
 mcpe.25.b:0 "这让我真的很不舒服。"
 mcpe.25.c:0 "……他们可能想谋杀我。"
 mcpegr.25.d:0 "最近，我注意到一个常见的[child.Custom('servant_for_romance')]偷偷地跟踪[child.GetTitledFirstName|U]，从远处盯着[child.GetHerHim]，当[child.GetSheHe]似乎注意到时，迅速躲到某处。看来[child.GetFirstNameNoTooltip|U]有崇拜者了。\n\n"
 mcpegr.25.d_lustful:0 "看样子，[child.GetSheHe]似乎很享受这种关注。"
 mcpegr.25.d_chaste:0 "这种情况让[child.GetHerHim]真的很不舒服。"
 mcpegr.25.d_paranoid:0 "然而，[child.GetSheHe]似乎得出的结论是，这意味着有人试图谋杀[child.GetHerHim]。"
 mcpegr.25.confirm_lustful:0 "为什么 [child.GetSheHe] 不应该享受它？"
 mcpegr.25.confirm_chaste:0 "正如它应该的那样。这是不恰当的。"
 mcpegr.25.confirm_paranoid:0 "是的，外表可能具有欺骗性。"
 mcpegr.25.lustful_change:0 "[child.GetFirstNameNoTooltip|U] 应该享受关注！"
 mcpegr.25.chaste_change:0 "[child.GetFirstNameNoTooltip|U]应该拒绝这些诱惑！"
 mcpegr.25.paranoid_change:0 "[child.GetFirstNameNoTooltip|U]应该更加关心[child.GetHerHis]的安全！"
 mcpe.26.t:0 "到外面散步"
 mcpe.26.d:0 "其他一群孩子建议我和他们一起偷偷溜出城堡去野外呆一段时间，以证明我可以在现实世界中照顾自己，不用一群守卫一直看着我……如果我敢的话，那就是。"
 mcpe.26.a:0 "为什么不呢？我不害怕外面的现实世界！"
 mcpe.26.b:0 "没有看守就出去吗？不可能，那很“危险”！"
 mcpe.26.c:0 "当然。但为了以防万一，一些谨慎的警卫会跟着我们。"
 mcpegr.26.d:0 "昨天我找不到 [child.GetTitledFirstName|U]。当我四处打听时，我发现[child.GetSheHe]最后一次被看到是和一群其他孩子一起，他们似乎一起溜出了城堡。\n\n"
 mcpegr.26.d_brave:0 "今天，[child.GetFirstNameNoTooltip|U] 和其他孩子一起再次出现。他们似乎对 [child.GetHerHis] 的勇敢印象深刻，并向任何愿意倾听的人讲述他们的冒险故事。"
 mcpegr.26.d_craven:0 "今天，我发现 [child.GetFirstNameNoTooltip|U] 藏在一个旧衣柜里。显然[child.GetSheHe]害怕其他孩子会带着[child.GetHerHim]去一些危险的地方。"
 mcpegr.26.d_deceitful:0 "今天，[child.GetFirstNameNoTooltip|U] 和其他孩子一起再次出现。一些警卫随后告诉我，[child.GetSheHe]要求他们小心地跟随这群人，以确保他们的安全。"
 mcpegr.26.confirm_brave:0 "哈！ [child.GetFirstNameNoTooltip|U]什么都不怕！"
 mcpegr.26.confirm_craven:0 "[child.GetFirstNameNoTooltip|U] 知道如何避免麻烦。"
 mcpegr.26.confirm_deceitful:0 "表现出勇敢，没有不必要的风险。聪明的。"
 mcpegr.26.brave_change:0 "[child.GetFirstNameNoTooltip|U]应该证明[child.GetHerHis]的勇敢！"
 mcpegr.26.craven_change:0 "[child.GetFirstNameNoTooltip|U] 应该远离麻烦！"
 mcpegr.26.deceitful_change:0 "[child.GetFirstNameNoTooltip|U]应该只是撒谎了！"
 mcpe.27.t:0 "葬礼"
 mcpe.27.d:0 "我们家一位值得信赖的仆人最近去世了。当我参加葬礼时，我想到，想象一个一直在那里、我认为理所当然的人现在将永远从我们的生活中消失是多么奇怪。当我思考每个人都会死去的现实时，我心里想……"
 mcpe.27.a:0 "……没有神圣的指引，我们什么都不是。"
 mcpe.27.b:0 "……权力和荣耀最终都毫无意义。"
 mcpe.27.c:0 "……这个葬礼既无聊又烦人。"
 mcpegr.27.d:0 "我们家一位值得信赖的仆人最近去世了。 [child.GetTitledFirstName|U]在参加葬礼时似乎陷入了沉思，所以我问[child.GetHerHim] [child.GetSheHe]对仆人的生死有什么想法。\n\n"
 mcpegr.27.d_zealous:0 "[child.GetSheHe|U]回应称，这次葬礼让[child.GetHerHim]意识到，如果没有神圣的指引，我们短暂的生命都是毫无意义的，我们需要奉献自己的信仰，才能找到人生的目标。"
 mcpegr.27.d_content:0 "[child.GetSheHe|U]回应称，这次葬礼让[child.GetHerHim]意识到，争取权力和荣耀是多么的没有意义。最终，我们都会死，然后这些东西对我们来说就不再有任何价值了。"
 mcpegr.27.d_callous:0 "[child.GetSheHe|U]回应称，这个葬礼既无聊又烦人，[child.GetSheHe]不明白为什么[child.GetSheHe]必须参加它。毕竟，死了的人也不需要有人陪伴。"
 mcpegr.27.confirm_zealous:0 "明智地说，[child.GetFirstNameNoTooltip|U]。"
 mcpegr.27.confirm_content:0 "是的，权力和荣耀总是转瞬即逝。"
 mcpegr.27.confirm_callous:0 "我同意。为什么我们必须在那里？"
 mcpegr.27.zealous_change:0 "这是一个重要的宗教仪式！"
 mcpegr.27.content_change:0 "权力和荣耀总是转瞬即逝！"
 mcpegr.27.callous_change:0 "为什么还要关心这个葬礼？"
 mcpe.28.t:0 "旅行商人"
 mcpe.28.d:0 "一位旅行商人来到我们的城堡，立即问我是否愿意参观展示的所有异国商品。这里有各种异国情调的食物、玩具和小饰品。对于其中的每一件，商人都可以讲述一个关于其起源的惊人故事，以及将其纳入收藏的大胆冒险。当[guardian.GetTitledFirstName]到达时，商家询问我是否找到了我想要的东西。"
 mcpe.28.a:0 "这食物看起来很好吃！我想尝试一下！"
 mcpe.28.b:0 "我想要这个神秘的幸运符！"
 mcpe.28.c:0 "我并不傻。我不会相信这些谎言。"
 mcpegr.28.d:0 "一位旅行商人到达了我们的城堡，并立即开始与 [child.GetTitledFirstName|U] 谈论展示的所有异国商品。\n\n"
 mcpegr.28.d_gluttonous:0 "[child.GetSheHe|U]似乎对所有神秘的好运符等不感兴趣，但对看起来美味的异国食物非常感兴趣。"
 mcpegr.28.d_trusting:0 "[child.GetSheHe|U] 要我从遥远的地方购买 [child.GetHerHim] 神秘的幸运符。"
 mcpegr.28.d_cynical:0 "[child.GetSheHe|U] 表示，[child.GetSheHe] 并不傻，能够看穿商家关于这些物品所谓的神秘力量的谎言。"
 mcpegr.28.confirm_gluttonous:0 "吃得好没什么不好！"
 mcpegr.28.confirm_trusting:0 "当然可以，随心所欲。"
 mcpegr.28.confirm_cynical:0 "[child.GetFirstNameNoTooltip|U] 并不那么容易被欺骗。"
 mcpegr.28.gluttonous_change:0 "你应该尝尝这里的食物，[child.GetFirstNameNoTooltip|U]！"
 mcpegr.28.trusting_change:0 "你应该拿走好运符！"
 mcpegr.28.cynical_change:0 "你怎么会相信这些谎言呢？"
 mcpe.29.t:0 "款待"
 mcpe.29.d:0 "一位旅行者和他的家人来到了我们的城堡。他们因长途旅行而疲惫不堪，打算在此停留几晚。他们的一个孩子走近我，询问如何感谢我们的热情款待。"
 mcpe.29.a:0 "不需要感谢我们。"
 mcpe.29.b:0 "你能帮我做一些家务吗？"
 mcpe.29.c:0 "……你为什么跟我说话？"
 mcpegr.29.d:0 "一位旅行者和他的家人来到了我们的城堡。他们因长途旅行而疲惫不堪，打算在此停留几晚。显然，他们的一个孩子已经找到 [child.GetTitledFirstName|U] 并询问 [child.GetHerHim] 他们如何感谢我们的盛情款待。\n\n"
 mcpegr.29.d_just:0 "[child.GetFirstNameNoTooltip|U]表示不需要感谢我们，我们只是尽到了热情好客的义务。"
 mcpegr.29.d_lazy:0 "[child.GetFirstNameNoTooltip|U] 询问他们是否可以为 [child.GetHerHim] 做一些 [child.GetHerHis] 的杂务。"
 mcpegr.29.d_shy:0 "[child.GetFirstNameNoTooltip|U]不喜欢被这样接近，从此一直躲在[child.GetHerHis]的房间里。"
 mcpegr.29.confirm_just:0 "是的，事情应该是这样的。"
 mcpegr.29.confirm_lazy:0 "嗯，我想他们可以帮忙..."
 mcpegr.29.confirm_shy:0 "让我们给 [child.GetHerHim] 一些空间。"
 mcpegr.29.just_change:0 "我们有责任热情好客！"
 mcpegr.29.lazy_change:0 "我们可以让他们为我们做一些家务。"
 mcpegr.29.shy_change:0 "我们不想被打扰！"
 mcpe.30.t:0 "进步的承诺"
 mcpe.30.d:0 "我的一位导师提醒我，我答应过要在学习上多花点功夫，但我在这门学科上的最新进展显然还是有点令人失望。我觉得这个导师不是一个很好的老师，我只是做出了承诺，所以最后只剩下我一个人了。我应该怎么办？"
 mcpe.30.a:0 "我已经不在乎那个承诺了。"
 mcpe.30.b:0 "好吧，我再多学习一下。承诺就是承诺。"
 mcpe.30.c:0 "你怎么*敢*因为*你*的无能而责备*我*？！"
 mcpegr.30.d:0 "[child.GetTitledFirstName|U]已经向[child.GetHerHis]的一位导师承诺在[child.GetHerHis]的研究上投入更多的精力，但[child.GetHerHis]在该主题上的最新进展显然仍然有点令人失望。我怀疑这位导师只是不是一个很好的老师，但我还是想知道[child.GetFirstNameNoTooltip|U]会如何对待这个承诺，所以我向[child.GetHerHim]询问。\n\n"
 mcpegr.30.d_arbitrary:0 "[child.GetSheHe|U]告诉我，[child.GetSheHe]只是做出了最后一个人的承诺，并且不再关心它了。"
 mcpegr.30.d_diligent:0 "[child.GetSheHe|U]告诉我，[child.GetSheHe]仍然非常重视这个承诺，并且一定会更多地研究。"
 mcpegr.30.d_wrathful:0 "[child.GetSheHe|U] 告诉我，[child.GetSheHe] 真的对这个愚蠢、无能的导师很生气，他是一个糟糕的老师，总体来说是一个彻底的失败者。然后将此归咎于 [child.GetHerHim]。"
 mcpegr.30.confirm_arbitrary:0 "有时，承诺需要被打破。"
 mcpegr.30.confirm_diligent:0 "令人印象深刻，[child.GetFirstNameNoTooltip|U]。坚持下去。"
 mcpegr.30.confirm_wrathful:0 "这是可以理解的反应。"
 mcpegr.30.arbitrary_change:0 "为什么你还在乎那个承诺？"
 mcpegr.30.diligent_change:0 "承诺就是承诺。继续学习！"
 mcpegr.30.wrathful_change:0 "你不生这个无能导师的气吗？"
 mcpe.31.t:0 "八卦"
 mcpe.31.d.no_bully_fallback:0 "另一个孩子一直在散布关于我的令人讨厌的谣言，但我怀疑他们所说的那些可怕的事情并不是真心的。他们可能只是想要引起注意，或者因为嫉妒而想玷污我的名声。我心里想..."
 mcpe.31.d.bully:0 "[bully.GetTitledFirstName|U] 一直在散布关于我的令人讨厌的谣言，但我怀疑 [bully.GetSheHe] 并不真正意味着 [bully.GetSheHe] 所说的任何可怕的事情。 [bully.GetSheHe|U]可能只是想要引起注意，或者[bully.GetSheHe]可能因为嫉妒而想玷污我的名字。我自己认为..."
 mcpe.31.a:0 "……在不同的情况下我们本可以成为朋友。"
 mcpe.31.b:0 "……任何不尊重我的人都会付出代价，无论他们的理由如何。"
 mcpe.31.c:0 "……我不在乎我的下属怎么看我。"
 mcpegr.31.d.no_bully_fallback:0 "另一个孩子一直在散布有关 [child.GetTitledFirstName|U] 的令人讨厌的谣言，但 [child.GetSheHe] 告诉我，[child.GetSheHe] 怀疑他们所说的那些可怕的话并不是真的。他们可能只是想要关注，或者因为嫉妒而想要玷污 [child.GetHerHis] 的名字。\n\n"
 mcpegr.31.d.bully:0 "[bully.GetTitledFirstName|U]一直在散布有关[child.GetTitledFirstName|U]的令人讨厌的谣言，但[child.GetFirstNameNoTooltip|U]告诉我，[child.GetSheHe]怀疑[bully.GetFirstNameNoTooltip|U]并不真正意味着[bully.GetSheHe]所说的任何可怕的事情。 [bully.GetFirstNameNoTooltip|U]可能只是想引起注意，或者[bully.GetSheHe]想因为嫉妒而玷污[child.GetFirstNamePossessiveNoTooltip|U]的名字。\n\n"
 mcpegr.31.d_forgiving:0 "[child.GetFirstNameNoTooltip|U]表示，这种行为是很可怜的。在不同的情况下，他们本来可以成为朋友，所以怨恨是没有道理的。"
 mcpegr.31.d_vengeful:0 "[child.GetFirstNameNoTooltip|U] 表示 [child.GetSheHe] 并不真正关心原因。任何不尊重 [child.GetHerHim] 的人都会付出代价，无论如何。"
 mcpegr.31.d_arrogant:0 "[child.GetFirstNameNoTooltip|U] 表示，这一切最终都不重要。毕竟，[child.GetSheHe] 为何要关心 [child.GetHerHis] 不如 [child.GetHerHim] 的想法呢？"
 mcpegr.31.confirm_forgiving:0 "确实如此。真是浪费啊。"
 mcpegr.31.confirm_vengeful:0 "没错。让他们付出代价。"
 mcpegr.31.confirm_arrogant:0 "是啊，为什么要关心他们呢？"
 mcpegr.31.forgiving_change:0 "你们本来可以成为朋友的！"
 mcpegr.31.vengeful_change:0 "让没有人不尊重你！"
 mcpegr.31.arrogant_change:0 "何必去关心自己的下属呢？"
 mcpe.32.t:0 "小贼"
 mcpe.32.d:0 "在市场上，我发现一个穿着肮脏破布的孩子躲在一些板条箱后面，然后趁没人注意时迅速从商人那里偷了一些食物。 [guardian.GetTitledFirstName|U]似乎也注意到了这一点，现在看着我，就像[guardian.GetSheHe|U]希望我说些什么一样……"
 mcpe.32.a:0 "告诉偷窃他们的商人！"
 mcpe.32.b:0 "找到孩子并让他们为我们工作。"
 mcpe.32.c:0 "让我们给这个可怜的孩子一些食物吧！"
 mcpegr.32.d:0 "在市场上，我发现一个穿着肮脏破布的孩子躲在一些板条箱后面，然后趁没人注意时迅速从商人那里偷了一些食物。 [child.GetTitledFirstName|U]似乎也注意到了这一点，并说：\n\n"
 mcpegr.32.d_honest:0 "“你看到这个了吗？这个可怜的商人需要知道是谁偷了他们的东西！”"
 mcpegr.32.d_ambitious:0 "“看到了吗？如果我们能找到这个孩子，就可以让他们为我们做事，有需要的人就可以轻松控制了！”"
 mcpegr.32.d_generous:0 "“你看到这个了吗？我们必须给这个可怜的孩子一些食物，这样他们就不用再偷了！”"
 mcpegr.32.confirm_honest:0 "是的，小偷需要被抓住。"
 mcpegr.32.confirm_ambitious:0 "好想法，[child.GetFirstNameNoTooltip|U]。"
 mcpegr.32.confirm_generous:0 "确实，让我们给予。"
 mcpegr.32.honest_change:0 "商家需要知道是谁偷了他们的东西！"
 mcpegr.32.ambitious_change:0 "我们为什么不让这个孩子为我们工作呢？"
 mcpegr.32.generous_change:0 "不，我们给这个可怜的孩子一些食物吧！"
 mcpe.33.t:0 "园艺"
 mcpe.33.d:0 "我最近对园艺产生了兴趣。这些年来我见过很多美丽的花朵，但当我自己照料这些植物时，它们似乎就是不想生长。我的导师说，有时植物只是不想在你想要的时候生长，但对我来说，这似乎是浪费时间。无聊浪费时间。叹了口气，我心里想……"
 mcpe.33.a:0 "这太愚蠢了。我没有时间做这个。"
 mcpe.33.b:0 "没有必要为此而烦恼。"
 mcpe.33.c:0 "在某些方面，园艺很像统治一个国家。"
 mcpegr.33.d:0 "[child.GetTitledFirstName|U] 最近对园艺产生了兴趣，但 [child.GetSheHe] 在这方面似乎不太成功。当 [child.GetFirstNameNoTooltip|U] 想要植物生长时，这些植物就是不生长，而 [child.GetSheHe] 似乎非常无聊。当我与 [child.GetHerHim] 谈论此事时，[child.GetSheHe] 说：\n\n"
 mcpegr.33.d_impatient:0 "“这太愚蠢了。我没有时间做这些。让我做一些更令人兴奋的事情吧！”"
 mcpegr.33.d_calm:0 "“没有必要为此烦恼。不是每个人都能立即擅长所有事情，包括园艺。”"
 mcpegr.33.d_content:0 "“在某些方面，园艺很像统治一个国家。我不知道为什么人们在可以照料植物的情况下还要寻求权力和荣耀。”"
 mcpegr.33.confirm_impatient:0 "好吧，那就做点别的吧。"
 mcpegr.33.confirm_calm:0 "是的，这并没有什么可耻的。"
 mcpegr.33.confirm_content:0 "是的，对你所拥有的感到满意。"
 mcpegr.33.impatient_change:0 "你不应该在这上面浪费时间。"
 mcpegr.33.calm_change:0 "没有必要为此感到不安。"
 mcpegr.33.content_change:0 "现在你知道争取权力是多么毫无意义了吗？"
 mcpe.34.t:0 "午休时间"
 mcpe.34.d:0 "我观察到我们的一些士兵整个上午都在院子里训练。中午时分，他们休息一下，吃点东西，互相聊天。我想知道我是否应该去和他们谈谈。我应该说什么？我会告诉他们..."
 mcpe.34.a:0 "...一些精彩的故事！"
 mcpe.34.b:0 "……我多么佩服他们啊！"
 mcpe.34.c:0 "……别再偷懒了！"
 mcpegr.34.d:0 "[child.GetTitledFirstName|U]整个上午都在观察我们的一些士兵在院子里训练。中午时分，他们休息一下，吃点东西，互相聊天。 [child.GetFirstNameNoTooltip|U] 走到他们面前并告诉他们...\n\n"
 mcpegr.34.d_gregarious:0 "……一些奇幻的故事，依次听士兵们讲述一些故事。每个人似乎都玩得很开心。"
 mcpegr.34.d_humble:0 "...[child.GetSheHe] 多么钦佩他们勇敢地保护大家。士兵们似乎很欣赏这种赞扬。"
 mcpegr.34.d_sadistic:0 "...停止偷懒并重新开始训练。士兵们似乎对此感到不安。"
 mcpegr.34.confirm_gregarious:0 "分享故事总是很有趣。"
 mcpegr.34.confirm_humble:0 "尊重军人是件好事。"
 mcpegr.34.confirm_sadistic:0 "你听到[child.GetHerHim]了，回去训练吧！"
 mcpegr.34.gregarious_change:0 "[child.GetFirstNameNoTooltip|U]真的应该学会如何社交！"
 mcpegr.34.humble_change:0 "[child.GetFirstNameNoTooltip|U]应该尊重部队！"
 mcpegr.34.sadistic_change:0 "[child.GetFirstNameNoTooltip|U]应该阻止他们偷懒！"
 mcpe.35.t:0 "只是一个孩子"
 mcpe.35.d:0 "当大人因为我“只是个孩子”而仍然不认真对待我时，我常常感到沮丧。在思考了我应该做什么之后，我决定......"
 mcpe.35.a:0 "如果我想被像成年人一样对待，我就必须表现得像个成年人。"
 mcpe.35.b:0 "如果我喊得足够大声，他们就会*必须*听我的！"
 mcpe.35.c:0 "我什至不应该担心这个。"
 mcpegr.35.d:0 "当成年人不认真对待 [child.GetHerHim] 时，[child.GetTitledFirstName|U] 常常会感到沮丧，因为 [child.GetSheHe] “只是一个孩子”。 [child.GetSheHe|U] 显然花了一些时间思考这个问题，当 [child.GetSheHe] 告诉我：\n\n"
 mcpegr.35.d_temperate:0 "“如果我想被像成年人一样对待，我就必须表现得像个成年人。”"
 mcpegr.35.d_stubborn:0 "“如果我喊得足够大声，那么你最终会*必须*听我的！”"
 mcpegr.35.d_patient:0 "“我什至不必担心这个。问题最终会自行解决。”"
 mcpegr.35.confirm_temperate:0 "是的，开始表现得像一个人。"
 mcpegr.35.confirm_stubborn:0 "是的，确实如此。"
 mcpegr.35.confirm_patient:0 "确实如此。无需担心。"
 mcpegr.35.temperate_change:0 "你应该开始表现得像个成年人了！"
 mcpegr.35.stubborn_change:0 "你只需要大声喊叫就可以了！"
 mcpegr.35.patient_change:0 "您只需要再等一会儿！"
