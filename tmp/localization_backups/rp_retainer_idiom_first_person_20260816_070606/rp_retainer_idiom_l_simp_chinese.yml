 rp_retainer.0001.t: "宴席无果"
 rp_retainer.0001.desc: "酒过三巡，席间宾客尽兴而散。虽无人投于门下，四方士人却都知道你愿以宾礼待贤。"
 rp_retainer.0001.a: "名声也算传出去了。"
 rp_retainer.0002.t: "宴席得贤"
 rp_retainer.0002.desc: "席间有一人谈吐不凡。[rp_retainer.GetTitledFirstName]起身行礼：“闻君上礼贤下士，特来相投。”"
 rp_retainer.0002.a: "收入门下。"
 rp_retainer.0002.b: "赐金遣行。"
 rp_retainer.0002.c: "以宾礼留之，使其知公庭重士。"
 rp_retainer.0002.d: "当席许以军令，使其知所从。"
 rp_retainer.0002.e: "先留幕中，细察其志。"
 rp_retainer.0003.t: "良才入席"
 rp_retainer.0003.desc: "[rp_retainer.GetTitledFirstName]在众宾客间并不起眼，直到议论政事兵略时才忽然开口，满座为之一静。"
 rp_retainer.0003.a: "此人正可佐我。"
 rp_retainer.0003.b: "才固有之，缘分未到。"
 rp_retainer.0004.t: "高士登门"
 rp_retainer.0004.desc: "宴后灯火将尽，[rp_retainer.GetTitledFirstName]却仍端坐不去。其言辞锋利，见识深远，显非寻常游士。"
 rp_retainer.0004.a: "请入幕府，共议军国。"
 rp_retainer.0004.b: "厚赉而别。"
 rp_retainer.0005.t: "奇才来投"
 rp_retainer.0005.desc: "宾客散尽，一人独留。[rp_retainer.GetTitledFirstName]衣饰简素，目光却似能洞穿帷幕：“君上之宴，非为酒食，是为天下。”"
 rp_retainer.0005.a: "大喜，此乃天授之才。"
 rp_retainer.0005.b: "此人非寻常器，且细察之。"
 rp_retainer.0005.c: "以厚礼延之，使其尽展其才。"
 rp_retainer.0005.d: "才虽可用，先令其知君威。"
 rp_retainer.0005.e: "以策试之，再定重用与否。"
 rp_retainer.0100.t: "途遇贤才"
 rp_retainer.0100.desc: "行至异乡，路旁忽有人高歌。[rp_retainer.GetTitledFirstName]衣衫虽敝，目光如炬，见你的仪仗却不避不趋。"
 rp_retainer.0100.a: "此人气度不凡，延入门下。"
 rp_retainer.0100.b: "赐金相助，不留其身。"
 rp_retainer.0100.c: "狂士自狂，不必留意。"
 rp_retainer.0100.d: "下车相问，以礼结之。"
 rp_retainer.0100.e: "命从骑留人，先入幕府再说。"

 rp_idiom.0001.t: "退避三舍"
 rp_idiom.0001.desc: "斥候来报，敌军已在前方扎营。大帐中，你望向旧日往来之地，想起曾受过的礼遇。诸将皆默然，等待军令。"
 rp_idiom.0001.a: "传令三军，退舍九十里，以报旧恩。"
 rp_idiom.0001.b: "军阵之上，私谊当断。"
 rp_idiom.0001.c: "假意后退，诱敌深入。"
 rp_idiom.0001.d: "修书明义，退而不怯。"
 rp_idiom.0001.e: "既在阵前，便以鼓旗决之。"
 rp_idiom.0010.t: "老马识途"
 rp_idiom.0010.desc: "旅途艰难，前路茫茫。随行老成之人劝道：“人或迷路，老马未必。可纵其先行，寻旧道而返。”"
 rp_idiom.0010.a: "纵老马前行，大队随其后。"
 rp_idiom.0010.b: "派精锐斥候探路。"
 rp_idiom.0010.c: "就地扎营，稳住队伍。"
 rp_idiom.0010.d: "马前人后，循迹而行，不急一时。"
 rp_idiom.0020.t: "完璧归赵"
 rp_idiom.0020.desc: "强邻遣使来议重礼，言辞谦恭，目光却闪烁不定。公庭之上，[rp_idiom_actor.GetTitledFirstName]慨然请命，愿持重器入彼国，不辱使命。"
 rp_idiom.0020.a: "命其为行人，奉宝前往。"
 rp_idiom.0020.b: "婉拒，此宝乃国之重器。"
 rp_idiom.0020.c: "以假宝代之，欺之。"
 rp_idiom.0030.t: "老马识途"
 rp_idiom.0030.desc: "军行多日，众人疲敝。[rp_idiom_actor.GetTitledFirstName]指着远处地势说，旧路仍在，只是被风沙遮去了痕迹。"
 rp_idiom.0030.a: "听其所言，顺势而行。"
 rp_idiom.0030.b: "记其见识。"
 rp_idiom.0040.t: "窃符救赵"
 rp_idiom.0040.desc: "急报一日三至，邻邦危在旦夕。[rp_idiom_actor.GetTitledFirstName]求见：“君上若不能明发兵书，臣愿自担其罪，先解燃眉之急。”"
 rp_idiom.0040.a: "准其发兵，事后孤自担责。"
 rp_idiom.0040.b: "不可！兵符岂可私窃。"
 rp_idiom.0040.c: "孤当修书一封，由你带去。"
 rp_idiom.0040.d: "先以金帛结其众，再行险计。"
 rp_idiom.0040.e: "速发锐卒，迟则城破。"
 rp_idiom.0050.t: "卧薪尝胆"
 rp_idiom.0050.desc: "夜深了，你仍未安寝。败绩如苦胆悬在案前，时时提醒今日之辱。左右皆泣，你却只觉胸中寒意渐成铁石。"
 rp_idiom.0050.a: "卧薪尝胆，以图雪耻。"
 rp_idiom.0050.b: "此乃自苦，治国当务实。"
 rp_idiom.0050.c: "暗蓄兵力，以待时机。"
 rp_idiom.0051.t: "三千越甲可吞吴"
 rp_idiom.0051.desc: "旧耻终于得雪。多年的隐忍、积蓄与克制，在今日化作军中雷霆。"
 rp_idiom.0051.a: "此仇已报。"
 rp_idiom.0060.t: "围魏救赵"
 rp_idiom.0060.desc: "[rp_idiom_actor.GetTitledFirstName]指着地图说：“救援未必非赴其地。若直捣敌之后方，敌必回救，围自可解。”"
 rp_idiom.0060.a: "善！直捣其腹心。"
 rp_idiom.0060.b: "径往救援，持重为上。"
 rp_idiom.0060.c: "分兵两路。"
 rp_idiom.0060.d: "先绝其粮道，逼其自解。"
 rp_idiom.0060.e: "亲率锐骑，一鼓袭其后。"
 rp_idiom.0070.t: "朝秦暮楚"
 rp_idiom.0070.desc: "两方使者先后入殿，言辞惊人地相似：若你亲近彼方，便莫怪此方不念旧谊。夹缝之中，左右皆非。"
 rp_idiom.0070.a: "依附其一，换取庇护。"
 rp_idiom.0070.b: "倒向另一边。"
 rp_idiom.0070.c: "虚与委蛇，两国皆不得罪。"
 rp_idiom.0080.t: "唇亡齿寒"
 rp_idiom.0080.desc: "强邻求借道伐人，并许以战后之利。[rp_idiom_actor.GetTitledFirstName]急谏：“不可！邻邦若亡，我国门户洞开。”"
 rp_idiom.0080.a: "借道，先取眼前之利。"
 rp_idiom.0080.b: "拒借道，与邻邦共抗强敌。"
 rp_idiom.0080.c: "遣使调解。"
 rp_idiom.0090.t: "奇货可居"
 rp_idiom.0090.desc: "夜间，[rp_idiom_actor.GetTitledFirstName]秘密来访。此人虽寄身君门，却仍有归国扬名之望。左右低声道：“此奇货可居也。”"
 rp_idiom.0090.a: "全力资助其归国。"
 rp_idiom.0090.b: "给予部分资助，静观其变。"
 rp_idiom.0090.c: "将此人献给强邻以结其欢心。"
 rp_idiom.0090.d: "厚养其人，以义结之。"
 rp_idiom.0090.e: "许其归国，先握其柄。"
 rp_idiom.0100.t: "一鸣惊人"
 rp_idiom.0100.desc: "许久以来，群臣已习惯你的沉默与克制。然而今日钟鼓齐鸣，你盛服临庭，目光凛然：“久不鸣，一鸣惊人。”"
 rp_idiom.0100.a: "整顿内政，罢黜冗官。"
 rp_idiom.0100.b: "整军经武，准备出兵。"
 rp_idiom.0100.c: "广纳贤才，修订法度。"
