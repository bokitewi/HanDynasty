 rp_idiom_strike_capital_modifier: "围魏救赵"
 rp_idiom_strike_capital_modifier_desc: "此人懂得攻其所必救，以解盟友之急。"
 rp_idiom_balancing_powers_modifier: "朝秦暮楚"
 rp_idiom_balancing_powers_modifier_desc: "此人在大国之间虚与委蛇，短期得利，长期受疑。"
 rp_idiom_lips_teeth_alarm_modifier: "唇亡齿寒"
 rp_idiom_lips_teeth_alarm_modifier_desc: "邻国失势令公庭人心惴惴。"
 rp_idiom_rare_commodity_modifier: "奇货可居"
