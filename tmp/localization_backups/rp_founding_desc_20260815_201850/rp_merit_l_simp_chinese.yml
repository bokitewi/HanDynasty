 rp_merit.2010.t: "犒赏不均"
 rp_merit.2010.desc: "庆功宴已经开始。大帐里灯火通明，酒肉摆满长案，军吏依次把金帛送到有功将领手中。笑声与碰杯声不断传到帐外，那里却还有一个人两手空空地站着——[rp_campaign_actor.GetTitledFirstName]。\n\n名单念完之后，四周的议论声反而更加清楚：“[rp_campaign_actor.GetSheHe]的功劳并不比帐内那些人少，为什么偏偏漏了[rp_campaign_actor.GetHerHim]？”[rp_campaign_actor.GetTitledFirstNameNoTooltip]没有闯进来争辩，只是隔着帐帘望向席间，神情越来越冷。\n\n功簿记载，[rp_campaign_actor.GetTitledFirstNameNoTooltip]现有功勋为[rp_campaign_actor.MakeScope.Var('rp_merit_score').GetValue|0]。无论这是军吏一时疏忽，还是你有意敲打，军中众人都在等待你给出一个说法。"
 rp_merit.2010.a: "补赐金帛,当众抚慰"
 rp_merit.2010.b: "称主簿疏忽,事后再议"
 rp_merit.2010.c: "战时赏罚自有规矩"

 rp_merit.2011.t: "战车转向"
 rp_merit.2011.desc: "战鼓响起，两军的前锋开始接近。[rp_campaign_actor.GetTitledFirstName]率领本部冲出阵列，速度快得让身后的旗手几乎跟不上。起初，各部还在为这次勇猛的突击高声喝彩。\n\n然而就在即将接敌时，[rp_campaign_actor.GetHerHis]旗号突然转向，没有继续奔向敌军，反而直插我军侧翼。那里的士卒来不及分辨这是调动、溃退还是哗变，原本整齐的阵线顿时出现了一道裂口。\n\n惊呼声沿着队列迅速传开。几日前那场犒赏留下的怨气，终于在最危险的时刻爆发了。再不立刻控制局面，敌军甚至不必进攻，我们自己就会先乱起来。"
 rp_merit.2011.a: "传令军法官截停其部"
 rp_merit.2011.b: "亲率卫队上前弹压"
 rp_merit.2011.c: "全军收束,先稳住阵脚"

