 rp_merit.0201.a: "翻回前十名"

 rp_merit.1000.t: "战后请赏"
 rp_merit.1000.desc.major: "捷报送入军府尚未几日，[rp_petitioner.GetTitledFirstName]便风尘仆仆地前来入见。阶下诸将虽无人开口，目光却都落在案前那卷新录的功簿上；此战谁当居首，军中早已有了议论。\n\n[rp_petitioner.GetTitledFirstNameNoTooltip]俯身行礼，沉声说道：“臣不敢独揽诸军死战之功。然而先登者若不得录，陷阵者若不得赏，来日临敌，又怎能让将士争相奋战？还请君上明定功次，不要让有功之人失望。”\n\n功簿记载，[rp_petitioner.GetTitledFirstNameNoTooltip]现有功勋为[rp_petitioner.MakeScope.Var('rp_merit_score').GetValue|0]，此番大战新积之功为[rp_petitioner.MakeScope.Var('rp_merit_recent_major_gain').GetValue|0]。至于这次请赏究竟有几分恳切，又有几分催逼，从[rp_petitioner.GetHerHis]的态度中已可看出端倪——[rp_petitioner.Custom('RPMeritAttitude')]。"
 rp_merit.1000.desc.humble: "[rp_petitioner.GetTitledFirstName]在殿外等候了许久，直到受召才独自上前。战后的甲衣已经换下，[rp_petitioner.GetHerHis]手中只捧着一卷由军吏核验过的功簿。\n\n“臣此番能够侥幸立功，全赖君上号令得当，也离不开将士用命。”[rp_petitioner.GetTitledFirstNameNoTooltip]低头说道，“臣本不该急着求赏，只是军中众人都在等候赏罚。若君上愿意量功施恩，臣与部下必会铭记在心。”\n\n功簿记载，[rp_petitioner.GetTitledFirstNameNoTooltip]现有功勋为[rp_petitioner.MakeScope.Var('rp_merit_score').GetValue|0]。话说得十分谨慎，但主动前来终究有所求。这次请赏的态度可以概括为：[rp_petitioner.Custom('RPMeritAttitude')]。"
 rp_merit.1000.desc.demanding: "[rp_petitioner.GetTitledFirstName]没有在殿外久候。通报声刚落，[rp_petitioner.GetSheHe]便径直走到阶前，几名随从则捧着战报与功簿，在身后一字排开。\n\n“此战若没有臣率部奔走，胜负尚未可知。”[rp_petitioner.GetTitledFirstNameNoTooltip]指向案上的记录，语气毫不迟疑，“如今首级、俘虏与战获都已核验，谁出了多少力，军中上下看得清楚。既然功簿已经写明，赏赐也该给得明白。”\n\n[rp_petitioner.GetTitledFirstNameNoTooltip]现有功勋为[rp_petitioner.MakeScope.Var('rp_merit_score').GetValue|0]。[rp_petitioner.GetSheHe]显然不是来询问自己是否有功，而是在等你决定这份功劳究竟值多少。这次请赏的态度再清楚不过：[rp_petitioner.Custom('RPMeritAttitude')]。"
 rp_merit.1000.desc.coercive: "[rp_petitioner.GetTitledFirstName]前来请赏时，随行的家臣一直从殿阶排到了宫门之外。他们全都依礼止步，没有一人喧哗，可那份整齐肃然本身就足以引人侧目。\n\n“臣与宗族追随君上征战至今，所求无非赏罚分明。”[rp_petitioner.GetTitledFirstNameNoTooltip]躬身说道，语气恭敬而从容，“军中的旧部都在等候消息。若立功者得赏，他们自然更加用命；若功劳记在簿上却迟迟没有下文，臣只怕自己也难以劝服众人。”\n\n功簿记载，[rp_petitioner.GetTitledFirstNameNoTooltip]现有功勋为[rp_petitioner.MakeScope.Var('rp_merit_score').GetValue|0]。这番话没有一句逾越礼数，却让殿中众人都听出了没有说出口的分量。这次请赏的态度是：[rp_petitioner.Custom('RPMeritAttitude')]。"
