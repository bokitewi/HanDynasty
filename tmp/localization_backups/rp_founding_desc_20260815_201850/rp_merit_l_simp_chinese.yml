 rp_merit.1100.t: "怨望暗生"
 rp_merit.1100.desc: "几日前，[rp_petitioner.GetTitledFirstName]在殿上听到了拒赏的答复。当时[rp_petitioner.GetSheHe]只是俯首领命，礼数未失，甚至没有多说一句；然而消息刚传出宫门，军府与朝堂间的议论便再也压不住了。\n\n先是[rp_petitioner.GetHerHis]门客闭门谢客，随后宗族中的吏员也开始借故拖延公文。到了今日，催征的使者又来回报：[rp_petitioner.GetTitledFirstNameNoTooltip]治下的税赋与兵役都不如往日顺畅。没有人公然抗命，可你的每一道命令落下，都像陷进了一层看不见的泥里。\n\n拒绝一次请赏只需要一句话；要让一名功臣和追随[rp_petitioner.GetHerHim]的人重新相信你的赏罚，恐怕就没有这么容易了。"
 rp_merit.1100.a: "记入心中"

 rp_merit.1200.t: "败绩当罚"
 rp_merit.1200.desc: "败报送抵之后，军府连夜核对了各部的行军记录。今日，[rp_penalty_target.GetTitledFirstName]被召到你的面前；[rp_penalty_target.GetHerHis]身后的战旗已经收起，殿中却仿佛还残留着败军带回的尘土与血腥气。\n\n案上的功簿新添了一笔败绩，数值为[rp_penalty_target.MakeScope.Var('rp_merit_recent_major_loss').GetValue|0]。有人指责[rp_penalty_target.GetTitledFirstNameNoTooltip]指挥失当，也有人辩称战局混乱，罪责不能只由一人承担。[rp_penalty_target.GetSheHe]站在阶下，等候你为这场失败定下说法。\n\n诸将都在看着这里。若兵败而无人受罚，军法便会变成一句空话；可若处罚远远超过罪责，那些曾经立功的将领以及他们背后的家族，也会把今日的裁决记在心中。"
 rp_merit.1200.a: "申斥其失"
 rp_merit.1200.b: "罚俸以正军纪"
 rp_merit.1200.c: "念其世族,暂免重罚"
 rp_merit.1200.d: "令其输粟赎过"
 rp_merit.1200.e: "功绩一概削去"
 rp_merit.1200.f: "夺其荣名"
 rp_merit.1200.g: "军前禁锢"
 rp_merit.1200.h: "斩首示众"
 rp_merit.1210.t: "按功过问罪"
 rp_merit.1210.desc: "有关[rp_penalty_target.GetTitledFirstName]的记录已经摊在案前。上面的字句或许指向失职误事，或许记下了[rp_penalty_target.GetHerHis]近来的怨望，也可能只是某种尚未得到证实的疑忌。无论真相是哪一种，这件事都不能再被轻易搁置。\n\n受召之后，[rp_penalty_target.GetTitledFirstNameNoTooltip]站在廊下等待发落。曾经的功劳仍写在军府簿册中，但过去的功绩并不能让今日的疑问自行消失。朝臣主张借此申明赏罚，军中旧人却在暗中观察你会把事情做到哪一步。\n\n处罚太轻，法度便难以服众；处罚太重，则可能把一名尚未真正反叛的功臣推向你的对立面。"
 rp_merit.1210.a: "罚俸以儆其身"
 rp_merit.1210.b: "褫夺荣名"
 rp_merit.1210.c: "削权申饬"
 rp_merit.1210.d: "软禁问罪"
 rp_merit.1210.e: "暂不处置"
 rp_merit.1220.t: "戴罪立功"
 rp_merit.1220.desc: "自从因旧过受罚，[rp_atonement_actor.GetTitledFirstName]已经有一段时间没有出现在你面前。今日，[rp_atonement_actor.GetSheHe]主动解下佩剑，交给门外侍卫，随后独自走入廊下请罪。\n\n“臣知道一时的辩解无法抹去簿册上的罪责。”[rp_atonement_actor.GetTitledFirstNameNoTooltip]俯身说道，“但臣仍有气力，也还有可以为君上效劳的地方。无论是随军出征、输财助国，还是前往边地镇抚百姓，臣都愿意领命。”\n\n[rp_atonement_actor.GetSheHe]抬起头，等待你的回答：“臣不敢求君上忘记旧过，只求一个亲手偿还的机会。”"
 rp_merit.1220.a: "准其随军立功"
 rp_merit.1220.b: "令其输财赎过"
 rp_merit.1220.c: "命其镇抚边郡"
 rp_merit.1220.d: "罪责未清，不许自辩"

 rp_merit.1301.t: "呈功于主"
 rp_merit.1301.desc: "军吏已经将我的战功核验完毕，写成一卷送到[rp_petition_liege.GetTitledFirstName]案前。受召入见时，那卷功簿就摊开放在席上，几处最重要的战绩还被朱笔圈了出来。\n\n我向[rp_petition_liege.GetTitledFirstNameNoTooltip]行礼，随后陈述自己随军征战的经过。阵亡者已经安葬，受伤者也已归营，但活下来的人同样在等待一个答案：朝廷究竟会如何看待我们用鲜血换来的功劳？\n\n功簿记载，我现有功勋为[ROOT.Char.MakeScope.Var('rp_merit_score').GetValue|0]。按照军中旧例，有功之人可以请求金帛、荣名或一份日后可以兑现的承诺；功劳足够显赫者，甚至可以请求更高的封赏。既然已经来到主公面前，我必须决定自己真正想要什么。"
 rp_merit.1301.a: "请赐金帛"
 rp_merit.1301.b: "请记荣名"
 rp_merit.1301.c: "请赐公国"
 rp_merit.1301.d: "还是暂且忍下"
 rp_merit.1301.e: "请记一纸功券"
 rp_merit.1301.f: "请赐强牵制"

