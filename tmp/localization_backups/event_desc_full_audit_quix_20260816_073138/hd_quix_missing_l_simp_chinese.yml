l_simp_chinese:
 quix_murder_outcome.4018.exposed_scheme:0 "不幸的是，我撞上了[target.GetTitledFirstName]的守卫，身份已经暴露。"
 quix_seduce_outcome.2010.b:0 "我只是来寻欢作乐的！"
 quix_seduce_outcome.2301.a.tt:0 "与[target.GetTitledFirstName]成为情人"
 quix_seduce_outcome.3301.a.tt:0 "与[owner.GetTitledFirstName]成为情人，并享受这场秘密相会"
 quix_seduce_outcome.2030.a.desc:0 "我们在热烈的气氛中靠近彼此，欲望很快压过了所有顾虑。"
 quix_seduce_outcome.2030.alcohol.desc:0 "酒意让我们的判断变得迟钝，却也让彼此更加大胆。"
 quix_seduce_outcome.2030.b.desc:0 "我们在一阵放纵之后整理衣衫，假装一切都没有发生。"
 quix_seduce_outcome.2302.desc_court_owner:0 "我悄悄混入[target.GetTitledFirstNamePossessive]的宫廷，等待一个无人留意的空隙。"
 quix_seduce_outcome.2302.desc_end:0 "这次隐秘的相会最终成为我们共同保守的秘密。"
 quix_seduce_outcome.2302.desc_not_court_owner:0 "我设法找到[target.GetTitledFirstName]暂住的地方，并在夜色中悄悄靠近。"
 quix_seduce_outcome.3023.b:0 "我们还是把这件事留在今晚吧。"
 quix_seduce_outcome.3030.a.desc:0 "我们沉浸在自己的欲望中，周围的一切都显得遥远而模糊。"
 quix_seduce_outcome.3030.alcohol.desc:0 "酒杯一轮接一轮地空了，我们的脸颊也随之发热。"
 quix_seduce_outcome.3030.b.desc:0 "天亮前，我们已经恢复了衣冠，只留下彼此心照不宣的记忆。"
 quix_seduce_outcome.3031.a.desc:0 "我们都知道自己不该如此，却仍然被那份吸引力牵引到了一起。"
 quix_seduce_outcome.3031.alcohol.desc:0 "微醺使顾虑逐渐消失，连最谨慎的距离也被打破。"
 quix_seduce_outcome.3031.b.desc:0 "我们约定把这场秘密的相会藏在心底。"
 quix_seduce_outcome.3302.desc_court_owner:0 "我在[target.GetTitledFirstNamePossessive]的宫廷中装作若无其事，心里却还回味着刚才的相会。"
 quix_seduce_outcome.3302.desc_end:0 "我们交换了最后一个眼神，然后各自回到人群之中。"
 quix_seduce_outcome.3302.desc_not_court_owner:0 "我悄悄离开[target.GetTitledFirstName]身边，努力让自己的脚步听起来一如往常。"
 quix_seduce_outcome.3302.desc_opening:0 "相会结束后，我们都必须面对外界看似平静的目光。"
