l_simp_chinese:
 rp_war_defection.0001.t: "临阵归附"
 rp_war_defection.0001.desc: "[rp_defector.GetTitledFirstName]遣使入营,声称不堪[rp_defection_old_liege.GetTitledFirstName]苛政,愿率其封地与部曲归顺于你.\n\n军中很快传开消息:[rp_defector.GetPrimaryTitle.GetNameNoTier]的旗帜已转向旧主,从此与我军并肩作战."
 rp_war_defection.0001.a: "识时归义，正当如此。"
 rp_war_defection.0002.t: "临阵背主"
 rp_war_defection.0002.desc: "大难临头![rp_defector.GetTitledFirstName]已叛投[rp_defection_new_liege.GetTitledFirstName]!\n\n其所辖封地军心动摇,麾下部曲现已调转矛头.战场上的每一面旧旗,此刻都像一记耳光."
 rp_war_defection.0002.desc.founding: "大难临头![rp_defector.GetTitledFirstName]已叛投[rp_defection_new_liege.GetTitledFirstName]!\n\n更令人寒心的是,此人本在元从旧臣之列,受恩多年,今日却率封地与部曲倒戈相向.朝中闻讯,无不失色."
 rp_war_defection.0002.a: "叛臣！"
 rp_defected_to_us_opinion: "战时归顺"
 rp_defected_from_me_opinion: "临阵倒戈"
