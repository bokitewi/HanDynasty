 # Four active situation subregions
 silk_road_situation_sub_region_region_silk_road_eastern_section:0 "Eastern Section"
 silk_road_situation_sub_region_region_silk_road_eastern_section_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Caravans leave Chang'an and cross the Hexi Corridor through Wuwei, Zhangye, Jiuquan and Dunhuang before entering the Western Regions by the Yumen or Yang passes. Silk, horses and new ideas flow along this narrow corridor.#!"
 silk_road_situation_sub_region_region_silk_road_middle_northern_route:0 "Middle Northern Route"
 silk_road_situation_sub_region_region_silk_road_middle_northern_route_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak From Loulan, the northern route follows the upper rim of the Tarim Basin through Weili, Wulei, Luntai, Kucha and Aksu before converging on Shule.#!"
 silk_road_situation_sub_region_region_silk_road_middle_southern_route:0 "Middle Southern Route"
 silk_road_situation_sub_region_region_silk_road_middle_southern_route_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak The southern route bends southwest from Loulan through Qiemo, Jingjue, Hanmi, Khotan, Pishan and Yarkand before reaching Shule.#!"
 silk_road_situation_sub_region_region_silk_road_western_section:0 "Western Section"
 silk_road_situation_sub_region_region_silk_road_western_section_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Beyond Shule, the two middle routes reunite and caravans cross the Congling passes into the oases and markets of Dayuan.#!"

 # Four visitable markets
 visit_silk_road_market_decision_loulan:0 "$building_uuii_loulan_market_01$ #weak ([GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_northern_route').MakeScope.Var('innovation').CultureInnovationType.GetName])#!"
 visit_silk_road_market_decision_khotan:0 "$building_uuii_khotan_market_01$ #weak ([GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_southern_route').MakeScope.Var('innovation').CultureInnovationType.GetName])#!"
 visit_silk_road_market_decision_dayuan:0 "$building_uuii_dayuan_market_01$ #weak ([GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_western_section').MakeScope.Var('innovation').CultureInnovationType.GetName])#!"
 c_uuii_p_867_tooltip:0 "Visit the markets of [GetTitleByKey('c_uuii_p_867').GetNameNoTier] and learn of the [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_eastern_section').MakeScope.Var('innovation').CultureInnovationType.GetName|V] [silk_road_innovation|E] carried by the Eastern Section."
 c_uuii_p_6454_tooltip:0 "Visit the markets of [GetTitleByKey('c_uuii_p_6454').GetNameNoTier] and learn of the [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_northern_route').MakeScope.Var('innovation').CultureInnovationType.GetName|V] [silk_road_innovation|E] carried by the Middle Northern Route."
 c_uuii_p_6152_tooltip:0 "Visit the markets of [GetTitleByKey('c_uuii_p_6152').GetNameNoTier] and learn of the [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_middle_southern_route').MakeScope.Var('innovation').CultureInnovationType.GetName|V] [silk_road_innovation|E] carried by the Middle Southern Route."
 c_uuii_p_5024_tooltip:0 "Visit the markets of [GetTitleByKey('c_uuii_p_5024').GetNameNoTier] and learn of the [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_western_section').MakeScope.Var('innovation').CultureInnovationType.GetName|V] [silk_road_innovation|E] carried by the Western Section."

 building_type_uuii_loulan_market_01:0 "$building_uuii_loulan_market_01$"
 building_type_uuii_loulan_market_01_desc:0 "$building_uuii_loulan_market_01_desc$"
 building_uuii_loulan_market_01:0 "Marketplace of Loulan"
 building_uuii_loulan_market_01_desc:0 "Loulan commands the northwestern approaches to Lop Nur. Caravans from the Hexi Corridor provision here before choosing the northern or southern road around the Tarim Basin."
 building_uuii_loulan_market_02:0 "Sprawling Marketplace of Loulan"
 building_uuii_loulan_market_02_desc:0 "An unbroken procession of merchants now reaches Loulan, where warehouses, inns and wells have grown into a prosperous commercial quarter."
 building_uuii_loulan_market_01_destination_desc:0 "The [GetBuilding('uuii_loulan_market_01').GetName] gathers caravans bound for either middle route, filling the streets with camel bells, bargaining and many languages."

 building_type_uuii_khotan_market_01:0 "$building_uuii_khotan_market_01$"
 building_type_uuii_khotan_market_01_desc:0 "$building_uuii_khotan_market_01_desc$"
 building_uuii_khotan_market_01:0 "Bazaar of Khotan"
 building_uuii_khotan_market_01_desc:0 "The oasis of Khotan is renowned for jade, silk and the southern-route trade. Merchants from the Kunlun foothills and distant kingdoms exchange goods and knowledge here."
 building_uuii_khotan_market_02:0 "Sprawling Bazaar of Khotan"
 building_uuii_khotan_market_02_desc:0 "Khotan's expanded bazaar now fills several streets, its jade workshops, warehouses and inns serving travelers fresh from the desert."
 building_uuii_khotan_market_01_destination_desc:0 "The [GetBuilding('uuii_khotan_market_01').GetName] displays Kunlun jade, silk and foreign spices, making it the brightest commercial center on the southern route."

 building_type_uuii_dayuan_market_01:0 "$building_uuii_dayuan_market_01$"
 building_type_uuii_dayuan_market_01_desc:0 "$building_uuii_dayuan_market_01_desc$"
 building_uuii_dayuan_market_01:0 "Marketplace of Dayuan"
 building_uuii_dayuan_market_01_desc:0 "Caravans regroup in Dayuan after crossing the Congling passes. Fine horses, metalwork, wine and silk from the east change hands in its oasis towns."
 building_uuii_dayuan_market_02:0 "Sprawling Marketplace of Dayuan"
 building_uuii_dayuan_market_02_desc:0 "Dayuan's market has become the prosperous terminus of the western section, its broad yards crowded with pack trains, horse dealers and travelers preparing for the next road."
 building_uuii_dayuan_market_01_destination_desc:0 "The [GetBuilding('uuii_dayuan_market_01').GetName] is famed for fine horses and commerce across the Congling passes, where eastern and Central Asian goods meet."
