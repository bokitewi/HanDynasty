l_english:
 hd_liu_bei_aftermath.0001.t:0 "Reward for Service"
 hd_liu_bei_aftermath.0001.desc:0 "The Yellow Turban rising has finally been put down. The court's edict praises your service and offers a path forward: the magistracy of Anxi is waiting, but you could also refuse the yamen and establish a camp with Guan Yu and Zhang Fei at your side."
 hd_liu_bei_aftermath.0001.a:0 "I will serve as magistrate of Anxi."
 hd_liu_bei_aftermath.0001.b:0 "The official road is not for me."
 hd_liu_bei_aftermath.0002.t:0 "The Anxi Inspector"
 hd_liu_bei_aftermath.0002.desc:0 "Not long after your appointment, the circuit inspector arrives at the county office. He demands gifts in the name of inspection and dismisses your service against the Yellow Turbans. Zhang Fei's hand rests on his whip while Guan Yu watches in silence."
 hd_liu_bei_aftermath.0002.a:0 "This robe returns to the court today."


