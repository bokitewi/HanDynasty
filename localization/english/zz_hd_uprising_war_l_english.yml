l_english:
 HD_UPRISING_WAR_NAME:0 "Uprising War"
 hd_uprising_war_victory_desc:0 "The uprising has won. The attacking leader is now independent from the former liege."
 hd_yellow_turban_war_victory_desc:0 "The Yellow Turbans enforce their demands. Every direct territorial vassal of the Han court becomes independent and the Chinese Hegemony is destroyed, while the Han Empire survives as the former emperor's remnant realm."
 hd_uprising_war_white_peace_desc:0 "The two sides make peace. Titles transferred during the war remain where they are."
 hd_uprising_war_defeat_desc:0 "The uprising has failed. All territory currently held by the attacking leader is annexed by the defender."
 hd_yellow_turban.0002.t:0 "The Yellow Heaven Prevails"
 hd_yellow_turban.0002.desc:0 "The Yellow Turban armies have broken the Han defenses. The court's direct territorial vassals have gone their own ways, the Chinese Hegemony has collapsed, and the Han Empire survives under the former emperor. The order of the realm has been rewritten."
 hd_yellow_turban.0002.a:0 "A new Mandate has arrived."
 hd_yellow_turban.0003.t:0 "The Yellow Heaven Falls"
 hd_yellow_turban.0003.desc:0 "The Yellow Turban uprising has failed. Zhang Jiao's armies are scattered and the Han court has survived, but the rebellion has torn open the empire's old foundations. Neither the court nor the provinces will return to their former calm."
 hd_yellow_turban.0003.a:0 "The age of disorder has only begun."
 hd_zhuojun_rangers:0 "Righteous Men of Zhuojun"
 hd_zhuojun_rangers_adj:0 "Righteous Men of Zhuojun"
