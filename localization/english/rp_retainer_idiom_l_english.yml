 rp_retainer.0001.t: "A Fruitless Banquet"
 rp_retainer.0001.desc: "The wine runs low and the guests depart in good spirits. No one offers service, but word spreads that you honor talent."
 rp_retainer.0001.a: "A reputation is something."
 rp_retainer.0002.t: "A Worthy at the Feast"
 rp_retainer.0002.desc: "One guest speaks with unusual poise. [rp_retainer.GetTitledFirstName] rises and bows: \"I heard that you honor worthy servants, and came to offer myself.\""
 rp_retainer.0002.a: "Take [rp_retainer.GetHerHim] into service."
 rp_retainer.0002.b: "Give a parting gift."
 rp_retainer.0002.c: "Receive [rp_retainer.GetHerHim] as an honored guest."
 rp_retainer.0002.d: "Set clear commands before the whole feast."
 rp_retainer.0002.e: "Keep [rp_retainer.GetHerHim] close, and test [rp_retainer.GetHerHis] intent."
 rp_retainer.0003.t: "A Capable Guest"
 rp_retainer.0003.desc: "[rp_retainer.GetTitledFirstName] seems ordinary until the talk turns to government and war. Then the room falls silent."
 rp_retainer.0003.a: "This is exactly who I need."
 rp_retainer.0003.b: "Talented, but not for me."
 rp_retainer.0004.t: "A High Talent Arrives"
 rp_retainer.0004.desc: "When the lamps burn low, [rp_retainer.GetTitledFirstName] remains. Their words are sharp, their judgment deep, and their ambition unmistakable."
 rp_retainer.0004.a: "Enter my service."
 rp_retainer.0004.b: "Send [rp_retainer.GetHerHim] away with gifts."
 rp_retainer.0005.t: "A Prodigy Comes Forward"
 rp_retainer.0005.desc: "After the guests depart, one person remains. [rp_retainer.GetTitledFirstName] is simply dressed, yet speaks as if seeing through the walls: \"This feast was not for wine, but for the realm.\""
 rp_retainer.0005.a: "A gift from Heaven!"
 rp_retainer.0005.b: "Such talent must be examined carefully."
 rp_retainer.0005.c: "Honor [rp_retainer.GetHerHim] richly, and let the talent unfold."
 rp_retainer.0005.d: "Useful, yes, but first [rp_retainer.GetSheHe] must know my authority."
 rp_retainer.0005.e: "Test [rp_retainer.GetHerHis] counsel before trusting [rp_retainer.GetHerHim]."
 rp_retainer.0100.t: "A Worthy on the Road"
 rp_retainer.0100.desc: "On the roadside, [rp_retainer.GetTitledFirstName] sings without fear of your procession. Their clothes are plain, but their eyes are bright."
 rp_retainer.0100.a: "Invite [rp_retainer.GetHerHim] into service."
 rp_retainer.0100.b: "Offer help, but not a place."
 rp_retainer.0100.c: "Ignore this eccentric."
 rp_retainer.0100.d: "Step down and meet [rp_retainer.GetHerHim] with courtesy."
 rp_retainer.0100.e: "Have the riders bring [rp_retainer.GetHerHim] into the camp."

 rp_idiom.0001.t: "Retreating Three Stages"
 rp_idiom.0001.desc: "Scouts report the enemy camp ahead. In the command tent, old courtesies and old debts rise unbidden while your officers await orders."
 rp_idiom.0001.a: "Withdraw ninety li, and repay old kindness."
 rp_idiom.0001.b: "On the battlefield, friendship must yield."
 rp_idiom.0001.c: "Feign retreat and draw them in."
 rp_idiom.0001.d: "Write in honor, retreat without fear."
 rp_idiom.0001.e: "We stand in battle now. Let drums decide."
 rp_idiom.0010.t: "The Old Horse Knows the Way"
 rp_idiom.0010.desc: "The road has grown hard and uncertain. A seasoned voice advises that old mounts may remember paths that men have forgotten."
 rp_idiom.0010.a: "Let the old horses lead."
 rp_idiom.0010.b: "Send elite scouts."
 rp_idiom.0010.c: "Make camp and steady the party."
 rp_idiom.0010.d: "Let horses lead and men verify every track."
 rp_idiom.0020.t: "Returning the Jade Intact"
 rp_idiom.0020.desc: "A powerful neighbor sends a smooth-tongued offer for a treasured object. [rp_idiom_actor.GetTitledFirstName] asks to go as envoy and preserve your honor."
 rp_idiom.0020.a: "Send [rp_idiom_actor.GetHerHim] with the treasure."
 rp_idiom.0020.b: "Refuse politely."
 rp_idiom.0020.c: "Send a false treasure instead."
 rp_idiom.0030.t: "The Old Horse Knows the Way"
 rp_idiom.0030.desc: "The army is worn from marching. [rp_idiom_actor.GetTitledFirstName] studies the land and claims that the old road still lies beneath dust and grass."
 rp_idiom.0030.a: "Trust that judgment."
 rp_idiom.0030.b: "Remember this wisdom."
 rp_idiom.0040.t: "Stolen Tally, Rescued Ally"
 rp_idiom.0040.desc: "Urgent messages arrive again and again. [rp_idiom_actor.GetTitledFirstName] asks leave to act first and answer for it later."
 rp_idiom.0040.a: "Let [rp_idiom_actor.GetHerHim] act. I will bear the blame."
 rp_idiom.0040.b: "No tally may be stolen."
 rp_idiom.0040.c: "Carry my letter instead."
 rp_idiom.0040.d: "Bind the troops with gifts before risking the tally."
 rp_idiom.0040.e: "Send picked troops at once, before the city falls."
 rp_idiom.0050.t: "Sleeping on Brushwood"
 rp_idiom.0050.desc: "Late at night, defeat sits bitter on the table before you. The shame of today hardens slowly into iron resolve."
 rp_idiom.0050.a: "I will endure, and have revenge."
 rp_idiom.0050.b: "This is self-torment. Rule must continue."
 rp_idiom.0050.c: "Prepare quietly for the right hour."
 rp_idiom.0051.t: "Three Thousand Can Swallow Wu"
 rp_idiom.0051.desc: "The old humiliation is avenged at last. Years of patience and preparation have become thunder in the ranks."
 rp_idiom.0051.a: "The debt is paid."
 rp_idiom.0060.t: "Besiege Wei to Rescue Zhao"
 rp_idiom.0060.desc: "[rp_idiom_actor.GetTitledFirstName] points at the map: \"We need not run to the siege. Strike what the enemy must save, and they will turn back.\""
 rp_idiom.0060.a: "Good. Strike their heartland."
 rp_idiom.0060.b: "Relieve the siege directly."
 rp_idiom.0060.c: "Divide the force."
 rp_idiom.0060.d: "Cut their supply road and force them to turn."
 rp_idiom.0060.e: "Lead the swift riders and strike their rear."
 rp_idiom.0070.t: "Morning Qin, Evening Chu"
 rp_idiom.0070.desc: "Two embassies arrive in quick succession, each warning you against the other. Between great powers, every answer is dangerous."
 rp_idiom.0070.a: "Lean to one side for protection."
 rp_idiom.0070.b: "Lean to the other side."
 rp_idiom.0070.c: "Placate both and profit while I can."
 rp_idiom.0080.t: "When the Lips Are Gone"
 rp_idiom.0080.desc: "A powerful neighbor asks passage to attack another realm, promising spoils. [rp_idiom_actor.GetTitledFirstName] warns that once the neighbor falls, your own gate lies open."
 rp_idiom.0080.a: "Grant passage and take the profit."
 rp_idiom.0080.b: "Refuse, and stand with the neighbor."
 rp_idiom.0080.c: "Send mediators."
 rp_idiom.0090.t: "A Rare Commodity"
 rp_idiom.0090.desc: "At night, [rp_idiom_actor.GetTitledFirstName] visits in secret. Though sheltered at your court, they still dream of returning home in triumph."
 rp_idiom.0090.a: "Fund the return fully."
 rp_idiom.0090.b: "Offer partial support."
 rp_idiom.0090.c: "Hand this person over to a greater power."
 rp_idiom.0090.d: "Keep [rp_idiom_actor.GetHerHim] well and bind [rp_idiom_actor.GetHerHim] by honor."
 rp_idiom.0090.e: "Promise return, but keep the handle in my own hand."
 rp_idiom.0100.t: "A Startling Cry"
 rp_idiom.0100.desc: "Your court has grown used to restraint and silence. Today the bells sound, and you appear in full dignity: \"Long silent, now I shall be heard.\""
 rp_idiom.0100.a: "Reform the administration."
 rp_idiom.0100.b: "Prepare the armies."
 rp_idiom.0100.c: "Recruit talent and revise the laws."
