l_english:
 uuii_claim_mandate_blocked_by_legitimate_hegemon_tt: "The Mandate cannot be claimed or seized while a maximally legitimate Son of Heaven still reigns"
 uuii_dynastic_cycle.0001.t: "A New Order in the Era of Division"
 uuii_dynastic_cycle.0001.desc.high_authority_4: "The Son of Heaven retains the Hegemony through supreme legitimacy. Authority Level Four preserves the vassals within the capital's de jure empire; all other direct vassals become independent, and independent former supporters become Celestial tributaries. The Mandate cannot presently be claimed or seized."
 uuii_dynastic_cycle.0001.desc.high_authority_3: "The Son of Heaven retains the Hegemony through supreme legitimacy. Authority Level Three preserves the vassals within the capital's de jure kingdom; all other direct vassals become independent, and independent former supporters become Celestial tributaries. The Mandate cannot presently be claimed or seized."
 uuii_dynastic_cycle.0001.desc.high_authority_2: "The Son of Heaven retains the Hegemony through supreme legitimacy. Authority Level Two preserves the vassals within the capital's de jure duchy; all other direct vassals become independent, and independent former supporters become Celestial tributaries. The Mandate cannot presently be claimed or seized."
 uuii_dynastic_cycle.0001.desc.high_authority_1: "The Son of Heaven retains the Hegemony through supreme legitimacy, but Authority Level One cannot keep any direct vassals. All become independent, and former supporters among them become Celestial tributaries. The Mandate cannot presently be claimed or seized."
 uuii_dynastic_cycle.0001.desc.low_authority_4: "Insufficient legitimacy ends the Hegemony, though the former Son of Heaven keeps all domain and ordinary titles. Authority Level Four preserves the vassals within the capital's de jure empire; all other direct vassals become independent, and competition for the Mandate resumes."
 uuii_dynastic_cycle.0001.desc.low_authority_3: "Insufficient legitimacy ends the Hegemony, though the former Son of Heaven keeps all domain and ordinary titles. Authority Level Three preserves the vassals within the capital's de jure kingdom; all other direct vassals become independent, and competition for the Mandate resumes."
 uuii_dynastic_cycle.0001.desc.low_authority_2: "Insufficient legitimacy ends the Hegemony, though the former Son of Heaven keeps all domain and ordinary titles. Authority Level Two preserves the vassals within the capital's de jure duchy; all other direct vassals become independent, and competition for the Mandate resumes."
 uuii_dynastic_cycle.0001.desc.low_authority_1: "Insufficient legitimacy ends the Hegemony, though the former Son of Heaven keeps all domain and ordinary titles. At Authority Level One every direct vassal becomes independent, and competition for the Mandate resumes."
 uuii_dynastic_cycle.0001.a: "The realm has changed"
