l_english:
 hd_cixiong_shuanggujian_name:0 "Paired Swords of Concord"
 hd_cixiong_shuanggujian_description:0 "Two long swords of contrasting form but harmonious purpose: one forceful, the other nimble. Liu Bei is said to grasp both in one hand when rallying those bound to his cause."
 hd_zhangba_shemao_name:0 "Zhangba Serpent Spear"
 hd_zhangba_shemao_description:0 "Its winding point resembles a striking serpent, while its long shaft rewards fearless momentum. In Zhang Fei's hands it is a weapon for shattering the front of an enemy host."
 hd_liangyin_qiang_name:0 "Bright Silver Spear"
 hd_liangyin_qiang_description:0 "A clear, silver-bright spear whose restrained ornamentation leaves its keen purpose unmistakable. Zhao Yun wields it with swift precision, turning defense into attack in a single motion."
 hd_shenwei_longdan_qiang_name:0 "Divine Might Dragon-Courage Spear"
 hd_shenwei_longdan_qiang_description:0 "An elaborate spear assembled from layered metal fittings, its blade and collars rising like a silver dragon. Its martial splendor suits both the battlefield and a dynastic treasury."
 hd_hao_longdan_name:0 "Gallant Dragon-Courage"
 hd_hao_longdan_description:0 "A broad, upright spearhead marked by curling golden designs. Built to seize the initiative with one decisive thrust, it proclaims the courage and renown of its bearer."
 hd_wushuang_fangtian_huaji_name:0 "Peerless Fangtian Painted Halberd"
 hd_wushuang_fangtian_huaji_description:0 "A towering point rises between sweeping crescent blades, giving the halberd a fierce and extravagant silhouette. Only a warrior of Lü Bu's legendary strength could wield it with ease."
