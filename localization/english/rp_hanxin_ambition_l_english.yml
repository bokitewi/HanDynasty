l_english:
 rp_hanxin.0005.t: "Whispers in the Market"
 rp_hanxin.0005.desc: "Uneasy rumors have begun to move through the markets. Some claim that [rp_hanxin_actor.GetTitledFirstNamePossessive] hall is crowded with guests, and that old soldiers visit more often than before.\n\nRumors are not proof, but they spread most easily when they sound close enough to truth."
 rp_hanxin.0005.a: "Send men to ask questions and quiet the talk."
 rp_hanxin.0005.b: "Summon [rp_hanxin_actor.GetHerHis] kin and show them favor."
 rp_hanxin.0005.c: "It is only idle talk."
 rp_hanxin.0005.d: "Soften [rp_hanxin_actor.GetHerHis] heart with honors first."
 rp_hanxin.0005.e: "Send quiet eyes to watch [rp_hanxin_actor.GetHerHis] hall."
 rp_hanxin.0005.f: "Rebuke [rp_hanxin_actor.GetHerHim] in court and blunt the edge."
 rp_hanxin.0010.t: "A Recommendation After Battle"
 rp_hanxin.0010.desc: "[rp_hanxin_actor.GetTitledFirstName] comes after the campaign, courteous and measured, yet not only to ask reward for [rp_hanxin_actor.GetHerselfHimself].\n\n\"Several officers under me have long served in battle. If Your Grace records their names, every soldier will know the court remembers its dead and living alike.\"\n\nIt sounds like an ordinary petition for merit."
 rp_hanxin.0010.a: "Grant the request and employ them."
 rp_hanxin.0010.b: "Give coin for [rp_hanxin_actor.GetHerHim] to reward them."
 rp_hanxin.0010.c: "Merit is one thing; offices are another."
 rp_hanxin.0010.d: "This habit must end. Seize [rp_hanxin_actor.GetHerHim]."
 rp_hanxin.0010.e: "Feed the troops first, and settle their names later."
 rp_hanxin.0010.f: "Record the names, then watch what [rp_hanxin_actor.GetSheHe] does next."
 rp_hanxin.0020.t: "Works on the Frontier"
 rp_hanxin.0020.desc: "[rp_hanxin_actor.GetTitledFirstName] sends maps and registers from the border, asking leave to raise forts, move followers, and bind neighboring houses by marriage.\n\nEvery line can be justified as defense, yet soldiers, walls, and marriages always answer first to someone close at hand."
 rp_hanxin.0020.a: "Fund the works. The frontier must hold."
 rp_hanxin.0020.b: "Approve the measures, within limits."
 rp_hanxin.0020.c: "Refuse. Border power cannot drift away."
 rp_hanxin.0020.d: "Strike before those wings grow."
 rp_hanxin.0020.e: "Let [rp_hanxin_actor.GetHerHis] kin remain at court before the works begin."
 rp_hanxin.0020.f: "Send my own men to supervise the frontier works."
 rp_hanxin.0030.t: "First Into Battle"
 rp_hanxin.0030.desc: "In council, [rp_hanxin_actor.GetTitledFirstName] asks to lead the vanguard.\n\n\"Let my own troops go first. If we win, all spoils shall await your judgment.\"\n\nYet every commander knows that those who enter first often gather loyalty first."
 rp_hanxin.0030.a: "Let [rp_hanxin_actor.GetHerHim] take the vanguard."
 rp_hanxin.0030.b: "No. I have other plans."
 rp_hanxin.0030.c: "Allow it, but watch closely."
 rp_hanxin.0040.t: "Absent From Court"
 rp_hanxin.0040.desc: "[rp_hanxin_actor.GetTitledFirstName] has claimed illness again and again. The granaries of [rp_hanxin_actor.GetHerHis] lands are full, [rp_hanxin_actor.GetHerHis] household troops are drilled, and nearby officials increasingly write first to [rp_hanxin_actor.GetHerHis] hall.\n\nIt can still be called frontier business. Everyone at court knows better."
 rp_hanxin.0040.a: "Send comfort and avoid a break."
 rp_hanxin.0040.b: "Prepare troops and wait."
 rp_hanxin.0040.c: "There is no more time. Suppress [rp_hanxin_actor.GetHerHim]."
 rp_hanxin.0040.d: "Bring [rp_hanxin_actor.GetHerHis] young kin to court and bind the house."
 rp_hanxin.0040.e: "Divide [rp_hanxin_actor.GetHerHis] command and set other hands nearby."
 rp_hanxin.0110.t: "A Realm Cut Away"
 rp_hanxin.0110.desc: "[rp_hanxin_actor.GetTitledFirstName] sends a formal memorial, claiming the frontier needs one hand to guard it and promising peace from beyond your reach.\n\nThe envoy kneels low, and every word is respectful, but the meaning is plain: [rp_hanxin_actor.GetTitledFirstName] no longer obeys you."
 rp_hanxin.0110.a: "So it has come to this."
 rp_hanxin.0120.t: "Power Under Arms"
 rp_hanxin.0120.desc: "[rp_hanxin_actor.GetTitledFirstName] openly gathers troops. Old soldiers, border houses, and resentful retainers move toward [rp_hanxin_actor.GetHerHis] banner.\n\nThe proclamation still speaks of justice and proper rewards, but once steel is drawn, loyalty must be settled in the field."
 rp_hanxin.0120.a: "Then war will answer."
 rp_hanxin.0130.t: "A Throne Pressed"
 rp_hanxin.0130.desc: "The clients of [rp_hanxin_actor.GetTitledFirstName] move through court and countryside, saying [rp_hanxin_actor.GetHerHis] merit is great enough to bear the realm itself.\n\nThis is not open rebellion. It is a net of petitions, acclamations, oaths, and soldiers tightening around your throne."
 rp_hanxin.0130.a: "So this was the shape of it."
 rp_hanxin_raise_revolt_decision: "Raise the Banners"
 rp_hanxin_raise_revolt_decision_desc: "The court's rewards and punishments have lost their measure. Old followers and neighboring lords mutter in anger. If you raise your banner now, those grievances may become an army."
 rp_hanxin_raise_revolt_decision_tooltip: "Rise against your liege and call dissatisfied vassals who favor you."
 rp_hanxin_raise_revolt_decision_confirm: "Raise the Banners"
