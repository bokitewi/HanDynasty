 wudoumidao_desc:0 "五斗米道以老子为道祖，以《道德经》、符箓斋醮与治病济民教化信众。入道者以五斗米相助教团，诸治由祭酒主持，而天师统摄教法、整饬戒律并引导众人修身悔过。"
 wudoumidao_religious_head_title:0 "天师"
 wudoumidao_religious_head_title_name:0 "五斗米道廷"

