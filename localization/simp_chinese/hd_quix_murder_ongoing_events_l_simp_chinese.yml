l_simp_chinese:
 murder_event_title:0 "谋杀："
 quix_murder_ongoing.3010.t:0 "$murder_event_title$ 虐待狂刺客"
 quix_murder_ongoing.3010.desc_opening:0 "[agent_in_question.GetTitledFirstName]似乎对这场谋杀投入了过多热情。"
 quix_murder_ongoing.3010.desc_hero:0 "[agent_in_question.GetTitledFirstName]提出的每个计划都在追求折磨，杀死[scheme.GetTarget.GetTitledFirstName]反而成了次要目标。这种残忍已经激怒[agent_hero_of_the_moment.GetTitledFirstName]——[scheme.GetTarget.GetTitleAsNamePossessiveNoTooltip][target.Custom2('RelationToMe', SCOPE.sC('agent_hero_of_the_moment'))]。若不加约束，两人很可能坏了整个计划。"
 quix_murder_ongoing.3010.desc:0 "[agent_in_question.GetTitledFirstName]提出的每个计划都在追求折磨，杀死[scheme.GetTarget.GetTitledFirstName]反而成了次要目标。[agent_in_question.GetHerHis]的能力确实有用，但这种残忍也可能暴露整个计划。"
 quix_murder_ongoing.3010.a:0 "[agent_in_question.GetFirstNameNoTooltip]这种热枕应该是我们所有人的榜样!"
 quix_murder_ongoing.3010.a.success:0 "[agent_in_question.GetHerHis|U]的这种痴迷是无价的。"
 quix_murder_ongoing.3010.a.failure:0 "[agent_in_question.GetSheHe|U]暴露了[agent_in_question.GetHerselfHimself]"
 quix_murder_ongoing.3010.b:0 "[agent_in_question.GetTitledFirstNameNoTooltip]将被用皮带拴住。"
 quix_murder_ongoing.3010.c:0 "我们不能承担任何责任。"
 quix_murder_ongoing.3301.t:0 "$murder_event_title$ 愚蠢的阴谋"
 quix_murder_ongoing.3301.desc:0 "我费尽周折安排了一场秘密会面，与同谋商议如何杀死[target.GetTitledFirstName]。然而争论持续了整整一夜，我们没有定下任何方案，反而比开始时更加犹豫。"
 quix_murder_ongoing.3301.a:0 "为什么会有这么复杂的事情！？"
