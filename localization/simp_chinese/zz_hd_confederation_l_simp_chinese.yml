l_simp_chinese:
 HD_DEFENSIVE_LEAGUE_NAME:0 "防御联盟"
 HD_ANTI_REGENT_LEAGUE_NAME:0 "讨董联盟"
 hd_offer_defensive_league_interaction:0 "提议组建防御联盟"
 hd_offer_defensive_league_interaction_desc:0 "邀请一名邻近的独立统治者加入以共同抵御外敌。"
 hd_offer_defensive_league_interaction_notification:0 "[actor.GetTitledFirstName]提议组建防御联盟。"
 hd_join_defensive_league_interaction:0 "加入防御联盟"
 hd_join_defensive_league_interaction_desc:0 "加入[recipient.GetTitledFirstName]领导的防御联盟。"
 hd_demand_defensive_league_vote_interaction:0 "要求联盟投票支持"
 hd_demand_defensive_league_vote_interaction_desc:0 "利用牵制或同盟关系迫使成员在下届盟主选举中投票支持你。"
 hd_call_defensive_league_to_war_interaction:0 "召集联盟参战"
 hd_call_defensive_league_to_war_interaction_desc:0 "花费威望，召集该联盟成员加入你当前领导的所有进攻战争。"
 hd_leave_defensive_league_decision:0 "退出防御联盟"
 hd_leave_defensive_league_decision_desc:0 "联盟已经不再符合我的利益。"
 hd_leave_defensive_league_decision_tooltip:0 "退出当前防御联盟，付出威望代价。"
 hd_unify_defensive_league_decision:0 "统一联盟"
 hd_unify_defensive_league_decision_desc:0 "将长期合作的防御联盟整合为一个真正的王国。"
 hd_unify_defensive_league_decision_tooltip:0 "满足条件后创建或夺取首都所在的法理王国。"
 hd_confederation.0500.t:0 "联盟统一"
 hd_confederation.0500.desc:0 "多年的共同防御已经让联盟成员习惯于听从你的号令。如今，首都所在的法理王国几乎尽在掌握，是时候让这份松散的誓约变成一个真正的王国了。"
 hd_confederation.0500.a:0 "让诸侯共同见证统一。"
 hd_confederation_subjugation_victory_desc:0 "联盟征服战争胜利，目标统治者将加入联盟。"
 hd_confederation_subjugation_white_peace_desc:0 "联盟征服战争以白和平结束。"
 hd_confederation_subjugation_defeat_desc:0 "联盟征服战争失败。"
 hd_anti_regent.0001.t:0 "号召联盟"
 hd_anti_regent.0001.desc:0 "董卓或许只是权臣，但他已经把持天子、挟制朝廷。袁绍决定召集天下英雄，先以同盟之名聚众，再以刀兵清君侧。"
 hd_anti_regent.0001.a:0 "天下英雄，当共讨之。"
 hd_anti_regent.0003.t:0 "联盟？"
 hd_anti_regent.0003.desc:0 "袁绍发来盟书，声称当前摄政已经越过臣子的界限。你可以响应号召，也可以继续观望这场中原豪赌。"
 hd_anti_regent.0003.a:0 "我愿加入联盟。"
 hd_anti_regent.0003.b:0 "此事还需再看。"
 hd_anti_regent.0100.t:0 "追击？"
 hd_anti_regent.0100.desc:0 "第一场讨伐已经证明联军能够逼迫摄政退让。诸侯们在营中争论不休：是就此收兵，还是趁关中尚未稳固，继续向关隘进军？"
 hd_anti_regent.0100.a:0 "继续进军。"
 hd_anti_regent.0100.b:0 "停止进军，保存实力。"
 hd_anti_regent.0200.t:0 "进关后的天下"
 hd_anti_regent.0200.desc:0 "关门终于打开，摄政的直属领地落入联军手中。现在必须依照各路诸侯的功劳分配战果；袁绍则准备以盟主之身重掌朝廷。"
 hd_anti_regent.0200.a:0 "按功劳分封。"
 hd_anti_regent_punitive_victory_desc:0 "讨伐战争胜利，诸侯可以决定是否继续进军。"
 hd_anti_regent_punitive_white_peace_desc:0 "讨伐战争以白和平结束，联军仍可决定是否继续进军。"
 hd_anti_regent_punitive_defeat_desc:0 "讨伐战争失败，摄政击退了联军。"
 hd_enter_the_passes_victory_desc:0 "联军攻入关中并夺取摄政直属领地。"
 hd_enter_the_passes_white_peace_desc:0 "进关战争以白和平结束，联盟随之瓦解。"
 hd_enter_the_passes_defeat_desc:0 "进关战争失败，摄政保住了朝廷。"
