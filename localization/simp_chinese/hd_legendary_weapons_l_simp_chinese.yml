l_simp_chinese:
 hd_cixiong_shuanggujian_name:0 "雌雄双股剑"
 hd_cixiong_shuanggujian_description:0 "一对形制相异而气韵相合的长剑，雄剑厚重，雌剑灵巧。刘备常将二剑并执于一手，以此号令义众、扶危济困。"
 hd_zhangba_shemao_name:0 "丈八蛇矛"
 hd_zhangba_shemao_description:0 "矛锋蜿蜒如蛇，长柄沉稳，进退间变化难测。此矛最宜张飞那般刚猛无前的勇士，在万军之前破阵夺势。"
 hd_liangyin_qiang_name:0 "亮银枪"
 hd_liangyin_qiang_description:0 "枪身银亮，锋刃清寒，装饰简洁而不失锐气。赵云持之临阵，枪影往复如流光，守御周全而攻势迅疾。"
 hd_shenwei_longdan_qiang_name:0 "神威龙胆枪"
 hd_shenwei_longdan_qiang_description:0 "以多重金属构件精心装成的华美长枪，枪锋与吞口层层相接，宛如银龙昂首。其威仪足以震慑敌阵，亦堪作为宗室武库中的重宝。"
 hd_hao_longdan_name:0 "豪龙胆"
 hd_hao_longdan_description:0 "枪刃宽阔挺拔，金纹沿锋脊盘旋而上，刚健中自有华贵气象。此枪追求一击破势，最能彰显持有者的胆略与武名。"
 hd_wushuang_fangtian_huaji_name:0 "无双方天画戟"
 hd_wushuang_fangtian_huaji_description:0 "戟锋高耸，月牙旁刃向两侧舒展，通体呈现凌厉而夸张的战场威仪。相传唯有吕布那般膂力绝伦者，方能将它运转如飞。"
