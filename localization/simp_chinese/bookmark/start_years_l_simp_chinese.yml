 uuii_bm_group_184: "公元184年"
 bm_uuii_184: "黄巾起义"
 bm_uuii_184_desc: "光和七年，汉廷仍统御天下，威令却已在州郡间逐渐松动。宫中宦官与外戚相争，地方豪族积蓄部曲，连年的灾疫与徭役也让百姓对朝廷失去了耐心。\n\n冀州的太平道已经联络三十六方，只待一声号令。朝廷若能平定这场动乱，汉室或许尚有转机；若是不能，各地心怀志向之人都将有机会争夺天下。\n\n#bold 当黄巾举起，延续四百年的汉家天下会重归安定，还是从此走向群雄并起？#!"

 uuii_book_cao_cao_name_desc: "曹操出身沛国曹氏。他才略过人，也因祖父曹腾的身份屡受清议非议。对他而言，家世既能打开仕途，也是一道必须越过的门槛。\n\n黄巾将起，朝廷正需要敢于任事的人。战功足以带来声望与权力，但也会让曹操卷入越来越危险的朝局。\n\n#bold 你能否借这场大乱建立自己的功业，成为挽救汉室的能臣，或是走出另一条道路？#!"

 uuii_book_yuan_shao_name_desc: "汝南袁氏四世三公，门生故吏遍布天下。袁绍凭借家声和善于交结的名望，已经成为士人中的瞩目人物，但袁氏的荣光也要求他处处顾全家族。\n\n宫中宦官与外戚的争斗日益激烈，朝野都在等待有人率先出手。袁绍拥有号召群士的声望，却必须决定要把这份声望用在何处。\n\n#bold 你能否聚拢天下英杰，在即将到来的乱世中让汝南袁氏登上权力之巅？#!"

 uuii_book_liu_bei_name_desc: "刘备自称中山靖王之后，但这一支宗室早已衰落。除了汉室宗亲的名分和待人以诚的声望，他手中没有足以左右天下的权势。\n\n黄巾的消息正在幽州传开。若能召集志同道合之人，平定乡里的动乱，这场危机也许正是刘备立身扬名的机会。\n\n#bold 你能否从涿郡起步，聚拢愿与你并肩之人，为自己和汉室赢得一片立足之地？#!"

 uuii_book_sun_jian_name_desc: "孙坚出身吴郡，早年的经历已经显露出他的果断与勇气。如今长沙兵权在手，他有了施展本领的根基，也必须面对南方盘根错节的豪族与盗寇。\n\n北方的动乱很快就会波及各州。孙坚可以奉汉廷之命征战，也可以借战功扩大自己的势力，为孙氏争取更远大的前程。\n\n#bold 你能否以长沙为根基，在乱世中开创属于江东孙氏的基业？#!"

 uuii_book_zhang_jiao_name_desc: "张角以符水为人治病，又以太平道在民间传教。多年经营之后，三十六方信众已经遍布各州，无数困苦之人都在等待大贤良师的号令。\n\n起事的日期已经定下，京师内应与各方渠帅也在暗中准备。然而参与者越多，消息便越难保守；朝廷一旦有所察觉，所有布置都可能付诸东流。\n\n#bold 苍天将死。你能否在朝廷动手之前举起黄巾，以太平道改写天下的天命？#!"

