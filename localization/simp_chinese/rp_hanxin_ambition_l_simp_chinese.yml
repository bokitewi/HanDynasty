l_simp_chinese:
 rp_hanxin.0005.t: "流言蜚语"
 rp_hanxin.0005.desc: "一封密报送到我的案前。近来闾巷间不断有人议论，[rp_hanxin_actor.GetTitledFirstName]府中的宾客日益增多，旧部往来也比往日频繁。\n\n这些话没有确凿证据，却已经传入军中与朝堂。无论流言是真是假，我都必须决定如何对待这名声望日盛的功臣。"
 rp_hanxin.0005.a: "遣人查问，压一压风声。"
 rp_hanxin.0005.b: "召其宗亲入见，以示恩结。"
 rp_hanxin.0005.c: "闾巷浮言，不必理会。"
 rp_hanxin.0005.d: "先以礼抚之，免其心生旁骛。"
 rp_hanxin.0005.e: "暗遣耳目，细察其动静。"
 rp_hanxin.0005.f: "当庭申戒，先压其锋。"
 rp_hanxin.0010.t: "战后荐才"
 rp_hanxin.0010.desc: "战后，[rp_hanxin_actor.GetTitledFirstName]带着一份名册前来入见。我原以为[rp_hanxin_actor.GetSheHe]是为自己请功，名册上写的却全是麾下旧部。\n\n“这些人久经行阵，还请主公量才录用。”[rp_hanxin_actor.GetSheHe]说道，“若旧功能够惠及部曲，诸军便知道朝廷不忘有功之人。”\n\n这项请求既能安抚军心，也会让更多[rp_hanxin_actor.GetHerHis]旧部进入朝廷。"
 rp_hanxin.0010.a: "准其所请，收录其人。"
 rp_hanxin.0010.b: "赐些金帛，令其自犒部曲。"
 rp_hanxin.0010.c: "军功归军功，朝列不可私授。"
 rp_hanxin.0010.d: "此风不可长，先拿下再说。"
 rp_hanxin.0010.e: "先以恩食安其众，再定其名。"
 rp_hanxin.0010.f: "先记在簿上，暗中看他还想做什么。"
 rp_hanxin.0020.t: "边城营造"
 rp_hanxin.0020.desc: "[rp_hanxin_actor.GetTitledFirstName]的使者将一份边境图籍铺在我面前，请求修筑坞壁、迁徙部曲，并联络邻境豪族共同守边。\n\n这些安排确实能够加强边防，也会让当地人马、城垒与豪族更加依赖[rp_hanxin_actor.GetTitledFirstNameNoTooltip]。我必须判断该给予多少权力，又该留下多少约束。"
 rp_hanxin.0020.a: "拨给钱粮，边境守备要紧。"
 rp_hanxin.0020.b: "准其整饬，但不得越制。"
 rp_hanxin.0020.c: "驳回，边境之权不可旁落。"
 rp_hanxin.0020.d: "趁其羽翼未成，先发制人。"
 rp_hanxin.0020.e: "命其宗子入朝为质，再许营造。"
 rp_hanxin.0020.f: "改遣亲信督边，不许其独握营造。"
 rp_hanxin.0030.t: "请为先锋"
 rp_hanxin.0030.desc: "军议刚刚开始，[rp_hanxin_actor.GetTitledFirstName]便走到阵图前，请求率领本部担任先锋。\n\n“臣愿先登破敌，所得战果皆由主公裁断。”\n\n帐中诸将都在等候我的回答。先锋能够承担最大的风险，也往往最先取得战功与军心。"
 rp_hanxin.0030.a: "使其为先锋，胜负当前。"
 rp_hanxin.0030.b: "不必，此战另有安排。"
 rp_hanxin.0030.c: "允其出战，但暗中派人盯紧。"
 rp_hanxin.0040.t: "称病不朝"
 rp_hanxin.0040.desc: "[rp_hanxin_actor.GetTitledFirstName]已经数次称病不朝，今日又把我的使者挡在府外。与此同时，地方送来的记录显示，[rp_hanxin_actor.GetHerHis]粮仓充实、部曲精练，周边小吏也习惯先向其府中递信。\n\n[rp_hanxin_actor.GetSheHe|U]或许真的无意入朝，也可能正在试探我还能容忍到什么程度。无论如何，继续等待本身也是一种选择。"
 rp_hanxin.0040.a: "遣使慰问，暂不相逼。"
 rp_hanxin.0040.b: "调兵防备，静观其变。"
 rp_hanxin.0040.c: "已不能再等，立即镇压。"
 rp_hanxin.0040.d: "召其子弟入廷，以亲制之。"
 rp_hanxin.0040.e: "分其兵权，另置人手。"
 rp_hanxin.0110.t: "裂土称王"
 rp_hanxin.0110.desc: "[rp_hanxin_actor.GetTitledFirstName]的使者向我奉上一份表章，声称边境久乱，其主愿自立屏藩，以保一方安定。\n\n使者仍按旧礼跪在阶下，表章中的称谓却已经改变。等我读完最后一行时，[rp_hanxin_actor.GetTitledFirstNameNoTooltip]的旗号已经不再属于我的疆土。"
 rp_hanxin.0110.a: "事已至此。"
 rp_hanxin.0120.t: "拥兵自重"
 rp_hanxin.0120.desc: "急报送入宫中：[rp_hanxin_actor.GetTitledFirstName]已经公开集结部曲，旧日功臣、边境豪族与不满的士卒正在向[rp_hanxin_actor.GetHerHis]旗号靠拢。\n\n檄文仍以“清君侧、正赏罚”为名，但当我军斥候看见对方列阵时，昔日的君臣之争已经变成了一场战争。"
 rp_hanxin.0120.a: "兵戈终起。"
 rp_hanxin.0130.t: "逼宫之势"
 rp_hanxin.0130.desc: "[rp_hanxin_actor.GetTitledFirstName]的门客开始在朝野间奔走，宣称其主功盖社稷，足以承受大位。随后送到我面前的急报，一封比一封更坏。\n\n请愿、拥戴、密约与兵马已经连在一起。[rp_hanxin_actor.GetTitledFirstNameNoTooltip]不再只求更高的封赏，[rp_hanxin_actor.GetSheHe]要夺取的是我的君位。"
 rp_hanxin.0130.a: "事竟至此。"
 rp_hanxin_raise_revolt_decision: "举兵问赏罚"
 rp_hanxin_raise_revolt_decision_desc: "公庭赏罚失当，旧部与邻臣多有不平。若此时举兵，或可牵合怨望之臣，一同向君上问罪。"
 rp_hanxin_raise_revolt_decision_tooltip: "举兵反抗君上，并召集与你交好且不满君上的封臣。"
 rp_hanxin_raise_revolt_decision_confirm: "举兵"
