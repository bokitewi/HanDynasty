l_simp_chinese:
 hd_liu_bei_aftermath.0001.t:0 "论功行赏"
 hd_liu_bei_aftermath.0001.desc:0 "黄巾之乱终于平息。朝廷传来诏书，称你在讨伐黄巾时出力甚多，愿意给你一条出路：安喜县的县令一职正待有人接掌，但若你不愿再受官府束缚，也可以带着关羽与张飞另立营寨。"
 hd_liu_bei_aftermath.0001.a:0 "我愿为安喜县令，守土安民。"
 hd_liu_bei_aftermath.0001.b:0 "官场非我所愿，仍以义从为伴。"
 hd_liu_bei_aftermath.0002.t:0 "安喜县督邮"
 hd_liu_bei_aftermath.0002.desc:0 "你到任安喜不久，督邮便趾高气扬地来到县衙。他借巡察之名索取贿赂，又将你讨伐黄巾的功劳贬得一文不值。张飞的手已经按在了马鞭上，关羽也沉默地看着你。"
 hd_liu_bei_aftermath.0002.a:0 "这身官服，今日便还给朝廷。"


