l_simp_chinese:
 quix_seduce_outcome.2000.t:0 "帝王之气"
 quix_seduce_outcome.2000.desc:0 "我在[target.GetTitledFirstNamePossessive]华丽的房中等候，身旁只有酒水与果品。\n\n[target.GetSheHe|U]见到我并不意外，反而微笑着走近。几句试探之后，我们便不再掩饰彼此的心意。"
 quix_seduce_outcome.2000.a:0 "我可以习惯这样！"
 quix_seduce_outcome.2000.b:0 "我来，我看见，我征服！"
 hd_quix_seduce_outcome.2010.t:0 "施虐的意图"
 quix_seduce_outcome.2010.desc:0 "[target.GetTitledFirstName]邀我在地牢秘密见面。那里已经点起蜡烛，刑具旁还散着花瓣；[target.GetSheHe]显然早有安排。\n\n“今晚听我的。”[target.GetSheHe]说道。接下来发生的一切证明，[target.GetHerHis]兴趣远不止普通的欢愉。"
 quix_seduce_outcome.2010.a:0 "我是虐待狂，不是受虐狂。"
 quix_seduce_outcome.2020.t:0 "干草堆中的滚滚红尘"
 quix_seduce_outcome.2020.desc:0 "我与[target.GetName]始终找不到独处的机会，只好传去纸条，约[target.GetHerHim]在干草阁见面。\n\n牲畜的声音掩盖了我们的交谈。[target.GetSheHe|U]向我靠近时，我已经明白这场私会将如何结束。"
 quix_seduce_outcome.2020.a:0 "我需要一间密室......"
 quix_seduce_outcome.2020.b:0 "这很有趣，但我现在要去洗澡了，再见。"
 quix_seduce_outcome.2021.t:0 "爱之神殿"
 quix_seduce_outcome.2021.desc:0 "[target.GetName]以整日祈祷为名邀我前往神殿。傍晚抵达时，殿内除了穿着朴素长袍的[target.GetHerHim]，再无旁人。\n\n[target.GetSheHe|U]本想谈论爱情与虔诚，但我们很快忘了准备好的说辞。这场祈祷最终有了另一种结果。"
 quix_seduce_outcome.2021.a:0 "神的旨意！"
 quix_seduce_outcome.2021.b:0 "我度过了一段神圣的时光。"
 quix_seduce_outcome.2022.t:0 "午后之乐"
 quix_seduce_outcome.2022.desc:0 "我收到一位熟人的庄园邀请，抵达后才发现真正等候我的人是[target.GetTitledFirstName]。\n\n我们散步、用餐，话题也逐渐变得私密。午后，[target.GetSheHe]邀我上楼继续相谈；那位名义上的主人整个周末都没有出现。"
 quix_seduce_outcome.2022.a:0 "当它是对的时候，它就是对的!"
 quix_seduce_outcome.2022.b:0 "我们将永远拥有属于我们的回忆。"
 quix_seduce_outcome.2023.t:0 "热情的深度"
 quix_seduce_outcome.2023.desc:0 "为了避开仆从与廷臣，我约[target.GetTitledFirstName]在一处古老墓穴见面。这里虽然阴冷，却不会有人打扰。\n\n我刚要表明心意，[target.GetSheHe]便抢先说出了同样的话。此后的长久沉默，已经不需要更多解释。"
 quix_seduce_outcome.2023.a:0 "我们不会总是要在这里做这些......"
 quix_seduce_outcome.2023.b:0 "我们该给了古人一些思考的空间。"
 quix_seduce_outcome.2024.t:0 "原始的体验"
 quix_seduce_outcome.2024.desc:0 "[target.GetTitledFirstName]同意在荒野中的木屋与我秘密见面。没有仆从，也没有窥探者，我们终于能够坦率交谈。\n\n夜色降临后，[target.GetSheHe]直接问起我的心意。我没有回避，而[target.GetSheHe]也接受了我的回答。"
 quix_seduce_outcome.2024.b:0 "这段经历我将永远珍藏。"
 quix_seduce_outcome.2025.t:0 "闲暇之时"
 quix_seduce_outcome.2025.desc:0 "我邀请[target.GetTitledFirstName]到乡间庄园小住，希望独处能让我们的关系更进一步。\n\n一天的散步与交谈之后，我们在露台上看着天色渐暗。[target.GetSheHe|U]终于不再掩饰心意，主动吻了我。"
 quix_seduce_outcome.2025.a:0 "和你一起度假，真是太好了。"
 quix_seduce_outcome.2025.b:0 "你让我很欣慰。"
 quix_seduce_outcome.2026.t:0 "摇滚之舟"
 quix_seduce_outcome.2026.desc:0 "我借来一艘游船，邀请[target.GetTitledFirstName]与我单独出行。晚餐之后，我们在挂满灯笼的甲板上交谈。\n\n[target.GetSheHe|U]感谢我安排这次相聚，并在话音落下时吻了我。最初的惊讶很快消失，我们也没有急着返回岸上。"
 quix_seduce_outcome.2026.a:0 "我想我要买一艘船！"
 quix_seduce_outcome.2026.b:0 "我觉得有点不舒服。"
 quix_seduce_outcome.2027.t:0 "一个伟大的经典"
 quix_seduce_outcome.2027.desc:0 "几个月的试探已经足够。我约[target.GetTitledFirstName]在酒窖见面，那里偏僻，也不会有人寻找我们。\n\n[target.GetSheHe|U]刚爬下梯子便开始表明心意。我给出了同样坦率的回应，而这场会面很快越过了言语。"
 quix_seduce_outcome.2027.a:0 "现在，喝一杯怎么样！？"
 quix_seduce_outcome.2027.b:0 "你去的时候可以带一瓶。"
 quix_seduce_outcome.2028.t:0 "诚实的方法"
 quix_seduce_outcome.2028.desc:0 "我思量许久，最终决定直接向[target.GetTitledFirstName]说明自己的心意。秘密会面时，[target.GetSheHe]起初十分困惑，却始终没有离开。\n\n听完我的话，[target.GetSheHe]用一个吻作出回答。原来[target.GetSheHe]早有同样的感情，只是不确定我是否认真。"
 quix_seduce_outcome.2028.a:0 "诚实是最好的方式。"
 quix_seduce_outcome.2028.b:0 "你知道吗，我有第二个想法了"
 quix_seduce_outcome.2029.t:0 "不耐烦了。"
 quix_seduce_outcome.2029.desc:0 "我已经厌倦[target.GetTitledFirstName]若即若离的态度，于是安排秘密会面，要求[target.GetHerHim]给出明确回答。\n\n[target.GetSheHe|U]否认是在玩弄我，并承认早已有意。误会消除后，我们相视而笑，随后便拥抱在一起。"
 quix_seduce_outcome.2029.a:0 "我应该早点说出来的。"
 quix_seduce_outcome.2029.b:0 "我很高兴这是我的计划！"
 quix_seduce_outcome.2030.t:0 "肆无忌惮的激情"
 quix_seduce_outcome.2030.desc:0 "我与[target.GetTitledFirstName]都已明白彼此的欲望，继续试探毫无意义。心腹替我们安排了一处不会受人打扰的会面地点。\n\n我刚要表白，[target.GetFirstName]便用手指止住我的话。此后的相会热烈而直接，不再需要任何承诺。"
 quix_seduce_outcome.2030.a:0 "我喜欢和你做爱！"
 quix_seduce_outcome.2030.b:0 "很高兴和你一起很快乐。"
 quix_seduce_outcome.2031.t:0 "我想我们是孤独的......"
 quix_seduce_outcome.2031.desc:0 "我看得出[target.GetTitledFirstName]对我有意，可周围始终有人。于是我在[target.GetHerHis]耳边提出离开，我们趁人不备一同跑出了聚会。\n\n远离众人后，[target.GetSheHe]承认自己整晚也在寻找独处的机会。我们终于不必继续掩饰。"
 quix_seduce_outcome.2031.a:0 "我们需要一个好的借口！"
 quix_seduce_outcome.2031.b:0 "也许我们最好分道扬镳......"
 quix_seduce_outcome.2301.t:0 "秘密约会"
 quix_seduce_outcome.2301.desc:0 "我的眼线安排了一处秘密住所，让我与[target.GetTitledFirstName]能够避开所有耳目见面。\n\n我确认无人跟踪后进入房中，却发现[target.GetSheHe]早已在壁炉旁等候。“把外袍脱了吧。”看来我的心思从未瞒过[target.GetHerHim]。"
 quix_seduce_outcome.2301.b:0 "你能不能尽量小声点？"
 quix_seduce_outcome.2302.t:0 "储物柜"
 quix_seduce_outcome.2302.desc:0 "距离一直妨碍我追求[target.GetTitledFirstName]，于是[target.GetSheHe]借朝圣之名秘密前来，并暂住在一间不起眼的仆人房中。\n\n我们交谈了半夜，谁也没有直接说明来意。可在各自回房之后，[target.GetFirstName]又悄悄来到我的床边。"
 quix_seduce_outcome.2302.a:0 "请多留一会儿吧！"
 quix_seduce_outcome.2302.b:0 "有这样一个神话般的旅馆......"
 quix_seduce_outcome.2303.t:0 "我给你下了咒语......"
 quix_seduce_outcome.2303.desc:0 "我以角神仪式为名，邀请[target.GetTitledFirstName]在午夜来到秘密林地。我们都明白，这场集会另有目的。\n\n仪式开始后，[target.GetSheHe]接受了我的示意。伴随众人的吟唱，我们以彼此的方式完成了这次隐秘祭礼。"
 quix_seduce_outcome.2303.a:0 "因为你是我的！"
 quix_seduce_outcome.2303.b:0 "你为什么要唱歌呢？"
 quix_seduce_outcome.2304.t:0 "节日晚会"
 quix_seduce_outcome.2304.desc:0 "[target.GetName]每年都会独自参加当地节庆，我也借机混入人群。我们一同饮酒起舞，很快便抛开了平日的身份。\n\n回到城外的帐篷后，我终于表明心意。[target.GetSheHe|U]只笑着回答：“我早就看出来了。”"
 quix_seduce_outcome.2304.a:0 "让我们把这变成一个传统吧！"
 quix_seduce_outcome.2304.b:0 "多么古色古香的小城啊。"
 quix_seduce_outcome.2305.t:0 "适合王者"
 quix_seduce_outcome.2305.desc:0 "我与[target.GetName]受邀前往异国赴宴。远离熟悉的廷臣与耳目，我们整晚都坐在一起饮酒交谈。\n\n宴后，[target.GetSheHe]悄悄碰了碰我的手。我们先后离席，最后在我的房中重逢；这一次，[target.GetSheHe]没有再隐瞒自己的渴望。"
 quix_seduce_outcome.2305.a:0 "我们应该多呆一会儿！"
 quix_seduce_outcome.2305.b:0 "在......无论这是在哪里......会发生什么？"
 quix_seduce_outcome.3000.desc:0 "[owner.GetTitledFirstName]正在华丽的房中等候，身旁只有酒水与果品。\n\n我微笑着走近，开始亲手喂[owner.GetHerHim]吃水果。[owner.GetSheHe|U]没有拒绝，我们也很快不再掩饰彼此的心意。"
 quix_seduce_outcome.3000.a:0 "[owner.GetTitledFirstName]似乎印象深刻。"
 quix_seduce_outcome.3010.desc:0 "[owner.GetTitledFirstName]追求我已有数月，我决定在地牢里给[owner.GetHerHim]最后一次考验。蜡烛、花瓣和刑具都已准备妥当。\n\n“今晚听我的。”我向[owner.GetHerHim]说道。[owner.GetSheHe|U]接受了邀请，也接受了我安排的一切。"
 quix_seduce_outcome.3010.a:0 "[owner.GetSheHe]就可以了。"
 quix_seduce_outcome.3020.desc:0 "我终于决定回应[owner.GetTitledFirstNamePossessive]的追求，于是传去纸条，约[owner.GetHerHim]在干草阁见面。\n\n牲畜的声音掩盖了我们的交谈。[owner.GetSheHe|U]向我靠近时，我也没有再故作矜持。"
 quix_seduce_outcome.3020.a:0 "下一次我会偷偷溜到卧室去......"
 quix_seduce_outcome.3021.desc:0 "我以整日祈祷为名，邀请[owner.GetTitledFirstName]到一座偏僻神殿。傍晚时分，殿内除了我们再无旁人。\n\n我本想先谈论爱情与虔诚，但[owner.GetSheHe]很快便明白了真正的邀请。准备好的说辞最终一句也没用上。"
