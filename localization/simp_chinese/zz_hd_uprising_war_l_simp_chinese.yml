l_simp_chinese:
 HD_UPRISING_WAR_NAME:0 "起义战争"
 hd_uprising_war_victory_desc:0 "起义军赢得了战争，进攻方现在脱离原领主独立。"
 hd_yellow_turban_war_victory_desc:0 "黄巾军赢得战争并强制执行诉求。汉廷治下所有直属诸侯各自独立，汉家霸府随之解体，但汉帝国仍由原皇帝统治。"
 hd_uprising_war_white_peace_desc:0 "双方停战；战争期间已经转让的领地维持现状。"
 hd_uprising_war_defeat_desc:0 "起义失败，进攻方领袖当前拥有的全部领地被防守方吞并。"
 hd_yellow_turban.0001.t:0 "苍天已死"
 hd_yellow_turban.0001.desc:0 "天还未亮，一名信使便带着雒阳的急报赶入营中。\n\n“大贤良师，事情败露了。”\n\n我的门徒[tang_zhou.GetName]已经向朝廷告密。三十六方的布置与原定三月五日举事的计划尽数泄露，[ma_yuan_yi.GetName]也在雒阳被捕处死。官府正在大举搜捕太平道信众，追捕我的诏书亦已送往冀州。\n\n若仍等到原定之日，各方人马只会被朝廷逐一击破。已经不能再等了。"
 hd_yellow_turban.0001.a:0 "苍天已死，黄天当立！"
 hd_yellow_turban.0002.t:0 "黄天得胜"
 hd_yellow_turban.0002.desc:0 "黄巾军攻破了汉廷的防线。各地响应者纷纷脱离旧主，汉廷直属封臣已经各自独立；作为旧日中枢的汉家霸府随之崩溃，而汉帝国仍由原皇帝保有。天下的秩序被彻底改写。"
 hd_yellow_turban.0002.a:0 "新的天命已经降临。"
 hd_yellow_turban.0003.t:0 "黄天倾覆"
 hd_yellow_turban.0003.desc:0 "黄巾起义未能击破汉廷。战火熄灭，张角的军队被击溃，汉室暂时保住了江山。然而这场动乱已经撕开了帝国的裂缝，接下来的宫廷与地方都不会再回到旧日的安宁。"
 hd_yellow_turban.0003.a:0 "乱世才刚刚开始。"
 hd_zhuojun_rangers:0 "涿郡义从"
 hd_zhuojun_rangers_adj:0 "涿郡义从"
