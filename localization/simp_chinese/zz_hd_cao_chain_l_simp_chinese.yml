l_simp_chinese:
 hd_cao_chain.0001.t:0 "伍浮刺杀"
 hd_cao_chain.0001.desc:0 "伍浮在朝堂之外公开刺杀权臣，却在刀锋接近之前便被侍卫擒住。片刻之后，鲜血染红了台阶。曹操第一次如此清楚地看见：在这座朝廷里，单凭勇气远远不够。"
 hd_cao_chain.0001.a:0 "这不是一次失败，而是一场警告。"
 hd_cao_chain.0002.t:0 "王允宴会"
 hd_cao_chain.0002.desc:0 "王允设宴，大臣们相对哭泣。有人哭到天明，有人哭到夜半，仿佛泪水本身就能将权臣淹没。曹操却忽然大笑。王允抬头问他为何发笑。"
 hd_cao_chain.0002.a:0 "你有何良策？"
 hd_cao_chain.0003.t:0 "七星刀"
 hd_cao_chain.0003.desc:0 "王允把一柄短刀交到你手中。刀身寒光如星，正适合藏在袖中，也正适合用来结束一场过长的暴政。"
 hd_cao_chain.0003.a:0 "刀在手中，便不能再只是旁观者。"
 hd_cao_chain.0004.t:0 "刺杀权臣"
 hd_cao_chain.0004.desc:0 "你带着七星刀进入权臣府中。刀锋、铜镜和一瞬间的迟疑交织在一起；当侍卫的脚步逼近时，你只能放弃刺杀，转身逃出雒阳。"
 hd_cao_chain.0004.a:0 "今日不成，来日再取其首。"
 hd_cao_chain.0005.t:0 "中牟县令"
 hd_cao_chain.0005.desc:0 "逃亡途中，你被中牟县令陈宫拦下。陈宫听完你的解释，竟没有把你交还给权臣，而是决定弃官随你同行。"
 hd_cao_chain.0005.a:0 "天下如此，岂能独善其身？"
 hd_cao_chain.0007.t:0 "吕伯奢之家"
 hd_cao_chain.0007.desc:0 "吕伯奢本想以酒食款待旧友。夜色中，你听见院内磨刀声，以为行迹已经败露；等到误会揭开时，吕家已经没有一个活人。陈宫望着满院血迹，终于明白自己跟随的究竟是什么人。"
 hd_cao_chain.0007.a:0 "宁教我负天下人。"
