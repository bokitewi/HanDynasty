 rp_merit.1000.w: "显命旌功"
 rp_merit.1000.x: "赐其旌鼓"
 rp_merit.1000.y: "赐山泽市税"
 rp_merit.1000.z: "此事暂缓，容后再议"

 rp_merit.1100.t: "怨望暗生"
 rp_merit.1100.desc: "几日前，[rp_petitioner.GetTitledFirstName]在殿上接受了拒赏的答复，没有当面争辩。此后，[rp_petitioner.GetHerHis]门客开始闭门谢客，族中吏员也屡次拖延公文。\n\n如今使者回报，[rp_petitioner.GetTitledFirstNameNoTooltip]治下的税赋与兵役已不如往日顺畅。[rp_petitioner.GetSheHe]没有公然抗命，但怨望已经传到了整个家族。"
 rp_merit.1100.a: "记入心中"

 rp_merit.1200.t: "败绩当罚"
 rp_merit.1200.desc: "败报送抵后，军府核对了各部的行军记录，并将[rp_penalty_target.GetTitledFirstName]召来问责。\n\n功簿新添的败绩为[rp_penalty_target.MakeScope.Var('rp_merit_recent_major_loss').GetValue|0]。有人指责[rp_penalty_target.GetHerHim]指挥失当，也有人认为战局混乱，罪责不应由一人承担。诸将都在等候我的裁决。"
 rp_merit.1200.a: "申斥其失"
 rp_merit.1200.b: "罚俸以正军纪"
 rp_merit.1200.c: "念其世族,暂免重罚"
 rp_merit.1200.d: "令其输粟赎过"
 rp_merit.1200.e: "功绩一概削去"
 rp_merit.1200.f: "夺其荣名"
 rp_merit.1200.g: "军前禁锢"
 rp_merit.1200.h: "斩首示众"
 rp_merit.1210.t: "按功过问罪"
 rp_merit.1210.desc: "有关[rp_penalty_target.GetTitledFirstName]的记录已经送到案前，其中既有失职与怨望，也有尚未证实的疑忌。\n\n[rp_penalty_target.GetTitledFirstNameNoTooltip]正在廊下等候发落。朝臣主张借此申明赏罚，军中旧人则关注我会如何处置这名有功之臣。"
 rp_merit.1210.a: "罚俸以儆其身"
 rp_merit.1210.b: "褫夺荣名"
 rp_merit.1210.c: "削权申饬"
 rp_merit.1210.d: "软禁问罪"
 rp_merit.1210.e: "暂不处置"
 rp_merit.1220.t: "戴罪立功"
 rp_merit.1220.desc: "因旧过受罚后，[rp_atonement_actor.GetTitledFirstName]许久没有入见。今日，[rp_atonement_actor.GetSheHe]主动解下佩剑，独自前来请罪。\n\n“臣不敢求主公忘记旧过，只求一个偿还的机会。”[rp_atonement_actor.GetSheHe]说道，“无论随军出征、输财助国，还是镇抚边地，臣都愿意领命。”"
 rp_merit.1220.a: "准其随军立功"
 rp_merit.1220.b: "令其输财赎过"
 rp_merit.1220.c: "命其镇抚边郡"
 rp_merit.1220.d: "罪责未清，不许自辩"

 rp_merit.1301.t: "呈功于主"
 rp_merit.1301.desc: "军吏已经核验我的战功，并将功簿送到[rp_petition_liege.GetTitledFirstName]案前。如今我受召入见，可以依照军中旧例请求封赏。\n\n功簿记载，我现有功勋为[ROOT.Char.MakeScope.Var('rp_merit_score').GetValue|0]。金帛、荣名、采邑，或是一份日后兑现的承诺——我必须决定自己真正想要什么。"
 rp_merit.1301.a: "请赐金帛"
 rp_merit.1301.b: "请记荣名"
 rp_merit.1301.c: "请赐公国"
 rp_merit.1301.d: "还是暂且忍下"
 rp_merit.1301.e: "请记一纸功券"
 rp_merit.1301.f: "请赐强牵制"

