 rp_merit.0201.a: "翻回前十名"

 rp_merit.1000.t: "战后请赏"
 rp_merit.1000.desc.major: "捷报送入军府不久，[rp_petitioner.GetTitledFirstName]便带着新录的功簿前来请赏。此战谁当居首，军中早已有了议论。\n\n“臣不敢独揽诸军之功，但先登者不可不录，陷阵者不可不赏。”[rp_petitioner.GetTitledFirstNameNoTooltip]说道，“还请主公明定功次。”\n\n功簿记载，[rp_petitioner.GetHerHis]现有功勋为[rp_petitioner.MakeScope.Var('rp_merit_score').GetValue|0]，此战新积之功为[rp_petitioner.MakeScope.Var('rp_merit_recent_major_gain').GetValue|0]；请赏态度为：[rp_petitioner.Custom('RPMeritAttitude')]。"
 rp_merit.1000.desc.humble: "[rp_petitioner.GetTitledFirstName]独自前来，手中捧着一卷由军吏核验过的功簿。\n\n“此番立功，全赖主公号令与将士用命。”[rp_petitioner.GetSheHe]低头说道，“臣本不该急着求赏，只是军中都在等候赏罚。”\n\n功簿记载，[rp_petitioner.GetHerHis]现有功勋为[rp_petitioner.MakeScope.Var('rp_merit_score').GetValue|0]；请赏态度为：[rp_petitioner.Custom('RPMeritAttitude')]。"
 rp_merit.1000.desc.demanding: "[rp_petitioner.GetTitledFirstName]径直走到阶前，随从则将战报与功簿呈到案上。\n\n“此战若无臣率部奔走，胜负尚未可知。”[rp_petitioner.GetSheHe]指着功簿说道，“首级、俘虏与战获都已核验，赏赐也该给得明白。”\n\n[rp_petitioner.GetHerHis]现有功勋为[rp_petitioner.MakeScope.Var('rp_merit_score').GetValue|0]；请赏态度为：[rp_petitioner.Custom('RPMeritAttitude')]。"
 rp_merit.1000.desc.coercive: "[rp_petitioner.GetTitledFirstName]带着大批家臣前来请赏。众人依礼停在殿外，却足以让朝中侧目。\n\n“臣与宗族追随主公多年，只求赏罚分明。”[rp_petitioner.GetSheHe]说道，“旧部都在等候消息，若功劳迟迟没有下文，臣也难以劝服众人。”\n\n[rp_petitioner.GetHerHis]现有功勋为[rp_petitioner.MakeScope.Var('rp_merit_score').GetValue|0]；请赏态度为：[rp_petitioner.Custom('RPMeritAttitude')]。"
