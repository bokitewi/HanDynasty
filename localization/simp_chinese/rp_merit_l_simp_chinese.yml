 rp_merit_atonement_refused_opinion: "拒绝戴罪立功"

 rp_merit.2010.t: "犒赏不均"
 rp_merit.2010.desc: "庆功宴上，军吏依次将金帛送给有功将领，名单中却没有[rp_campaign_actor.GetTitledFirstName]。军中很快有人质疑，为何独独漏了[rp_campaign_actor.GetHerHim]。\n\n[rp_campaign_actor.GetTitledFirstNameNoTooltip]没有当众争辩，但脸色已经沉了下来。功簿记载，[rp_campaign_actor.GetHerHis]现有功勋为[rp_campaign_actor.MakeScope.Var('rp_merit_score').GetValue|0]，此事需要一个说法。"
 rp_merit.2010.a: "补赐金帛,当众抚慰"
 rp_merit.2010.b: "称主簿疏忽,事后再议"
 rp_merit.2010.c: "战时赏罚自有规矩"

 rp_merit.2011.t: "战车转向"
 rp_merit.2011.desc: "两军即将交锋时，[rp_campaign_actor.GetTitledFirstName]率领本部突然转向，直插我军侧翼。附近士卒无法判断这是调动、溃退还是哗变，阵线顿时出现缺口。\n\n几日前犒赏留下的怨气，终于在战场上爆发。若不立刻控制[rp_campaign_actor.GetHerHim]，全军将先于敌军进攻自行陷入混乱。"
 rp_merit.2011.a: "传令军法官截停其部"
 rp_merit.2011.b: "亲率卫队上前弹压"
 rp_merit.2011.c: "全军收束,先稳住阵脚"

 rp_campaign_incident_grateful_opinion: "军前抚慰"
 rp_campaign_incident_rebuked_opinion: "军前受责"
 rp_campaign_incident_risk_opinion: "心有不平"
 rp_campaign_discipline_modifier: "军纪稍振"
 rp_campaign_discipline_modifier_desc: "军中赏罚虽严,号令因此更为明白."
 rp_campaign_disorder_modifier: "阵脚动摇"
 rp_campaign_disorder_modifier_desc: "军中有功者心生不满,诸部一时观望."
 rp_campaign_vanguard_modifier: "先头部队"
 rp_campaign_vanguard_modifier_desc: "此人获准率部追击,声势一时高涨."

 rp_merit.2020.t: "追与不追"
 rp_merit.2020.desc: "敌军阵线已经崩溃，诸将纷纷请求追击。也有人提醒我，敌军旗号尚未完全散乱，前方狭路可能设有伏兵。\n\n“战机稍纵即逝。”[rp_campaign_actor.GetTitledFirstName]请命道，“主公若担心伏兵，臣愿率本部先行！”\n\n功簿记载，[rp_campaign_actor.GetHerHis]现有功勋为[rp_campaign_actor.MakeScope.Var('rp_merit_score').GetValue|0]。"
 rp_merit.2020.a: "准其追击,但不可深入"
 rp_merit.2020.b: "全军追击,不留余力"
 rp_merit.2020.c: "收兵回营,不追穷寇"

 rp_merit.2021.t: "山谷中伏"
 rp_merit.2021.desc: "追兵进入山谷后，两侧伏兵突然放箭，敌军同时封住退路。[rp_campaign_actor.GetTitledFirstName]的前锋被困其中，已经无法自行突围。\n\n现在必须决定，是投入兵力救出[rp_campaign_actor.GetHerHim]，守住谷口接应残兵，还是放弃这支遭到包围的前锋。"
 rp_merit.2021.a: "亲率援军突入"
 rp_merit.2021.b: "坚守谷口,接应残兵"
 rp_merit.2021.c: "壮士断腕,全军撤退"

 rp_merit.2030.t: "夜入敌营"
 rp_merit.2030.desc: "夜间巡营时，士卒发现[rp_campaign_actor.GetTitledFirstName]带着佩剑和令旗擅自离营。直到三更，[rp_campaign_actor.GetSheHe]才从敌营方向独自返回。\n\n“臣已经与敌将见过面了。”[rp_campaign_actor.GetSheHe]说道，“天亮之前，他们会给出答复。”\n\n这次交涉或许能够退敌，也可能使[rp_campaign_actor.GetHerHim]背上通敌之嫌。"
 rp_merit.2030.a: "此乃奇计,若能退敌当记首功"
 rp_merit.2030.b: "擅入敌营,拿下问罪"
 rp_merit.2030.c: "静待其变,明日再看"

 rp_merit.2040.t: "军前请缨"
 rp_merit.2040.desc: "军议中，[rp_campaign_actor.GetTitledFirstName]主动请求担任先锋，却被以不够老成持重为由拒绝。\n\n[rp_campaign_actor.GetSheHe|U]认为自己的勇武与旧功受到轻视，当众表现出不满。是更改任命、另作安抚，还是维护原议，诸将都在等待我的态度。"
 rp_merit.2040.a: "改任其为先锋"
 rp_merit.2040.b: "遣使安抚,许其后功"
 rp_merit.2040.c: "违抗军议,夺其兵权"

 rp_merit.2050.t: "免胄入阵"
 rp_merit.2050.desc: "战鼓响起后，[rp_campaign_actor.GetTitledFirstName]独自来到两军阵前，拔出兵器准备冲向敌阵。亲兵试图劝阻，却被[rp_campaign_actor.GetHerHim]拒绝。\n\n“旧过既然无法用言语洗清，臣便把这条命交给战场。”\n\n若不立刻下令，前线士卒只能自行决定救下[rp_campaign_actor.GetHerHim]，或是跟随冲锋。"
 rp_merit.2050.a: "急令鸣金,召回此将"
 rp_merit.2050.b: "遣精锐随其冲阵"
 rp_merit.2050.c: "求仁得仁,由他去吧"

 rp_merit.2060.t: "易衣代君"
 rp_merit.2060.desc: "我军阵线被冲开后，敌骑认出我的旗号，直扑中军而来。[rp_campaign_actor.GetTitledFirstName]赶到马前，扯下我的披风披在自己身上，又带着旗手向另一方向突围。\n\n追兵果然转向[rp_campaign_actor.GetHerHim]。我的退路已经打开，而[rp_campaign_actor.GetTitledFirstNameNoTooltip]却被敌军包围。"
 rp_merit.2060.a: "趁此机会,全军突围"
 rp_merit.2060.b: "命全军回援,救出此将"
 rp_merit.2060.c: "此乃诈敌之计,速撤"

 rp_merit.2070.t: "饥军鼓噪"
 rp_merit.2070.desc: "军粮即将耗尽，饥饿的士卒砸开辎重营栅栏，要求立即开放粮仓。几名试图阻拦的军吏已经被推倒，骚乱正向全营扩散。\n\n[rp_campaign_actor.GetTitledFirstName]带着执法士卒前来请示。是依军法镇压、开仓安抚，还是许诺战后重赏，必须立即决定。"
 rp_merit.2070.a: "杀一儆百,先正军纪"
 rp_merit.2070.b: "开仓放粮,与士卒同甘"
 rp_merit.2070.c: "许以战后重赏,暂缓危局"

 rp_merit.2090.t: "夜缒出城"
 rp_merit.2090.desc: "城池被围多日，[rp_campaign_actor.GetTitledFirstName]昨夜独自前往敌营劝退敌军，至今没有返回。\n\n清晨，敌军射来书信，声称[rp_campaign_actor.GetSheHe]已经归降，并要求我们立即开城。书信真伪未明，守军却已开始动摇。"
 rp_merit.2090.a: "此乃敌计,传令勿信"
 rp_merit.2090.b: "派人出城,打探虚实"
 rp_merit.2090.c: "既有降书,其家属皆治罪"

 rp_merit.2080.t: "军法如山"
 rp_merit.2080.desc: "今日操演时，我身边几名亲近之人在阵中说笑，又擅自离开位置，几次鼓令之后仍未完成阵形。\n\n负责操演的[rp_campaign_actor.GetTitledFirstName]当众喝止他们，并请求依照军法处置。所有人都在看，军法是否会为我的亲近之人让路。"
 rp_merit.2080.a: "准其执法"
 rp_merit.2080.b: "念其初犯,杖责免死"
 rp_merit.2080.c: "临阵换将,夺其兵权"

 rp_merit.2095.t: "三鼓之后"
 rp_merit.2095.desc: "敌军数次击鼓，[rp_campaign_actor.GetTitledFirstName]始终按兵不动，直到对方阵形出现混乱才下令出击。敌军溃败后，[rp_campaign_actor.GetSheHe]又查明退路与旗号，确认没有伏兵才准许追击。\n\n[rp_campaign_actor.GetHerHis|U]谨慎带来了胜利，却也被一些将领视为怯战。是否继续采纳[rp_campaign_actor.GetHerHis]判断，需要由我决定。"
 rp_merit.2095.a: "此乃良将,全权委以指挥"
 rp_merit.2095.b: "此乃怯战,按军法处置"
 rp_merit.2095.c: "姑且听之,但保留裁断"

 rp_campaign_life_saved_opinion: "代君脱险"
 rp_campaign_shamed_modifier: "军前受挫"
 rp_campaign_shamed_modifier_desc: "此人在军前受挫,锐气已折."
 rp_campaign_loyal_guard_modifier: "死忠护卫"
 rp_campaign_loyal_guard_modifier_desc: "此人曾在乱军中护主脱险,军中皆知其忠."
 rp_campaign_hunger_modifier: "饥军未平"
 rp_campaign_hunger_modifier_desc: "军中粮饷困窘,虽暂时压下,人心仍不安."
 rp_campaign_relief_modifier: "开仓劳军"
 rp_campaign_relief_modifier_desc: "君主亲自拨出粮饷,军中怨气稍解."
 rp_danshu_tiequan_modifier: "丹书铁券"
 rp_danshu_tiequan_modifier_desc: "此人受赐誓书,旧功可抵小过,其家门也因此更有底气."
 rp_merit_descendant_modifier: "功臣之后"
 rp_merit_descendant_modifier_desc: "此人出自旧功之家,常在君前露脸,宗族也因此多得照拂."
 rp_power_under_suspicion_modifier: "君前见疑"
 rp_power_under_suspicion_modifier_desc: "此人功名太盛,已被主公暗中猜忌."
 rp_power_stripped_modifier: "明升暗降"
 rp_power_stripped_modifier_desc: "此人名位似升,实则兵权被削,旧部亦多有不安."
 rp_power_retired_modifier: "功成身退"
 rp_power_retired_modifier_desc: "此人交还兵权,得以带着旧功安然退居朝外."
 rp_power_rebel_pressure_modifier: "旧部私议"
 rp_power_rebel_pressure_modifier_desc: "此人旧部私下串联,已使朝廷难以安心."
 rp_hereditary_office_modifier: "世官之许"
 rp_hereditary_office_modifier_desc: "此家因累世立功而获准更深地参与朝政."
 rp_banner_drums_privilege_modifier: "旗鼓之权"
 rp_banner_drums_privilege_modifier_desc: "此人获准在军中自领旗鼓,诸部对其号令更为信服."
 rp_fortification_privilege_modifier: "筑城之许"
 rp_fortification_privilege_modifier_desc: "此家获准修治城垒,以守采邑边境."
 rp_oath_tablets_modifier: "载书同盟"
 rp_oath_tablets_modifier_desc: "君臣之誓刻于简册,朝中旧臣因此更愿同心."
 rp_clan_grievance_modifier: "族党不平"
 rp_clan_grievance_modifier_desc: "此家族党认为旧功未被善待,暗中多有怨言."
 rp_privilege_granted_opinion: "特权获准"
 rp_privilege_refused_opinion: "特权被拒"
 rp_founding_memory_opinion: "追忆旧从"
 rp_founding_settled_dispute_opinion: "公断功争"
 rp_founding_unsettled_dispute_opinion: "旧功未平"

 rp_merit.3010.t: "献俘告庙"
 rp_merit.3010.desc: "[rp_founding_actor.GetTitledFirstName]带着俘虏和军旗前来，请我将此战所得告祭宗庙。\n\n“将士浴血，不只为金帛爵赏。”[rp_founding_actor.GetSheHe]说道，“若能将他们的名字告于先祖，军中自然知道何为荣耀。”"
 rp_merit.3010.a: "使其随从入庙,列名于简"
 rp_merit.3010.b: "军功归军府,不必惊动宗庙"
 rp_merit.3011.t: "输粟助军"
 rp_merit.3011.desc: "[rp_founding_actor.GetTitledFirstName]的家宰带来一批粮帛与甲杖，请求交给军府使用。\n\n“国中正有征役，我家主人不敢独享采邑之利。”家宰呈上账册，“愿以这些物资助军，报答主公旧恩。”"
 rp_merit.3011.a: "收其粮帛,记入功簿"
 rp_merit.3011.b: "以义嘉之,不收其财"
 rp_merit.3012.t: "请入朝为卿"
 rp_merit.3012.desc: "[rp_founding_actor.GetTitledFirstName]镇守一方多年，族中子弟也已陆续入仕。今日，[rp_founding_actor.GetSheHe]亲自请求参与朝议。\n\n“臣在外领兵理民，也该知道国政将往何处。”[rp_founding_actor.GetSheHe]说道，“还请主公准臣入朝议事。”"
 rp_merit.3012.a: "许其参议朝政"
 rp_merit.3012.b: "外臣守土即可"
 rp_merit.3013.t: "争邑讼功"
 rp_merit.3013.desc: "军府清点旧日封赏时，两份功簿对一处采邑的归属记载不一，随军老卒也各执一词。\n\n“当年是臣的部曲先登破门，阵亡者也多出自臣营。”[rp_founding_actor.GetTitledFirstName]说道，“如今若将此邑交给旁人，旧部如何心服？”"
 rp_merit.3013.a: "召吏按簿公断"
 rp_merit.3013.b: "争功乱法,先压下去"
 rp_merit.3014.t: "旧剑在席"
 rp_merit.3014.desc: "夜宴将散，[rp_founding_actor.GetTitledFirstName]却忽然解下佩剑，横放在我们之间。剑鞘已经开裂，护手上的缺口十分醒目。\n\n[rp_founding_actor.GetSheHe]抚过剑柄，神情中满是追忆：“主公可还记得当年，我与数十人冲入敌营……”"
 rp_merit.3014.a: "与其共饮,追忆旧难"
 rp_merit.3014.b: "旧事已远,不必多言"
 rp_merit.3015.t: "卿位之望"
 rp_merit.3015.desc: "[rp_founding_actor.GetTitledFirstName]的门客近来四处宣称，若旧臣有功而无名位，后来者便不会再为朝廷效死。\n\n今日，[rp_founding_actor.GetTitledFirstNameNoTooltip]亲自入见：“臣受国厚恩，也该替主公分忧了。”[rp_founding_actor.GetSheHe|U]虽然没有直接求官，来意却十分清楚。"
 rp_merit.3015.a: "给其名位,但扣其功簿"
 rp_merit.3015.b: "只记功,暂不许位"
 rp_merit.3016.t: "毁家纾难"
 rp_merit.3016.desc: "国用正紧，[rp_founding_actor.GetTitledFirstName]主动从自家仓廪拨出粮食与钱帛。\n\n“臣家尚有余粮，国中却有急用。”[rp_founding_actor.GetSheHe]说道，“主公若为用度忧心，旧臣岂能紧守私财？”"
 rp_merit.3016.a: "收下,并明记其义举"
 rp_merit.3016.b: "义心可嘉,财货仍归其家"
 rp_merit.3017.t: "请旗鼓"
 rp_merit.3017.desc: "[rp_founding_actor.GetTitledFirstName]呈上一幅旗样，请求为本部专置旗鼓。\n\n“战阵之中，寻常号令难以及远。”[rp_founding_actor.GetSheHe]说道，“若旧部能够望旗听鼓，进退便不会混乱。”"
 rp_merit.3017.a: "赐其旗鼓之权"
 rp_merit.3017.b: "旗鼓不可私专"
 rp_merit.3018.t: "质子保赏"
 rp_merit.3018.desc: "[rp_founding_actor.GetTitledFirstName]带着一名宗子入宫，请求让其留在朝中宿卫。\n\n“这孩子在主公身边学习规矩，臣家忠心也就有所凭托。”[rp_founding_actor.GetSheHe]说道，“主公也不必担忧臣在外生出异念。”"
 rp_merit.3018.a: "准其宗子宿卫"
 rp_merit.3018.b: "此举太重,暂且不许"
 rp_merit.3019.t: "族党请命"
 rp_merit.3019.desc: "[rp_founding_actor.GetTitledFirstName]的族人联名请命，希望我宽恕他们的家主。先前赏罚留下的怨气已经传遍整个家族。\n\n“旧臣若有失礼之处，自当领罪。”为首者说道，“还请主公念及[rp_founding_actor.GetHerHim]多年随征的情分，给[rp_founding_actor.GetHerHim]一次自新的机会。”"
 rp_merit.3019.a: "既是旧臣,许其自新"
 rp_merit.3019.b: "法不因旧功而废"

 rp_merit.3050.t: "请丹书"
 rp_merit.3050.desc: "[rp_founding_actor.GetTitledFirstName]带着旧功簿入见，请求我赐下一纸丹书。\n\n“臣不敢求永无罪过，只愿日后若因小过招来谗毁，主公仍能记得臣过去的功劳。”"
 rp_merit.3050.a: "赐丹书铁券,以示不忘"
 rp_merit.3050.b: "功归功,罪归罪"
 rp_merit.3051.t: "铁券验信"
 rp_merit.3051.desc: "数年后，[rp_founding_actor.GetTitledFirstName]的一名族人卷入争讼，官吏与朝臣都主张严惩。\n\n[rp_founding_actor.GetHerHis]家宰随即捧出我当年赐下的丹书：“主公旧誓在此。我等不敢求免罪，只求一线宽恩。”"
 rp_merit.3051.a: "旧誓尚在,从轻发落"
 rp_merit.3051.b: "丹书不可乱法"
 rp_merit.3060.t: "世官之议"
 rp_merit.3060.desc: "[rp_founding_actor.GetTitledFirstName]的家门早已不复寒微，族中子弟也多习律令与兵书。今日，[rp_founding_actor.GetSheHe]正式请求让家族世掌一职。\n\n“如此，后辈便知道该学什么，宗族也知道该向何处尽忠。”"
 rp_merit.3060.a: "许其世官之望"
 rp_merit.3060.b: "官不可世守"
 rp_merit.3061.t: "子弟入朝"
 rp_merit.3061.desc: "世官之议获准数年后，[rp_founding_actor.GetTitledFirstName]的族中子弟陆续来到都城，候补名册上出现了越来越多相同的姓氏。\n\n有人称他们知礼可用，也有人认为朝廷官位正在变成[rp_founding_actor.GetTitledFirstNameNoTooltip]家的私产。如今首批任命已经呈到案前。"
 rp_merit.3061.a: "择其贤者,列于朝班"
 rp_merit.3061.b: "暂缓任用,免成尾大"
 rp_merit.3070.t: "边邑旧界"
 rp_merit.3070.desc: "[rp_founding_actor.GetTitledFirstName]的采邑与邻地发生边界争执。双方地券与界石不符，农户也已为水渠和田埂发生冲突。\n\n“臣若自行处置，旁人会说我仗势侵地。”[rp_founding_actor.GetSheHe]将文书呈到案前，“若继续拖延，小争也会变成两族仇怨。”"
 rp_merit.3070.a: "遣使量田,定界于众"
 rp_merit.3070.b: "小邑小争,令其自理"
 rp_merit.3071.t: "定界之后"
 rp_merit.3071.desc: "定界一年后，农户已经恢复耕作，地方官也重新核定了田亩与赋役。\n\n[rp_founding_actor.GetTitledFirstName]送来第一批税粮：“地界既清，民心也就安了。能替主公理顺一方，才是臣真正想做的事。”"
 rp_merit.3071.a: "收赋并记功"
 rp_merit.3071.b: "治理本分,不必再赏"
 rp_merit.3080.t: "载书同盟"
 rp_merit.3080.desc: "[rp_founding_actor.GetTitledFirstName]带来一册旧日盟书，请求与我重新载书盟誓。\n\n“当年相从并非只为封赏。”[rp_founding_actor.GetSheHe]说道，“如今基业已定，更该让后人知道君臣为何同心。”"
 rp_merit.3080.a: "刻载书,重盟于庭"
 rp_merit.3080.b: "君臣名分已定,不必再盟"
 rp_merit.3081.t: "大难见誓"
 rp_merit.3081.desc: "数年后，朝局再起波澜，许多臣子都在观望。[rp_founding_actor.GetTitledFirstName]却率先入朝，并当众取出当年重立的盟书。\n\n“盟书尚在，臣不敢后至。”"
 rp_merit.3081.a: "旧盟可嘉,厚记其功"
 rp_merit.3081.b: "言语忠顺,且看其行"
 rp_merit.3090.t: "藏功不言"
 rp_merit.3090.desc: "近来战事的军功簿已经送到案前，唯有[rp_founding_actor.GetTitledFirstName]没有附上请赏文书。\n\n“臣追随主公多年，不愿再与后进争一日之名。”[rp_founding_actor.GetSheHe]说道，“主公知道臣做过什么，便已经足够了。”"
 rp_merit.3090.a: "先不张扬,记在心中"
 rp_merit.3090.b: "即刻公开记功"
 rp_merit.3091.t: "众论推功"
 rp_merit.3091.desc: "一年后，军府再次核对那场战事的功簿。几名将领虽然各自上书，却都将最关键的一功归给[rp_founding_actor.GetTitledFirstName]。\n\n“此人当日藏功不言，并不等于朝廷可以忘记。”军吏说道，“如今众论相同，应当决定是否补录。”"
 rp_merit.3091.a: "补录其功,使众人知义"
 rp_merit.3091.b: "以私谊慰之即可"

 rp_merit.3110.t: "后辈入侍"
 rp_merit.3110.desc: "[rp_founding_actor.GetTitledFirstName]领着族中后辈[rp_founding_descendant.GetTitledFirstName]来到殿前，请求让其入朝宿卫。\n\n“臣总有老去的一天。”[rp_founding_actor.GetSheHe]说道，“愿让这孩子在阶前执戟，学习朝廷规矩与军法。”"
 rp_merit.3110.a: "使其入侍,观政习礼"
 rp_merit.3110.b: "旧臣之功,不必累及子弟"
 rp_merit.3111.t: "后辈请学"
 rp_merit.3111.desc: "[rp_founding_descendant.GetTitledFirstName]独自入见，请求跟随朝中老吏学习律令，再向军府将校学习兵事。\n\n“先辈的功劳只能护我一时，不能教我如何办事。”[rp_founding_descendant.GetSheHe]说道，“将来若得任用，我不愿只凭家门声望占据官位。”"
 rp_merit.3111.a: "拨入学舍,使其成材"
 rp_merit.3111.b: "功臣之后不可专占名额"
 rp_merit.3112.t: "后辈从军"
 rp_merit.3112.desc: "[rp_founding_descendant.GetTitledFirstName]带着备好的甲胄与行囊来到军府，请求以普通军士的身份随军出征。\n\n“先辈的功劳不是我的功劳。”[rp_founding_descendant.GetSheHe]说道，“我想从队伍最末开始，亲手挣得自己的名字。”"
 rp_merit.3112.a: "给其小旗,从基层历练"
 rp_merit.3112.b: "少年气盛,先挫其锋"
 rp_merit.3113.t: "旧臣联姻"
 rp_merit.3113.desc: "[rp_founding_actor.GetTitledFirstName]提起[rp_founding_descendant.GetTitledFirstName]已经到了婚配之年，并试探着询问几户与我亲近的人家。\n\n“婚事自然该看年轻人的心意。”[rp_founding_actor.GetSheHe]说道，“只是两家若能彼此扶持，孩子日后的路也会稳些。”"
 rp_merit.3113.a: "赐礼成媒,使其家门安定"
 rp_merit.3113.b: "婚姻自择,君上不必插手"
 rp_merit.3114.t: "后辈争名"
 rp_merit.3114.desc: "朝议中，[rp_founding_descendant.GetTitledFirstName]越过几名资历更深的官员，当众请求承担更重的职事。\n\n“我家先辈在无人可用时追随主公，难道功臣之后只能永远站在人后？”\n\n有人赞赏[rp_founding_descendant.GetHerHis]胆气，也有人认为这个后辈过于急于争名。"
 rp_merit.3114.a: "有胆便给他一个露脸机会"
 rp_merit.3114.b: "少年争名,先压一压"

 rp_merit.4000.t: "功高震主"
 rp_merit.4000.desc: "近来，我在朝堂与军中不断听见[rp_power_hero.GetTitledFirstName]的名字。有人直言：“若无[rp_power_hero.GetFirstNameNoTooltip]，何来今日疆土？”也有朝臣提醒我，旧部对这名功臣的敬重已经超过寻常。\n\n功簿记载，[rp_power_hero.GetHerHis]现有功勋为[rp_power_hero.MakeScope.Var('rp_merit_score').GetValue|0]，峰值为[rp_power_hero.MakeScope.Var('rp_merit_peak_score').GetValue|0]。是继续厚赏、削去兵权，还是暂时观察，我必须有所决定。"
 rp_merit.4000.a: "厚加封赏,以安其心"
 rp_merit.4000.b: "削其兵权,明升暗降"
 rp_merit.4000.c: "姑且观之,不动声色"
 rp_merit.4201.t: "功臣结党"
 rp_merit.4201.desc: "密探将一份记录送到我的案前。[rp_power_hero.GetTitledFirstName]府中宾客日益增多，夜宴时也常有人谈论朝政。\n\n这些聚会可能只是旧部往来，也可能正在聚集对朝廷不满的人。我可以公开训诫、派人潜入，或以赏赐试探[rp_power_hero.GetHerHis]态度。"
 rp_merit.4201.a: "遣人训诫,勿使其骄"
 rp_merit.4201.b: "派细作潜入其府"
 rp_merit.4201.c: "赐其美酒,以示恩宠"
 rp_merit.4202.t: "军民颂功"
 rp_merit.4202.desc: "[rp_power_hero.GetTitledFirstName]入城时，士卒与百姓夹道相迎，欢呼声甚至压过官鼓。负责维持秩序的官吏将所见所闻如实报到我面前。\n\n其中还有一句醉后狂言：“若[rp_power_hero.GetFirstNameNoTooltip]为君，我等早享富贵了。”说话者或许只是酒后失言，但满城的颂声已经无法忽视。"
 rp_merit.4202.a: "严查造谣之人"
 rp_merit.4202.b: "命其上交兵符"
 rp_merit.4202.c: "当众嘉奖,以塞众口"
 rp_merit.4203.t: "上表请赏"
 rp_merit.4203.desc: "[rp_power_hero.GetTitledFirstName]的奏表被送到我面前，言辞十分恭谨，所求却并不轻。\n\n“臣等征战多年，将士多有死伤。愿主公另赐恩典，使旧部知道朝廷不忘有功之人。”\n\n[rp_power_hero.GetSheHe|U]没有明说想要土地还是世官，但这份请求不能只用一句嘉奖应付过去。"
 rp_merit.4203.a: "赐金代地"
 rp_merit.4203.b: "许其世官,缓其封土之请"
 rp_merit.4203.c: "驳回所请"
 rp_merit.4300.t: "图穷匕见"
 rp_merit.4300.desc: "[rp_power_hero.GetTitledFirstName]再次称病不朝，只让心腹前来传话。\n\n“臣愿功成身退，归老林泉。只是旧部仍仰赖臣一人，还请主公准许臣带甲自卫。”\n\n这份请退保留了兵权，也暗示[rp_power_hero.GetSheHe]不愿独自入宫。我可以准其退休、召来面议、先除后患，或再以姻亲稳住关系。"
 rp_merit.4300.a: "准其归老,赐金送出朝堂"
 rp_merit.4300.b: "召其入宫,当面议事"
 rp_merit.4300.c: "传旨赐死,以绝后患"
 rp_merit.4300.d: "联姻结亲,暂固其心"
 rp_merit.4401.t: "狡兔死"
 rp_merit.4401.desc: "[rp_power_hero.GetTitledFirstName]入宫后，我命人关闭殿门。埋伏的甲士从帘后走出时，[rp_power_hero.GetSheHe]没有反抗，只是看了我很久。\n\n“狡兔死，走狗烹；飞鸟尽，良弓藏。”\n\n这名旧日功臣已经明白，我召[rp_power_hero.GetHerHim]入宫并不是为了议事。"
 rp_merit.4401.a: "国法已定,不必再言"
 rp_merit.4402.t: "绝食而终"
 rp_merit.4402.desc: "廷尉审问数日，[rp_power_hero.GetTitledFirstName]始终否认谋反，只说府中所备不过是自己的丧葬之物。\n\n今日，狱吏前来向我报告：[rp_power_hero.GetSheHe]拒绝饮食，已经呕血而亡。朝中无人公开质疑此案，但我知道，功臣的死亡不会让所有议论随之消失。"
 rp_merit.4402.a: "令有司草草结案"
 rp_merit.4403.t: "功成身退"
 rp_merit.4403.desc: "[rp_power_hero.GetTitledFirstName]终于交还兵符。出城之日，我亲自前往相送，并将答应的金帛交到[rp_power_hero.GetHerHis]手中。\n\n“卿是社稷功臣，应当得享善终。”\n\n[rp_power_hero.GetSheHe|U]向我再拜，随后带着家人离开。聚集在城外的旧部虽然不满，最终仍放下了兵器。"
 rp_merit.4403.a: "善终亦是大赏"
 rp_merit.4404.t: "旧部响应"
 rp_merit.4404.desc: "派去传旨的人匆忙返回，[rp_power_hero.GetTitledFirstName]拒绝束手就擒。[rp_power_hero.GetHerHis]旧部已经开始串联，军中甚至有人公开高喊：“清君侧，正在今日！”\n\n对方尚未正式举起反旗，但我的使者已经无法安全进入军营。事情再也不能只用朝堂上的命令解决。"
 rp_merit.4404.a: "命诸将戒备,此事已成大患"

 rp_merit.2100.t: "旌旗微乱"
 rp_merit.2100.desc: "交锋中，前军几面旌旗错换位置，左右两部因此收到相反的号令，阵形已经出现混乱。\n\n“旗鼓是全军的耳目。”[rp_campaign_actor.GetTitledFirstName]说道，“若不立即重新整列，小错很快就会变成大乱。”"
 rp_merit.2100.a: "准其整旗,重明号令"
 rp_merit.2100.b: "小乱亦当问责"

 rp_merit.2101.t: "斥候疑尘"
 rp_merit.2101.desc: "追击刚刚开始，斥候便报告侧翼出现大片烟尘，无法判断是敌军别部，还是逃散的败兵与车马。\n\n[rp_campaign_actor.GetTitledFirstName]请求暂缓追击，先查明虚实；其他将领则认为不该因此放过扩大战果的机会。"
 rp_merit.2101.a: "谨慎为上,先探其虚实"
 rp_merit.2101.b: "乘胜疾进,不可失机"

 rp_merit.2102.t: "先登争赏"
 rp_merit.2102.desc: "战后清点首功时，几名不同部伍的士卒都声称自己最先登上敌垒。各方证词不一，争吵已经变成推搡。\n\n[rp_campaign_actor.GetTitledFirstName]将他们分开后前来请示：“若连这份功劳都说不清楚，日后重赏当前，各部只会争得更凶。”"
 rp_merit.2102.a: "赐少许金帛,息其争"
 rp_merit.2102.b: "先记入功簿,战后再议"
 rp_merit.2102.c: "军中争功,先以法压下"

 rp_merit.2103.t: "收拢散卒"
 rp_merit.2103.desc: "败退持续到入夜，失去建制的散卒仍不断返回营地。[rp_campaign_actor.GetTitledFirstName]亲自巡营，核对他们的姓名与旧部，将能够作战的人重新编入队列。\n\n天亮之前，溃兵已经重归各自旗号。[rp_campaign_actor.GetSheHe]虽未赢得战斗，却保住了败军的建制。"
 rp_merit.2103.a: "败中能收,亦当记功"
 rp_merit.2103.b: "败军之将,何功可言"

 rp_merit.2104.t: "鼓车失序"
 rp_merit.2104.desc: "退军途中，传令鼓车陷入泥中，鼓架也在拉扯时折断。中军号令随即中止，各部只能自行判断进退。\n\n“必须马上补鼓并重新整队。”[rp_campaign_actor.GetTitledFirstName]说道，“否则敌军追来时，我们连一道完整的命令都传不下去。”"
 rp_merit.2104.a: "拨钱修鼓,重整节制"
 rp_merit.2104.b: "斩失鼓者,使众知惧"

 rp_merit.2105.t: "护住辎重"
 rp_merit.2105.desc: "败军撤退时，敌骑绕过步卒，直奔落在后方的辎重队。[rp_campaign_actor.GetTitledFirstName]带着少数亲随返回断后，直到最后一辆粮车安全通过才撤回营中。\n\n[rp_campaign_actor.GetSheHe|U]保住了军粮、箭矢与备用兵器，使全军仍能继续作战。这份功劳应当如何记录？"
 rp_merit.2105.a: "败中护军,录其小功"
 rp_merit.2105.b: "赏其部曲,稳住人心"
 rp_merit.2105.c: "辎重归公,不得邀功"
 rp_merit.2110.t: "败将入帐"
 rp_merit.2110.desc: "战后，军吏将伤亡、失散和遗失的军械写入簿册，[rp_campaign_actor.GetTitledFirstName]则被召来说明败因。\n\n军令、友军和敌情都可能影响战局，但主将仍须为失败负责。是给[rp_campaign_actor.GetHerHim]一次挽回的机会，还是先以处罚稳定军心？"
 rp_merit.2110.confess.desc: "战后，[rp_campaign_actor.GetTitledFirstName]没有等待传唤，便主动解下佩剑请罪。\n\n“臣临阵判断失误，最后下令的人也是臣。”[rp_campaign_actor.GetSheHe]说道，“臣愿受军法，也愿戴罪重返战场，夺回今日所失。”"
 rp_merit.2110.blame.desc: "[rp_campaign_actor.GetTitledFirstName]受召入帐后并未请罪，反而将败因归于辎重迟误和诸部不听号令。\n\n“臣能调动的兵力不足半数，岂能独自承担所有过错？”[rp_campaign_actor.GetSheHe]说道，“若要问罪，就该把所有人的记录一起摆出来。”"
 rp_merit.2110.retire.desc: "[rp_campaign_actor.GetTitledFirstName]入帐后放下佩剑，请求解除军职。\n\n“臣没有统兵之才，也不愿再让士卒因臣的判断送命。”[rp_campaign_actor.GetSheHe]说道，“请让我退往后方，负责粮草或照看伤兵。”"
 rp_merit.2110.a: "能自请罪，尚可宽宥"
 rp_merit.2110.b: "令其戴罪立功"
 rp_merit.2110.c: "当众申饬，以明军法"
 rp_merit.2110.d: "先削其权，细察其辞"
 rp_merit.2110.e: "重责不贷，折其旧功"

 rp_merit.2600.t: "将请用兵"
 rp_merit.2600.desc: "[rp_war_demand_actor.GetTitledFirstName]披甲入见，并让军吏在地图上标出[rp_war_demand_target.GetPrimaryTitle.GetNameNoTier]的道路、关隘与屯兵之处。\n\n“军中太久没有大战，士卒也无处取得功名。”[rp_war_demand_actor.GetSheHe]说道，“[rp_war_demand_target.GetPrimaryTitle.GetNameNoTierNoTooltip]防备空虚，请主公出兵，并让臣担任前锋。”"
 rp_merit.2600.a: "记下此议,来日自有用兵之时"
 rp_merit.2600.b: "国家大计,岂容武夫催促"
 rp_merit.2600.c: "拨给钱粮,令其先整边备"
 rp_merit.2600.d: "先抚军心,使其整备而待时"
 rp_merit.2600.e: "既有锋芒,便许其先试兵机"

