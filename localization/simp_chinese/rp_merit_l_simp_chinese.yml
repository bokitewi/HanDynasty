 rp_merit_noble_resistance_modifier: "功臣抵制"
 rp_merit_noble_resistance_modifier_desc: "拒赏引发封臣观望,诸臣对君主的信任有所下降."
 rp_merit_honored_modifier: "受赐荣名"
 rp_merit_honored_modifier_desc: "此人因战功受赐荣名,声望有所增长."
 rp_honor_public_commission_modifier: "显命旌功"
 rp_honor_public_commission_modifier_desc: "此人的功劳被当朝公开记名,诸臣皆知其曾有实功."
 rp_trade_patent_modifier: "山泽市税"
 rp_trade_patent_modifier_desc: "此人获赐一段时期内的山泽、市税或采邑收益权,家计因此渐丰."
 rp_merit_salary_penalty_modifier: "罚俸问罪"
 rp_merit_salary_penalty_modifier_desc: "此人因失职受罚,俸禄与名望皆受折损."
 rp_atonement_border_service_modifier: "戴罪镇边"
 rp_atonement_border_service_modifier_desc: "此人正以边地差役或军中服务弥补旧过."
 rp_great_house_modifier: "世家大族"
 rp_great_house_modifier_desc: "此家累世从征受封,宗族渐盛,已为朝中不可轻忽的大族."
 rp_founding_house_modifier: "元从家门"
 rp_founding_house_modifier_desc: "此人因早年从龙而受封,家门开始由军中旧臣转为朝中世族."
 rp_founding_lineage_modifier: "立家成婚"
 rp_founding_lineage_modifier_desc: "此人蒙公庭扶植，得以立家成婚，宗嗣之望一时更盛。"
 rp_founding_dynasty_modifier: "元从家声"
 rp_founding_dynasty_modifier_desc: "此宗族因早年追随与受封而声望渐起,子弟繁衍,渐有门第之势."
 rp_merit_grain_redemption_modifier: "输粟赎过"
 rp_merit_grain_redemption_modifier_desc: "此人为弥补败绩,向军中输送粮秣财货."
 rp_merit_disgraced_officer_modifier: "败军失律"
 rp_merit_disgraced_officer_modifier_desc: "此人因败绩受罚,军中名望大损."
 rp_traitor_modifier: "叛臣投敌"
 rp_traitor_modifier_desc: "此人背弃旧主,军中与朝中皆以叛臣视之."

