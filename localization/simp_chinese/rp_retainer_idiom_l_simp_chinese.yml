 rp_retainer.0001.t: "宴席无果"
 rp_retainer.0001.desc: "最后一名宾客离席后，我才确认今夜无人愿意留下。席间虽然没有寻得可用之人，这场宴会却并非全无所得。\n\n至少从今日起，四方士人都会知道，我愿意开门延士，以宾礼相待。"
 rp_retainer.0001.a: "名声也算传出去了。"
 rp_retainer.0002.t: "宴席得贤"
 rp_retainer.0002.desc: "席间议论军政时，[rp_retainer.GetTitledFirstName]几次答中要害。我出言追问，[rp_retainer.GetSheHe]也能从容应对，显然早有准备。\n\n[rp_retainer.GetTitledFirstNameNoTooltip]随即向我行礼：“听闻主公礼贤下士，我愿留在门下效力。”\n\n此人确有可用之处，至于该如何相待，还要由我决定。"
 rp_retainer.0002.a: "收入门下。"
 rp_retainer.0002.b: "赐金遣行。"
 rp_retainer.0002.c: "以宾礼留之，使其知公庭重士。"
 rp_retainer.0002.d: "当席许以军令，使其知所从。"
 rp_retainer.0002.e: "先留幕中，细察其志。"
 rp_retainer.0003.t: "良才入席"
 rp_retainer.0003.desc: "[rp_retainer.GetTitledFirstName]起初并不起眼，直到宾客争论政事兵略时，[rp_retainer.GetSheHe]才指出众人都未曾留意的一处疏漏。席间随即安静下来。\n\n我又问了几个问题，[rp_retainer.GetSheHe]的回答都有条有理。这样的人才，值得我认真考虑是否收入门下。"
 rp_retainer.0003.a: "此人正可佐我。"
 rp_retainer.0003.b: "才固有之，缘分未到。"
 rp_retainer.0004.t: "高士登门"
 rp_retainer.0004.desc: "宴席散后，[rp_retainer.GetTitledFirstName]仍留在原处。我问起缘故，[rp_retainer.GetSheHe]便将席间谈过的军国之事重新梳理，并指出其中数处得失。\n\n这番见识并非寻常游士所有。如今[rp_retainer.GetSheHe]正等着我表明，幕府中是否有[rp_retainer.GetHerHim]的位置。"
 rp_retainer.0004.a: "请入幕府，共议军国。"
 rp_retainer.0004.b: "厚赉而别。"
 rp_retainer.0005.t: "奇才来投"
 rp_retainer.0005.desc: "宾客散尽后，我正要离席，却发现[rp_retainer.GetTitledFirstName]仍坐在原处。[rp_retainer.GetSheHe]衣饰简素，面对我的询问却没有半点局促。\n\n“主公设下此宴，并非只求宾客满座，而是想为天下求才。”\n\n寥寥数语便道破我的用意。此人究竟是真有大才，还是善于故作惊人，值得我亲自判断。"
 rp_retainer.0005.a: "大喜，此乃天授之才。"
 rp_retainer.0005.b: "此人非寻常器，且细察之。"
 rp_retainer.0005.c: "以厚礼延之，使其尽展其才。"
 rp_retainer.0005.d: "才虽可用，先令其知君威。"
 rp_retainer.0005.e: "以策试之，再定重用与否。"
 rp_retainer.0100.t: "途遇贤才"
 rp_retainer.0100.desc: "行经异乡时，我听见路旁有人高歌，便命队伍暂缓前行。[rp_retainer.GetTitledFirstName]衣衫破旧，见到我的仪仗却既不躲避，也不急着上前求告。\n\n我让随从问起姓名与来历，[rp_retainer.GetSheHe]的回答颇有见识。是延入门下、赠金相助，还是不予理会，全看我如何判断此人。"
 rp_retainer.0100.a: "此人气度不凡，延入门下。"
 rp_retainer.0100.b: "赐金相助，不留其身。"
 rp_retainer.0100.c: "狂士自狂，不必留意。"
 rp_retainer.0100.d: "下车相问，以礼结之。"
 rp_retainer.0100.e: "命从骑留人，先入幕府再说。"

 rp_idiom.0001.t: "退避三舍"
 rp_idiom.0001.desc: "斥候来报，敌军已经在前方扎营。我查看旗号时，认出对面主将正是曾经礼遇我的[rp_idiom_enemy.GetTitledFirstName]。\n\n如今我们各为其主，旧恩却不能当作从未发生。诸将已经聚在帐中，等待我决定如何面对这位故人。"
 rp_idiom.0001.a: "传令三军，退舍九十里，以报旧恩。"
 rp_idiom.0001.b: "军阵之上，私谊当断。"
 rp_idiom.0001.c: "假意后退，诱敌深入。"
 rp_idiom.0001.d: "修书明义，退而不怯。"
 rp_idiom.0001.e: "既在阵前，便以鼓旗决之。"
 rp_idiom.0010.t: "老马识途"
 rp_idiom.0010.desc: "队伍在岔路前停下，地图所记与眼前地形并不相符。继续乱走只会耗尽粮水，就地扎营也未必能等来援助。\n\n随行的老臣向我建议：“人会迷路，老马却记得旧道。不妨解开缰绳，让它们在前面带路。”"
 rp_idiom.0010.a: "纵老马前行，大队随其后。"
 rp_idiom.0010.b: "派精锐斥候探路。"
 rp_idiom.0010.c: "就地扎营，稳住队伍。"
 rp_idiom.0010.d: "马前人后，循迹而行，不急一时。"
 rp_idiom.0020.t: "完璧归赵"
 rp_idiom.0020.desc: "强邻的使者来到公庭，提出以重礼换取我国珍藏的宝物。言辞虽然谦恭，却始终不肯说明交付宝物后将如何履约。\n\n[rp_idiom_actor.GetTitledFirstName]见我迟疑，主动请命：“请让我奉宝出使。若对方守信，我便完成交易；若其有意强夺，我也会设法把宝物完整带回。”"
 rp_idiom.0020.a: "命其为行人，奉宝前往。"
 rp_idiom.0020.b: "婉拒，此宝乃国之重器。"
 rp_idiom.0020.c: "以假宝代之，欺之。"
 rp_idiom.0030.t: "老马识途"
 rp_idiom.0030.desc: "军队在风沙中迷失旧路，几次绕行后仍回到原处。士卒已经疲惫，粮队也不能继续这样消耗。\n\n[rp_idiom_actor.GetTitledFirstName]登高观察片刻，向我指出远处几处残存的车辙：“旧路并未消失，只是被风沙遮住了。若沿着这些痕迹走，应该能够返回正道。”"
 rp_idiom.0030.a: "听其所言，顺势而行。"
 rp_idiom.0030.b: "记其见识。"
 rp_idiom.0040.t: "窃符救赵"
 rp_idiom.0040.desc: "我在一日内接到三封邻邦的求援急报，守城兵力已经难以支撑。若等朝中完成调兵手续，援军赶到时只怕城池早已失守。\n\n[rp_idiom_actor.GetTitledFirstName]前来求见：“主公若不能立即发下兵书，我愿自担越权之罪，先持兵符调动援军。”"
 rp_idiom.0040.a: "准其发兵，事后孤自担责。"
 rp_idiom.0040.b: "不可！兵符岂可私窃。"
 rp_idiom.0040.c: "孤当修书一封，由你带去。"
 rp_idiom.0040.d: "先以金帛结其众，再行险计。"
 rp_idiom.0040.e: "速发锐卒，迟则城破。"
 rp_idiom.0050.t: "卧薪尝胆"
 rp_idiom.0050.desc: "败报仍放在我的案前。每当想起那场失败和随之失去的一切，我便无法把它当成一段已经过去的往事。\n\n我可以把这份耻辱留在身边，时时提醒自己等待复仇；也可以停止自苦，先治理眼前的国家；又或者不动声色地积蓄兵力。"
 rp_idiom.0050.a: "卧薪尝胆，以图雪耻。"
 rp_idiom.0050.b: "此乃自苦，治国当务实。"
 rp_idiom.0050.c: "暗蓄兵力，以待时机。"
 rp_idiom.0051.t: "三千越甲可吞吴"
 rp_idiom.0051.desc: "报捷的军书送到我面前时，我反复看了几遍，才确认那个让我多年不能忘怀的敌人已经败亡。\n\n昔日的耻辱终于得到洗雪。我为这一日付出的隐忍与准备，如今都有了结果。"
 rp_idiom.0051.a: "此仇已报。"
 rp_idiom.0060.t: "围魏救赵"
 rp_idiom.0060.desc: "盟友被围的消息传来后，我召集诸将商议救援。正面道路已经被敌军控制，若强行前往，援军很可能在抵达城下之前便遭到阻截。\n\n[rp_idiom_actor.GetTitledFirstName]指着地图上的敌后说道：“救援未必一定要赶到被围之地。若直取敌军腹心，对方必然回师，围困自然可解。”"
 rp_idiom.0060.a: "善！直捣其腹心。"
 rp_idiom.0060.b: "径往救援，持重为上。"
 rp_idiom.0060.c: "分兵两路。"
 rp_idiom.0060.d: "先绝其粮道，逼其自解。"
 rp_idiom.0060.e: "亲率锐骑，一鼓袭其后。"
 rp_idiom.0070.t: "朝秦暮楚"
 rp_idiom.0070.desc: "两方强邻的使者先后入殿，各自许诺庇护与利益，也都要求我疏远另一方。两份条件看似不同，威胁却几乎一模一样。\n\n我可以明确依附其中一国，也可以继续在两边周旋。无论如何，这种平衡都不会永远维持下去。"
 rp_idiom.0070.a: "依附其一，换取庇护。"
 rp_idiom.0070.b: "倒向另一边。"
 rp_idiom.0070.c: "虚与委蛇，两国皆不得罪。"
 rp_idiom.0080.t: "唇亡齿寒"
 rp_idiom.0080.desc: "强邻遣使向我借道攻打邻邦，并许诺事成后分出土地与财货。眼前的利益十分可观，但对方的军队一旦通过我国，便很难再请出去。\n\n[rp_idiom_actor.GetTitledFirstName]当庭劝阻：“邻邦若亡，我国便会直接面对这个强敌。唇亡齿寒，主公不可只看眼前之利。”"
 rp_idiom.0080.a: "借道，先取眼前之利。"
 rp_idiom.0080.b: "拒借道，与邻邦共抗强敌。"
 rp_idiom.0080.c: "遣使调解。"
 rp_idiom.0090.t: "奇货可居"
 rp_idiom.0090.desc: "夜间，[rp_idiom_actor.GetTitledFirstName]请求与我单独相见。[rp_idiom_actor.GetSheHe]寄身我的宫廷已久，如今终于亲口提起自己对故国尊位的宣称。\n\n“只要主公愿意资助我回国，今日所受之恩，来日必有重报。”\n\n这项承诺可能换来一位强大的盟友，也可能只是让我把大笔钱财押在一个流亡者身上。"
 rp_idiom.0090.a: "全力资助其归国。"
 rp_idiom.0090.b: "给予部分资助，静观其变。"
 rp_idiom.0090.c: "将此人献给强邻以结其欢心。"
 rp_idiom.0090.d: "厚养其人，以义结之。"
 rp_idiom.0090.e: "许其归国，先握其柄。"
 rp_idiom.0100.t: "一鸣惊人"
 rp_idiom.0100.desc: "许久以来，群臣已经习惯我少言少动，甚至有人把克制当成了无能。今日我重新召集朝议，百官都在等待我的第一道命令。\n\n既然决定不再沉默，我便要让所有人看见变化。只是这第一步，应当整顿内政、整军备战，还是广纳贤才并修订法度？"
 rp_idiom.0100.a: "整顿内政，罢黜冗官。"
 rp_idiom.0100.b: "整军经武，准备出兵。"
 rp_idiom.0100.c: "广纳贤才，修订法度。"
