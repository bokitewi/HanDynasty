 kuzhu_situation_dynastic_cycle_phase_normal_desc: "$kuzhu_situation_dynastic_cycle_phase_normal_desc_short$如果规避了[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName]，中华可以进入[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName]或[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName]\n\n如果触发了足够多的[situation_catalyst_catalysts|E]，中华会从该$game_concept_dynastic_cycle_era_short$进入[dynastic_cycle_era_type_instability|E]。"
