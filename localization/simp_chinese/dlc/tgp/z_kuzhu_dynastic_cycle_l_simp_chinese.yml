#新王朝循环时代
 kuzhu_situation_dynastic_cycle_phase_normal: "暗流涌动"
 kuzhu_situation_dynastic_cycle_phase_normal_icon: "@kuzhu_dynastic_cycle_instability_icon!$kuzhu_situation_dynastic_cycle_phase_normal$"
 kuzhu_situation_dynastic_cycle_phase_normal_desc: "$kuzhu_situation_dynastic_cycle_phase_normal_desc_short$如果及时消弭矛盾，中华可以重新进入[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName]或[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName]。\n\n如果触发了足够多的[situation_catalyst_catalysts|E]，中华会从该$game_concept_dynastic_cycle_era_short$逐步进入[dynastic_cycle_era_type_unstable|E]。"
 kuzhu_situation_dynastic_cycle_phase_normal_desc_short: "这是一个国家表面和平，内部蕴藏危机的[dynastic_cycle_era_short|E]。各个势力都在表面的平静下积攒力量，等待有利于自己的机会到来。" 
 ### ENTER CORRUPTION ###
 kuzhu_dynastic_cycle.0091.t: "疑云初现"
 kuzhu_dynastic_cycle.0091.desc: "国家承平日久，百官各安其职，天下一副太平景象。\n\n然朕偶闻坊间所传民谣，其中却有不平之音。"
 kuzhu_dynastic_cycle.0091.a: "存不忘亡，安必虑危。"
 # Notification for relevant people
 kuzhu_dynastic_cycle.0092.desc.involved: "上至朝堂，下至乡野，人们表面服从，内心却在动摇。\n\n虽然生活仍然可称富足，但是对美德的持守却屡遭质疑。昔日确保国家太平之法，如今时被当成阻碍士人自由的枷锁。"
 kuzhu_dynastic_cycle.0092.desc.interloper: "看起来[GetTitleByKey('h_china').GetNameNoTierNoTooltip]似乎走下坡路。\n\n日复一日，商队不再无条件信任那里的环境，有人开始谈论其他的经商福地。有好事者说那片土地已经告别了它的黄金时代。"
 kuzhu_dynastic_cycle.0092.desc.uninvolved: "$kuzhu_dynastic_cycle.0092.desc.interloper$"
 kuzhu_dynastic_cycle.0092.a: "且看他江山能固几时。" 
 dynastic_cycle_kuzhu_situation_dynastic_cycle_phase_normal_situation_phase: "$kuzhu_situation_dynastic_cycle_phase_normal$"
 dynastic_cycle_kuzhu_entered_normal_tt: "[GetSituation('dynastic_cycle').GetName]进入了[GetSituationType('dynastic_cycle').GetPhaseType('kuzhu_situation_dynastic_cycle_phase_normal').GetName]"
 KUZHU_IMPERIAL_GRACE_LOSS_NORMAL: "由于[dynastic_cycle|E]目前处于$kuzhu_situation_dynastic_cycle_phase_normal$阶段，所有#EMP $tributaries_celestial$#!每年失去@imperial_grace![EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability')|V1][imperial_grace|E]。"
