 ### ENTER CORRUPTION ###
 kuzhu_dynastic_cycle.0091.t: "疑云初现"
 kuzhu_dynastic_cycle.0091.desc: "国家承平日久，百官各安其职，天下一副太平景象。\n\n然朕偶闻坊间所传民谣，其中却有不平之音。"
 kuzhu_dynastic_cycle.0091.a: "存不忘亡，安必虑危。"
 # Notification for relevant people
 kuzhu_dynastic_cycle.0092.desc.involved: "上至朝堂，下至乡野，人们表面服从，内心却在动摇。\n\n虽然生活仍然可称富足，但是对美德的持守却屡遭质疑。昔日确保国家太平之法，如今时被当成阻碍士人自由的枷锁。"
 kuzhu_dynastic_cycle.0092.desc.interloper: "看起来[GetTitleByKey('h_china').GetNameNoTierNoTooltip]似乎走下坡路。\n\n日复一日，商队不再无条件信任那里的环境，有人开始谈论其他的经商福地。有好事者说那片土地已经告别了它的黄金时代。"
 kuzhu_dynastic_cycle.0092.desc.uninvolved: "$kuzhu_dynastic_cycle.0092.desc.interloper$"
 kuzhu_dynastic_cycle.0092.a: "且看他江山能固几时。" 
