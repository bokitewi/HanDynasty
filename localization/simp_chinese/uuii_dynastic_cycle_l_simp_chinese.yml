l_simp_chinese:
 uuii_claim_mandate_blocked_by_legitimate_hegemon_tt: "最高正统的天子仍在位时，不能宣告或夺取天命"
 uuii_dynastic_cycle.0001.t: "群雄割据的新格局"
 uuii_dynastic_cycle.0001.desc.high_authority_4: "天子正统臻于极盛，霸权得以延续。四级君权使首都法理帝国内的封臣继续臣服，其余直属封臣独立；其中原尊王派的独立诸侯转为天朝朝贡者。无人可以在此时宣告或夺取天命。"
 uuii_dynastic_cycle.0001.desc.high_authority_3: "天子正统臻于极盛，霸权得以延续。三级君权使首都法理王国内的封臣继续臣服，其余直属封臣独立；其中原尊王派的独立诸侯转为天朝朝贡者。无人可以在此时宣告或夺取天命。"
 uuii_dynastic_cycle.0001.desc.high_authority_2: "天子正统臻于极盛，霸权得以延续。二级君权使首都法理公国内的封臣继续臣服，其余直属封臣独立；其中原尊王派的独立诸侯转为天朝朝贡者。无人可以在此时宣告或夺取天命。"
 uuii_dynastic_cycle.0001.desc.high_authority_1: "天子正统臻于极盛，霸权得以延续。然而一级君权无法维系诸侯，所有直属封臣均告独立；其中原尊王派诸侯转为天朝朝贡者。无人可以在此时宣告或夺取天命。"
 uuii_dynastic_cycle.0001.desc.low_authority_4: "天子正统不足，霸权头衔随王朝崩解，但天子不被强制退位并保留直辖与普通头衔。四级君权使首都法理帝国内的封臣继续臣服，其余直属封臣独立，天下重新开放天命竞争。"
 uuii_dynastic_cycle.0001.desc.low_authority_3: "天子正统不足，霸权头衔随王朝崩解，但天子不被强制退位并保留直辖与普通头衔。三级君权使首都法理王国内的封臣继续臣服，其余直属封臣独立，天下重新开放天命竞争。"
 uuii_dynastic_cycle.0001.desc.low_authority_2: "天子正统不足，霸权头衔随王朝崩解，但天子不被强制退位并保留直辖与普通头衔。二级君权使首都法理公国内的封臣继续臣服，其余直属封臣独立，天下重新开放天命竞争。"
 uuii_dynastic_cycle.0001.desc.low_authority_1: "天子正统不足，霸权头衔随王朝崩解，但天子不被强制退位并保留直辖与普通头衔。一级君权下所有直属封臣均告独立，天下重新开放天命竞争。"
 uuii_dynastic_cycle.0001.a: "天下大势，由此而变"
