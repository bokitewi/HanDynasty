l_simp_chinese:
 mcpe.13.t:0 "恶毒的嘲讽"
 mcpe.13.d.no_bully_fallback:0 "另一个孩子当众嘲笑我，周围的人都没有出声，只等着看我如何回应。"
 mcpe.13.d.bully:0 "[bully.GetTitledFirstName|U]当众嘲笑我，周围的人都没有出声，只等着看我如何回应。"
 mcpe.13.a:0 "我用拳头打那个大嘴的脸！"
 mcpe.13.b:0 "我会记住这一点。总有一天你会付出代价的！"
 mcpe.13.c:0 "这只是言语。没什么可难过的。"
 mcpegr.13.d_bully:0 "[child.GetTitledFirstName|U]告诉我，[bully.GetTitledFirstName]曾当着其他孩子的面嘲笑[child.GetHerHim]。\n\n"
 mcpegr.13.d_no_bully_fallback:0 "[child.GetTitledFirstName|U]告诉我，另一个孩子曾当众嘲笑[child.GetHerHim]。\n\n"
 mcpegr.13.d_wrathful:0 "[child.GetSheHe|U]没有忍让，当场一拳打了过去。"
 mcpegr.13.d_vengeful:0 "[child.GetSheHe|U]没有立即发作，却发誓迟早要让对方付出代价。"
 mcpegr.13.d_calm:0 "[child.GetSheHe|U]只把那些话当作无聊的挑衅，没有放在心上。"
 mcpegr.13.confirm_wrathful:0 "对不尊重的适当回应。"
 mcpegr.13.confirm_vengeful:0 "很好。侮辱是不应该被忘记或被原谅的。"
 mcpegr.13.confirm_calm:0 "明智的决定。言语伤害不了[child.GetHerHim]。"
 mcpegr.13.wrathful_change:0 "[child.GetFirstNameNoTooltip|U]不应该忍住[child.GetHerHis]的愤怒！"
 mcpegr.13.vengeful_change:0 "[child.GetFirstNameNoTooltip|U] 应该记住这一点，并让他们有一天付出代价。"
 mcpegr.13.calm_change:0 "[child.GetFirstNameNoTooltip|U] 不应该因为言语而如此沮丧。"
 mcpe.14.t:0 "无爱的婚姻"
 mcpe.14.d:0 "我撞见一对成婚多年的仆人争吵。他们早已忘了争执的起因，却仍在互相指责，甚至声称这桩婚事是自己犯过最大的错误。"
 mcpe.14.a:0 "如果爱情就是这样，我不想要。"
 mcpe.14.b:0 "这只能说明人们只关心自己。"
 mcpe.14.c:0 "他们只需要花一些时间互相倾听！"
 mcpegr.14.d:0 "我听说[child.GetTitledFirstName]撞见一对仆人争吵。那两人为了琐事互相指责，还声称彼此成婚是个错误。\n\n"
 mcpegr.14.d_chaste:0 "[child.GetFirstNameNoTooltip|U]认为，如果所谓爱情最终只剩争吵，那还不如不要。"
 mcpegr.14.d_cynical:0 "[child.GetFirstNameNoTooltip|U]认为，这正说明人人首先考虑的都是自己。"
 mcpegr.14.d_patient:0 "[child.GetFirstNameNoTooltip|U]认为，只要两人肯耐心听完对方的话，事情总能解决。"
 mcpegr.14.confirm_chaste:0 "这是可以理解的反应。"
 mcpegr.14.confirm_cynical:0 "值得吸取的宝贵教训。"
 mcpegr.14.confirm_patient:0 "如果他们有这么聪明就好了……"
 mcpegr.14.chaste_change:0 "如果这就是爱情，你真的想要爱情吗？"
 mcpegr.14.cynical_change:0 "这只能说明人们只关心自己。"
 mcpegr.14.patient_change:0 "他们只需要花一些时间互相倾听！"
 mcpe.15.t:0 "无聊的讲座"
 mcpe.15.d:0 "我不得不坐下来听导师讲课。那声音又慢又平，等一句话说完，我已经忘了开头讲的是什么。我实在忍不住了……"
 mcpe.15.a:0 "进入正题吧，这太无聊了！"
 mcpe.15.b:0 "我必须尝试集中注意力，即使这很困难。"
 mcpe.15.c:0 "编一个借口离开，然后又编一个不回来的借口。"
 mcpegr.15.d:0 "我安排[child.GetTitledFirstName]听一位出了名沉闷的导师讲课，也想看看[child.GetSheHe]会如何应付。\n\n"
 mcpegr.15.d_impatient:0 "[child.GetSheHe|U]很快打断导师，直言这堂课无聊透顶。"
 mcpegr.15.d_diligent:0 "[child.GetSheHe|U]竟然从头到尾都在认真听讲。"
 mcpegr.15.d_deceitful:0 "[child.GetSheHe|U]找了个借口离开，又编了个理由不再回来。"
 mcpegr.15.confirm_impatient:0 "是的，[child.GetSheHe] 不应该让任何人浪费 [child.GetHerHis] 时间！"
 mcpegr.15.confirm_diligent:0 "非常令人印象深刻，[child.GetFirstNameNoTooltip]。"
 mcpegr.15.confirm_deceitful:0 "哈！多么有创意啊，[child.GetFirstNameNoTooltip]！"
 mcpegr.15.impatient_change:0 "[child.GetFirstNameNoTooltip|U] 不应该让任何人浪费 [child.GetHerHis] 时间！"
 mcpegr.15.diligent_change:0 "[child.GetFirstNameNoTooltip|U] 应该更加努力学习！"
 mcpegr.15.deceitful_change:0 "[child.GetFirstNameNoTooltip|U]应该只是找个借口离开！"
 mcpe.16.t:0 "迷恋在城里"
 mcpe.16.d.no_crush:0 "我喜欢上了一名普通的[child.Custom('servant_for_romance')]，可对方的家人很快就要离开。若我现在不表明心意，或许以后再也见不到了。"
 mcpe.16.d.crush:0 "我喜欢上了[crush.GetTitledFirstName]。现在正是表明心意的机会，可每当我想要开口，心里便有些害怕。"
 mcpe.16.a:0 "试着找个机会表白我的感受。"
 mcpe.16.b:0 "是时候在不露面的情况下进行一些间谍活动了......"
 mcpe.16.c:0 "把自己锁在房间里，希望没有人注意到我。"
 mcpegr.16.d:0 "我发现[child.GetTitledFirstName]似乎喜欢上了[crush.GetTitledFirstName]。\n\n"
 mcpegr.16.d.no_crush:0 "我发现[child.GetTitledFirstName]似乎喜欢上了一名普通的[child.Custom('servant_for_romance')]。\n\n"
 mcpegr.16.d_brave:0 "[child.GetFirstNameNoTooltip|U]最终鼓起勇气，当面说出了自己的心意。"
 mcpegr.16.d_lustful:0 "[child.GetFirstNameNoTooltip|U]没有表明心意，反而总在暗中观察对方。"
 mcpegr.16.d_shy:0 "[child.GetFirstNameNoTooltip|U]把自己关在房里，只希望没人发现这份心思。"
 mcpegr.16.confirm_brave:0 "到底应该怎样做。"
 mcpegr.16.confirm_lustful:0 "哈！这是一个成人仪式。"
 mcpegr.16.confirm_shy:0 "这是可以理解的反应。"
 mcpegr.16.brave_change:0 "[child.GetFirstNameNoTooltip|U]应该坦白[child.GetHerHis]的感受！"
 mcpegr.16.lustful_change:0 "[child.GetFirstNameNoTooltip|U]刚刚传递了一个绝佳的间谍机会。"
 mcpegr.16.shy_change:0 "[child.GetFirstNameNoTooltip|U] 应该住在 [child.GetHerHis] 房间！"
 mcpe.17.t:0 "强盗的苏醒"
 mcpe.17.d:0 "我发现一名仆人的孩子躲在角落哭泣。原来[child.GetSheHe]去市场买食物时遭人抢劫，如今既害怕又不知所措。"
 mcpe.17.a:0 "没想到外面这么危险"
 mcpe.17.b:0 "嗯，这听起来不像是“我的”问题。"
 mcpe.17.c:0 "加油，我会和你分享一些我自己做的食物。"
 mcpegr.17.d:0 "[child.GetTitledFirstName|U]发现一名仆人的孩子因在市场遭到抢劫而哭泣。我问[child.GetFirstNameNoTooltip]打算如何处置，[child.GetSheHe]回答道：\n\n"
 mcpegr.17.d_craven:0 "“我不知道外面这样危险。我们以后应当更加小心。”"
 mcpegr.17.d_callous:0 "“这与我无关。为什么要拿这种事来烦我？”"
 mcpegr.17.d_generous:0 "“我们可以分些食物给他们，至少别让他们继续挨饿。”"
 mcpegr.17.confirm_craven:0 "是的，那里确实很危险。"
 mcpegr.17.confirm_callous:0 "绝对的。这根本不是我们的问题。"
 mcpegr.17.confirm_generous:0 "与他们分享是正确的事情。"
 mcpegr.17.craven_change:0 "难道你不知道外面有多危险吗？"
 mcpegr.17.callous_change:0 "但这为什么是我们的问题呢？"
 mcpegr.17.generous_change:0 "我们应该与仆人分享我们的食物。"
 mcpe.18.t:0 "外国美食"
 mcpe.18.d:0 "宴会上，有人请我品尝一道昂贵的异乡菜肴。我刚吃一口便觉得难以下咽，可我腹中饥饿，主人又正等着听我的评价。"
 mcpe.18.a:0 "我可能吃得更好，但食物仍然是食物。"
 mcpe.18.b:0 "这“美味”，实在是太垃圾了！"
 mcpe.18.c:0 "我想我不太喜欢这种美味的食物......"
 mcpegr.18.d:0 "我带[child.GetTitledFirstName]参加宴会。席间有人请[child.GetHerHim]品尝一道昂贵的异乡菜肴，但[child.GetHerHis]的神情已经说明了一切。\n\n"
 mcpegr.18.d_gluttonous:0 "尽管并不喜欢，[child.GetSheHe]还是把盘中的食物吃了个干净。"
 mcpegr.18.d_honest:0 "[child.GetSheHe|U]当众承认，这道所谓的美味实在难以下咽。"
 mcpegr.18.d_temperate:0 "[child.GetSheHe|U]放下餐具，认定昂贵的食物未必值得多吃。"
 mcpegr.18.confirm_gluttonous:0 "好吧，糟糕的食物仍然是食物。"
 mcpegr.18.confirm_honest:0 "没错！你告诉他们，[child.GetFirstNameNoTooltip]！"
 mcpegr.18.confirm_temperate:0 "一个人应该只吃必需的东西。"
 mcpegr.18.gluttonous_change:0 "糟糕的食物仍然是食物！"
 mcpegr.18.honest_change:0 "[child.GetFirstNameNoTooltip|U] 应该只是说食物很糟糕！"
 mcpegr.18.temperate_change:0 "也许精致的食物不适合 [child.GetFirstNameNoTooltip]。"
 mcpe.19.t:0 "判断"
 mcpe.19.d:0 "一个小偷闯入我的房间，在搜找值钱物件时毁坏了不少财物。守卫很快将人抓住，并把如何惩处对方的决定交给了我。"
 mcpe.19.a:0 "您必须努力修复您造成的损害。"
 mcpe.19.b:0 "我会很高兴让你受苦！"
 mcpe.19.c:0 "你只需要保证不再这样做。"
 mcpegr.19.d:0 "一名小偷闯入[child.GetTitledFirstNamePossessive]的房间，并毁坏了不少财物。守卫抓住此人后，我询问[child.GetFirstNameNoTooltip]该如何处置。\n\n"
 mcpegr.19.d_just:0 "[child.GetSheHe|U]认为，小偷应该亲手修复自己造成的损失。"
 mcpegr.19.d_sadistic:0 "[child.GetSheHe|U]只想让小偷尽可能多受些苦。"
 mcpegr.19.d_forgiving:0 "[child.GetSheHe|U]愿意放走小偷，只要对方保证不再犯。"
 mcpegr.19.confirm_just:0 "对犯罪行为给予合理的处罚。"
 mcpegr.19.confirm_sadistic:0 "是的。让他们真的后悔不已。"
 mcpegr.19.confirm_forgiving:0 "多么仁慈啊。"
 mcpegr.19.just_change:0 "不，罪应刑罚相适应！"
 mcpegr.19.sadistic_change:0 "不行，让他们受苦吧！"
 mcpegr.19.forgiving_change:0 "不，要仁慈、宽恕！"
 mcpe.20.t:0 "新玩具"
 mcpe.20.d:0 "[guardian.GetTitledFirstName|U]带我去市场挑选新玩具。摊位上的东西让人眼花缭乱，而我只能选一样。"
 mcpe.20.a:0 "这些玩具对我来说都不够好！"
 mcpe.20.b:0 "我正在寻找最昂贵的！"
 mcpe.20.c:0 "我想要那个！等等，不对，是这个！等等，我其实想要这个！"
 mcpegr.20.d:0 "我带[child.GetTitledFirstName]去市场挑选新玩具，并答应让[child.GetHerHim]自行选择。\n\n"
 mcpegr.20.d_arrogant:0 "[child.GetSheHe|U]看遍所有摊位，却说没有一样东西配得上自己。"
 mcpegr.20.d_greedy:0 "[child.GetSheHe|U]特意挑中最昂贵的玩具，反正最后付钱的人是我。"
 mcpegr.20.d_fickle:0 "[child.GetSheHe|U]迟迟无法决定，每看见一件新玩具便立刻改变主意。"
 mcpegr.20.confirm_arrogant:0 "也罢。"
 mcpegr.20.confirm_greedy:0 "[child.GetFirstNameNoTooltip|U] 懂得珍惜财富。"
 mcpegr.20.confirm_fickle:0 "保持开放的心态是件好事。"
 mcpegr.20.arrogant_change:0 "[child.GetFirstNameNoTooltip|U]应该有更高的标准！"
 mcpegr.20.greedy_change:0 "[child.GetFirstNameNoTooltip|U]应该学会珍惜财富！"
 mcpegr.20.fickle_change:0 "[child.GetFirstNameNoTooltip|U]应该学会保持开放的心态！"
 mcpe.21.t:0 "土地之旅"
 mcpe.21.d:0 "[guardian.GetTitledFirstName|U]带我巡视家族的领地，让我熟悉这里的土地与民众。行程将尽时，[guardian.GetSheHe]问我还想去哪里。"
 mcpe.21.a:0 "我想和一些当地人交谈！"
 mcpe.21.b:0 "人们用奇怪的眼神看着我们。我们回家吧。"
 mcpe.21.c:0 "没什么，今天的事情我已经累了。"
 mcpegr.21.d:0 "我带[child.GetTitledFirstName]巡视家族的领地，让[child.GetHerHim]熟悉这里的土地与民众。行程将尽时，我问[child.GetSheHe]是否还有别的打算。\n\n"
 mcpegr.21.d_gregarious:0 "[child.GetFirstNameNoTooltip|U]想同当地人谈谈，亲自听听他们的生活。"
 mcpegr.21.d_paranoid:0 "[child.GetFirstNameNoTooltip|U]担心路人一直在暗中观察我们，坚持立刻回去。"
 mcpegr.21.d_lazy:0 "[child.GetFirstNameNoTooltip|U]已经走累了，只想尽快结束这次巡视。"
 mcpegr.21.confirm_gregarious:0 "好主意！"
 mcpegr.21.confirm_paranoid:0 "你永远不能太谨慎。"
 mcpegr.21.confirm_lazy:0 "是的，我们休息吧。"
 mcpegr.21.gregarious_change:0 "[child.GetSheHe|U] 应该与一些当地人交谈！"
 mcpegr.21.paranoid_change:0 "[child.GetSheHe|U]应该更担心[child.GetHerHis]的安全！"
 mcpegr.21.lazy_change:0 "[child.GetSheHe|U] 应该享受应有的休息。"
 mcpe.22.t:0 "罪的工价"
 mcpe.22.d:0 "附近一直有人传言，一名隐居者私下过着不敬神明的生活，却始终没有确凿证据。最近，那人的住处失火，众人都说这是报应。"
 mcpe.22.a:0 "明确警告不要亵渎神圣！"
 mcpe.22.b:0 "光是谣言并不能成为看不起别人的理由！"
 mcpe.22.c:0 "无论人们怎么说，我们都应该帮助他们重建！"
 mcpegr.22.d:0 "附近一直有人指责一名隐居者不敬神明，却拿不出证据。最近那人的住处失火，[child.GetTitledFirstName]得知此事后对我说道：\n\n"
 mcpegr.22.d_zealous:0 "“这一定是神明的警告。那个罪人终于得到了报应！”"
 mcpegr.22.d_humble:0 "“传言不能证明什么，我们不该装作知道别人的真实品行。”"
 mcpegr.22.d_compassionate:0 "“不论传言是真是假，我们都该帮助这个可怜的人重建家园。”"
 mcpegr.22.confirm_zealous:0 "是的，罪人将会得到他们应得的报应！"
 mcpegr.22.confirm_humble:0 "是的，我们不应该看不起别人。"
 mcpegr.22.confirm_compassionate:0 "是的，我们应该永远帮助那些有需要的人。"
 mcpegr.22.zealous_change:0 "[child.GetFirstNameNoTooltip|U]不应该质疑神的意志！"
 mcpegr.22.humble_change:0 "[child.GetFirstNameNoTooltip|U]不知道他们的真实性格！"
 mcpegr.22.compassionate_change:0 "[child.GetFirstNameNoTooltip|U] 应该帮助有需要的可怜的灵魂！"
 mcpe.23.t:0 "短课"
 mcpe.23.d:0 "我正在听导师授课，窗外却传来其他孩子玩耍的声音。导师看出我心不在焉，主动提出提前结束，并答应替我承担责任。"
 mcpe.23.a:0 "谢谢！"
 mcpe.23.b:0 "不，我答应过要学完课的，我一定会学完的。"
 mcpe.23.c:0 "不管你怎么说，我还是要去。"
 mcpegr.23.d:0 "我看见几个孩子在外面玩耍，而[child.GetTitledFirstName]此时本该跟随导师学习。\n\n"
 mcpegr.23.d_trusting:0 "不久，[child.GetSheHe]也加入了他们。导师后来告诉我，是自己主动提前结束了课程。"
 mcpegr.23.d_stubborn:0 "[child.GetSheHe|U]始终没有离开。导师后来告诉我，[child.GetFirstNameNoTooltip]坚持完成当天的课程，因为这是早已答应好的事。"
 mcpegr.23.d_arbitrary:0 "不久，[child.GetSheHe]也加入了他们。导师后来告诉我，[child.GetFirstNameNoTooltip]根本没有得到离开的许可。"
 mcpegr.23.confirm_trusting:0 "有时课程提前结束。"
 mcpegr.23.confirm_stubborn:0 "是的。始终坚持计划，[child.GetFirstNameNoTooltip]！"
 mcpegr.23.confirm_arbitrary:0 "为什么 [child.GetFirstNameNoTooltip] 需要许可？"
 mcpegr.23.trusting_change:0 "[child.GetFirstNameNoTooltip|U] 应该直接要求离开！"
 mcpegr.23.stubborn_change:0 "[child.GetFirstNameNoTooltip|U] 应该坚持上课！"
 mcpegr.23.arbitrary_change:0 "[child.GetFirstNameNoTooltip|U] 应该直接走开！"
 mcpe.24.t:0 "梦想"
 mcpe.24.d:0 "我刚从一场梦中醒来。梦里的我是一位统治广阔疆土的强大君主，而其中最令我难忘的是……"
 mcpe.24.a:0 "......我拥有的权力和尊重。"
 mcpe.24.b:0 "......我拥有的数不尽的财富。"
 mcpe.24.c:0 "...我的人民的笑容，过着幸福而充实的生活。"
 mcpegr.24.d:0 "[child.GetTitledFirstName|U]告诉我，[child.GetSheHe]梦见自己成为统治广阔疆土的君主。\n\n"
 mcpegr.24.d_ambitious:0 "[child.GetSheHe|U]最留恋梦中的权力与敬畏，还想在现实中取得同样的地位。"
 mcpegr.24.d_greedy:0 "[child.GetSheHe|U]最留恋梦中数不尽的财富，还想在现实中拥有这一切。"
 mcpegr.24.d_compassionate:0 "[child.GetSheHe|U]最难忘的是民众安居乐业的景象，也希望现实中的人们能够如此幸福。"
 mcpegr.24.confirm_ambitious:0 "权力是一件值得努力的好东西。"
 mcpegr.24.confirm_greedy:0 "财富是一件值得努力去争取的好东西。"
 mcpegr.24.confirm_compassionate:0 "幸福是一件值得努力去争取的好事情。"
 mcpegr.24.ambitious_change:0 "你应该寻求权力！"
 mcpegr.24.greedy_change:0 "你应该寻求财富！"
 mcpegr.24.compassionate_change:0 "你应该去寻求幸福！"
 mcpe.25.t:0 "跟踪者"
 mcpe.25.d:0 "最近，一名普通的[child.Custom('servant_for_romance')]总在远处偷偷看我。每当我有所察觉，对方便立刻躲开。难道有人在暗中爱慕我？"
 mcpe.25.a:0 "我绝对喜欢这种关注！"
 mcpe.25.b:0 "这让我真的很不舒服。"
 mcpe.25.c:0 "……他们可能想谋杀我。"
 mcpegr.25.d:0 "我发现一名普通的[child.Custom('servant_for_romance')]总在暗中注视[child.GetTitledFirstName]，一被察觉便立刻躲开。看来[child.GetFirstNameNoTooltip]有了一位仰慕者。\n\n"
 mcpegr.25.d_lustful:0 "[child.GetSheHe|U]似乎十分享受这份关注。"
 mcpegr.25.d_chaste:0 "这种窥视让[child.GetHerHim]很不自在。"
 mcpegr.25.d_paranoid:0 "[child.GetSheHe|U]却认定这不是爱慕，而是有人企图谋害自己。"
 mcpegr.25.confirm_lustful:0 "为什么 [child.GetSheHe] 不应该享受它？"
 mcpegr.25.confirm_chaste:0 "正如它应该的那样。这是不恰当的。"
 mcpegr.25.confirm_paranoid:0 "是的，外表可能具有欺骗性。"
 mcpegr.25.lustful_change:0 "[child.GetFirstNameNoTooltip|U] 应该享受关注！"
 mcpegr.25.chaste_change:0 "[child.GetFirstNameNoTooltip|U]应该拒绝这些诱惑！"
 mcpegr.25.paranoid_change:0 "[child.GetFirstNameNoTooltip|U]应该更加关心[child.GetHerHis]的安全！"
 mcpe.26.t:0 "到外面散步"
 mcpe.26.d:0 "几个孩子邀我偷偷溜出城堡，到野外独自待上一阵。他们说这样才能证明我不靠守卫也能照顾自己——只要我有这个胆量。"
 mcpe.26.a:0 "为什么不呢？我不害怕外面的现实世界！"
 mcpe.26.b:0 "没有看守就出去吗？不可能，那很“危险”！"
 mcpe.26.c:0 "当然。但为了以防万一，一些谨慎的警卫会跟着我们。"
 mcpegr.26.d:0 "昨天，我到处都找不到[child.GetTitledFirstName]。有人最后看见[child.GetHerHim]与几个孩子同行，他们似乎一起溜出了城堡。\n\n"
 mcpegr.26.d_brave:0 "今天，[child.GetFirstNameNoTooltip]与其他孩子安然归来。众人都在称赞[child.GetHerHis]的胆量，还四处讲述这次冒险。"
 mcpegr.26.d_craven:0 "今天，我在旧衣柜里找到了[child.GetFirstNameNoTooltip]。原来[child.GetSheHe]害怕外面的危险，根本没有跟其他孩子离开。"
 mcpegr.26.d_deceitful:0 "今天，[child.GetFirstNameNoTooltip]与其他孩子安然归来。守卫随后告诉我，[child.GetSheHe]早已暗中请他们一路跟随。"
 mcpegr.26.confirm_brave:0 "哈！ [child.GetFirstNameNoTooltip|U]什么都不怕！"
 mcpegr.26.confirm_craven:0 "[child.GetFirstNameNoTooltip|U] 知道如何避免麻烦。"
 mcpegr.26.confirm_deceitful:0 "表现出勇敢，没有不必要的风险。聪明的。"
 mcpegr.26.brave_change:0 "[child.GetFirstNameNoTooltip|U]应该证明[child.GetHerHis]的勇敢！"
 mcpegr.26.craven_change:0 "[child.GetFirstNameNoTooltip|U] 应该远离麻烦！"
 mcpegr.26.deceitful_change:0 "[child.GetFirstNameNoTooltip|U]应该只是撒谎了！"
 mcpe.27.t:0 "葬礼"
 mcpe.27.d:0 "家中一位忠实的仆人去世了。葬礼上，我看着这个熟悉的人永远离开，第一次认真想到：无论身份如何，每个人终究都会死。"
 mcpe.27.a:0 "……没有神圣的指引，我们什么都不是。"
 mcpe.27.b:0 "……权力和荣耀最终都毫无意义。"
 mcpe.27.c:0 "……这个葬礼既无聊又烦人。"
 mcpegr.27.d:0 "家中一位忠实的仆人去世了。葬礼上，[child.GetTitledFirstName]若有所思，我便问[child.GetHerHim]如何看待生死。\n\n"
 mcpegr.27.d_zealous:0 "[child.GetSheHe|U]认为，短暂的生命若没有神明指引便毫无意义，唯有信仰能让人找到归宿。"
 mcpegr.27.d_content:0 "[child.GetSheHe|U]认为，既然每个人终有一死，权力和荣誉便不值得穷尽一生追逐。"
 mcpegr.27.d_callous:0 "[child.GetSheHe|U]只觉得葬礼无聊又麻烦，死者也不会在意有没有人陪伴。"
 mcpegr.27.confirm_zealous:0 "明智地说，[child.GetFirstNameNoTooltip|U]。"
 mcpegr.27.confirm_content:0 "是的，权力和荣耀总是转瞬即逝。"
 mcpegr.27.confirm_callous:0 "我同意。为什么我们必须在那里？"
 mcpegr.27.zealous_change:0 "这是一个重要的宗教仪式！"
 mcpegr.27.content_change:0 "权力和荣耀总是转瞬即逝！"
 mcpegr.27.callous_change:0 "为什么还要关心这个葬礼？"
 mcpe.28.t:0 "旅行商人"
 mcpe.28.d:0 "一名旅行商人来到城堡，向我展示异乡食物、玩具和护符，还为每件货物编出一段惊险来历。[guardian.GetTitledFirstName]赶来时，商人正问我看中了什么。"
 mcpe.28.a:0 "这食物看起来很好吃！我想尝试一下！"
 mcpe.28.b:0 "我想要这个神秘的幸运符！"
 mcpe.28.c:0 "我并不傻。我不会相信这些谎言。"
 mcpegr.28.d:0 "一名旅行商人来到城堡，向[child.GetTitledFirstName]展示各种异乡货物，还讲了不少离奇故事。\n\n"
 mcpegr.28.d_gluttonous:0 "[child.GetSheHe|U]对那些神秘护符毫无兴趣，目光始终停在异乡食物上。"
 mcpegr.28.d_trusting:0 "[child.GetSheHe|U]相信了商人的故事，请我买下一枚来自远方的幸运护符。"
 mcpegr.28.d_cynical:0 "[child.GetSheHe|U]看穿了商人的吹嘘，断定那些所谓的神秘力量全是谎话。"
 mcpegr.28.confirm_gluttonous:0 "吃得好没什么不好！"
 mcpegr.28.confirm_trusting:0 "当然可以，随心所欲。"
 mcpegr.28.confirm_cynical:0 "[child.GetFirstNameNoTooltip|U] 并不那么容易被欺骗。"
 mcpegr.28.gluttonous_change:0 "你应该尝尝这里的食物，[child.GetFirstNameNoTooltip|U]！"
 mcpegr.28.trusting_change:0 "你应该拿走好运符！"
 mcpegr.28.cynical_change:0 "你怎么会相信这些谎言呢？"
 mcpe.29.t:0 "款待"
 mcpe.29.d:0 "一户远道而来的旅人借宿城堡。他们的孩子找到我，认真询问该如何回报这几日的款待。"
 mcpe.29.a:0 "不需要感谢我们。"
 mcpe.29.b:0 "你能帮我做一些家务吗？"
 mcpe.29.c:0 "……你为什么跟我说话？"
 mcpegr.29.d:0 "一户远道而来的旅人借宿城堡。他们的孩子找到[child.GetTitledFirstName]，询问该如何回报我们的款待。\n\n"
 mcpegr.29.d_just:0 "[child.GetFirstNameNoTooltip|U]表示，接待旅人本就是主人的责任，不必额外回报。"
 mcpegr.29.d_lazy:0 "[child.GetFirstNameNoTooltip|U]请对方替自己完成几件杂务。"
 mcpegr.29.d_shy:0 "[child.GetFirstNameNoTooltip|U]不知该如何回应，此后一直躲在自己的房间里。"
 mcpegr.29.confirm_just:0 "是的，事情应该是这样的。"
 mcpegr.29.confirm_lazy:0 "嗯，我想他们可以帮忙..."
 mcpegr.29.confirm_shy:0 "让我们给 [child.GetHerHim] 一些空间。"
 mcpegr.29.just_change:0 "我们有责任热情好客！"
 mcpegr.29.lazy_change:0 "我们可以让他们为我们做一些家务。"
 mcpegr.29.shy_change:0 "我们不想被打扰！"
 mcpe.30.t:0 "进步的承诺"
 mcpe.30.d:0 "导师提醒我，我曾答应在学业上多下功夫，可最近的进展仍不理想。或许是导师教得不好，但作出承诺的人毕竟是我。"
 mcpe.30.a:0 "我已经不在乎那个承诺了。"
 mcpe.30.b:0 "好吧，我再多学习一下。承诺就是承诺。"
 mcpe.30.c:0 "你怎么*敢*因为*你*的无能而责备*我*？！"
 mcpegr.30.d:0 "[child.GetTitledFirstName|U]曾答应导师要更加用功，可最近的进展仍不理想。我想知道[child.GetSheHe]会如何看待这个承诺，便亲自询问。\n\n"
 mcpegr.30.d_arbitrary:0 "[child.GetSheHe|U]已经不把当初的承诺放在心上。"
 mcpegr.30.d_diligent:0 "[child.GetSheHe|U]仍然重视当初的承诺，决定今后更加努力。"
 mcpegr.30.d_wrathful:0 "[child.GetSheHe|U]把责任全推给导师，认定是对方无能，才让自己的学业毫无进展。"
 mcpegr.30.confirm_arbitrary:0 "有时，承诺需要被打破。"
 mcpegr.30.confirm_diligent:0 "令人印象深刻，[child.GetFirstNameNoTooltip|U]。坚持下去。"
 mcpegr.30.confirm_wrathful:0 "这是可以理解的反应。"
 mcpegr.30.arbitrary_change:0 "为什么你还在乎那个承诺？"
 mcpegr.30.diligent_change:0 "承诺就是承诺。继续学习！"
 mcpegr.30.wrathful_change:0 "你不生这个无能导师的气吗？"
 mcpe.31.t:0 "八卦"
 mcpe.31.d.no_bully_fallback:0 "另一个孩子一直在散布关于我的恶毒谣言。或许对方只是想引人注意，又或许是出于嫉妒，但这并不能改变事情本身。"
 mcpe.31.d.bully:0 "[bully.GetTitledFirstName|U]一直在散布关于我的恶毒谣言。或许[bully.GetSheHe]只是想引人注意，又或许是出于嫉妒，但这并不能改变事情本身。"
 mcpe.31.a:0 "……在不同的情况下我们本可以成为朋友。"
 mcpe.31.b:0 "……任何不尊重我的人都会付出代价，无论他们的理由如何。"
 mcpe.31.c:0 "……我不在乎我的下属怎么看我。"
 mcpegr.31.d.no_bully_fallback:0 "另一个孩子一直在散布关于[child.GetTitledFirstName]的恶毒谣言。[child.GetFirstNameNoTooltip]认为，对方或许只是想引人注意，又或许是出于嫉妒。\n\n"
 mcpegr.31.d.bully:0 "[bully.GetTitledFirstName|U]一直在散布关于[child.GetTitledFirstName]的恶毒谣言。[child.GetFirstNameNoTooltip]认为，[bully.GetFirstNameNoTooltip]或许只是想引人注意，又或许是出于嫉妒。\n\n"
 mcpegr.31.d_forgiving:0 "[child.GetSheHe|U]觉得这种行为十分可怜，也不愿为此长久记恨对方。"
 mcpegr.31.d_vengeful:0 "[child.GetSheHe|U]不在乎对方为何这样做，只知道冒犯自己的人必须付出代价。"
 mcpegr.31.d_arrogant:0 "[child.GetSheHe|U]根本不把谣言放在心上，因为不值得在意远不如自己的人。"
 mcpegr.31.confirm_forgiving:0 "确实如此。真是浪费啊。"
 mcpegr.31.confirm_vengeful:0 "没错。让他们付出代价。"
 mcpegr.31.confirm_arrogant:0 "是啊，为什么要关心他们呢？"
 mcpegr.31.forgiving_change:0 "你们本来可以成为朋友的！"
 mcpegr.31.vengeful_change:0 "让没有人不尊重你！"
 mcpegr.31.arrogant_change:0 "何必去关心自己的下属呢？"
 mcpe.32.t:0 "小贼"
 mcpe.32.d:0 "在市场上，我看见一个衣衫褴褛的孩子躲在货箱后，趁人不备偷走了一些食物。[guardian.GetTitledFirstName|U]也注意到了，正等着我表态。"
 mcpe.32.a:0 "告诉偷窃他们的商人！"
 mcpe.32.b:0 "找到孩子并让他们为我们工作。"
 mcpe.32.c:0 "让我们给这个可怜的孩子一些食物吧！"
 mcpegr.32.d:0 "在市场上，我看见一个衣衫褴褛的孩子趁人不备偷走食物。[child.GetTitledFirstName|U]也注意到了，并对我说道：\n\n"
 mcpegr.32.d_honest:0 "“那个商人应该知道是谁偷了东西。”"
 mcpegr.32.d_ambitious:0 "“只要找到那个孩子，我们就能用食物让对方替我们做事。”"
 mcpegr.32.d_generous:0 "“我们应该给那个孩子一些食物，让对方不必再偷。”"
 mcpegr.32.confirm_honest:0 "是的，小偷需要被抓住。"
 mcpegr.32.confirm_ambitious:0 "好想法，[child.GetFirstNameNoTooltip|U]。"
 mcpegr.32.confirm_generous:0 "确实，让我们给予。"
 mcpegr.32.honest_change:0 "商家需要知道是谁偷了他们的东西！"
 mcpegr.32.ambitious_change:0 "我们为什么不让这个孩子为我们工作呢？"
 mcpegr.32.generous_change:0 "不，我们给这个可怜的孩子一些食物吧！"
 mcpe.33.t:0 "园艺"
 mcpe.33.d:0 "我最近开始学习园艺，可亲手照料的植物始终不见生长。导师说植物自有时节，但在我看来，这只是漫长而无聊的等待。"
 mcpe.33.a:0 "这太愚蠢了。我没有时间做这个。"
 mcpe.33.b:0 "没有必要为此而烦恼。"
 mcpe.33.c:0 "在某些方面，园艺很像统治一个国家。"
 mcpegr.33.d:0 "[child.GetTitledFirstName|U]最近开始学习园艺，可亲手照料的植物始终不见生长。我同[child.GetHerHim]谈起此事时，[child.GetSheHe]说道：\n\n"
 mcpegr.33.d_impatient:0 "“这太无聊了，我可没时间一直等下去！”"
 mcpegr.33.d_calm:0 "“没必要着急。没有人能立刻学会所有事情。”"
 mcpegr.33.d_content:0 "“照料花草已经足够令人满足，我不明白人们为何还要追逐权力和荣耀。”"
 mcpegr.33.confirm_impatient:0 "好吧，那就做点别的吧。"
 mcpegr.33.confirm_calm:0 "是的，这并没有什么可耻的。"
 mcpegr.33.confirm_content:0 "是的，对你所拥有的感到满意。"
 mcpegr.33.impatient_change:0 "你不应该在这上面浪费时间。"
 mcpegr.33.calm_change:0 "没有必要为此感到不安。"
 mcpegr.33.content_change:0 "现在你知道争取权力是多么毫无意义了吗？"
 mcpe.34.t:0 "午休时间"
 mcpe.34.d:0 "我看着士兵们在院中训练了一上午。午间休息时，我决定上前同他们说几句话。"
 mcpe.34.a:0 "...一些精彩的故事！"
 mcpe.34.b:0 "……我多么佩服他们啊！"
 mcpe.34.c:0 "……别再偷懒了！"
 mcpegr.34.d:0 "[child.GetTitledFirstName|U]看着士兵们训练了一上午。午间休息时，[child.GetSheHe]主动上前同他们交谈。\n\n"
 mcpegr.34.d_gregarious:0 "[child.GetSheHe|U]与士兵们互相讲起故事，很快便同众人打成一片。"
 mcpegr.34.d_humble:0 "[child.GetSheHe|U]感谢士兵们保护众人，这番赞许令他们十分受用。"
 mcpegr.34.d_sadistic:0 "[child.GetSheHe|U]命令士兵停止偷懒、继续训练，弄得众人十分不满。"
 mcpegr.34.confirm_gregarious:0 "分享故事总是很有趣。"
 mcpegr.34.confirm_humble:0 "尊重军人是件好事。"
 mcpegr.34.confirm_sadistic:0 "你听到[child.GetHerHim]了，回去训练吧！"
 mcpegr.34.gregarious_change:0 "[child.GetFirstNameNoTooltip|U]真的应该学会如何社交！"
 mcpegr.34.humble_change:0 "[child.GetFirstNameNoTooltip|U]应该尊重部队！"
 mcpegr.34.sadistic_change:0 "[child.GetFirstNameNoTooltip|U]应该阻止他们偷懒！"
 mcpe.35.t:0 "只是一个孩子"
 mcpe.35.d:0 "大人们总以我年纪尚小为由，不肯认真听取我的意见。我已经厌倦了这种轻视，也该想个办法改变他们的态度。"
 mcpe.35.a:0 "如果我想被像成年人一样对待，我就必须表现得像个成年人。"
 mcpe.35.b:0 "如果我喊得足够大声，他们就会*必须*听我的！"
 mcpe.35.c:0 "我什至不应该担心这个。"
 mcpegr.35.d:0 "[child.GetTitledFirstName|U]不满大人们总以年纪尚小为由轻视[child.GetHerHim]。思考许久后，[child.GetSheHe]告诉我：\n\n"
 mcpegr.35.d_temperate:0 "“若想让他们把我当作大人，我就得先表现得像个大人。”"
 mcpegr.35.d_stubborn:0 "“只要我的声音够大，他们迟早必须听我的！”"
 mcpegr.35.d_patient:0 "“我不必为此着急。等我长大，问题自然会消失。”"
 mcpegr.35.confirm_temperate:0 "是的，开始表现得像一个人。"
 mcpegr.35.confirm_stubborn:0 "是的，确实如此。"
 mcpegr.35.confirm_patient:0 "确实如此。无需担心。"
 mcpegr.35.temperate_change:0 "你应该开始表现得像个成年人了！"
 mcpegr.35.stubborn_change:0 "你只需要大声喊叫就可以了！"
 mcpegr.35.patient_change:0 "您只需要再等一会儿！"
 tradition_hd_mcpe_dummy_name:0 "MCPE兼容参数"
 tradition_hd_mcpe_dummy_desc:0 "供儿童性格事件系统使用的隐藏兼容定义。"
