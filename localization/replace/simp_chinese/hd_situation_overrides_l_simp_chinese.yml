 # 保留原版大草原显示名，只覆盖三个项目地图说明
 the_great_steppe_sub_region_steppe_west_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 西部草原覆盖凉州诸郡。河西走廊及其邻近边地连接中原与西域，水草、旱灾和严寒的变化不断影响当地牧群与迁徙。#!"
 the_great_steppe_sub_region_steppe_central_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 中部草原覆盖并州诸郡。这里位于农耕腹地与北方草原之间，山地、河谷和边塞共同塑造了逐水草而居的生活。#!"
 the_great_steppe_sub_region_steppe_east_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak 东部草原覆盖幽州诸郡。燕山南北与辽西边地构成通往东北草原的门户，季候变化会左右牧场肥力与游牧势力的迁徙方向。#!"
