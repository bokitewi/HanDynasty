 silk_road_situation_participant_group_silk_road_realm_desc:0 "该角色是非[nomadic|E][ruler|E]，其[realm|E]的一部分与[GetGeographicalRegion('dlc_tgp_silk_road_route_region').GetName]相连。"
 silk_road_situation_participant_group_silk_road_periphery_desc:0 "该角色是非[nomadic|E][ruler|E]，位于[GetGeographicalRegion('tgp_silk_road_region').GetName]内，但不属于更直接的丝路参与组。"
 visit_silk_road_market_decision_changan:0 "$building_changan_market_01$ #weak （[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_eastern_section').MakeScope.Var('innovation').CultureInnovationType.GetName]）#!"

